<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TreeTime | ניהול זמני עבודה</title>
<link rel="icon" type="image/png" href="/api/branding/logo" id="faviconLink">
<script>
  (function(){
    var v = Date.now();
    document.getElementById('faviconLink').href = '/api/branding/logo?v=' + v;
    document.addEventListener('DOMContentLoaded', function(){
      var img = document.getElementById('brandLogoImg');
      if(img) img.src = '/api/branding/logo?v=' + v;
    });
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Assistant:wght@400;500;600;700&family=Roboto+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#10241C;
    --ink-soft:#1D3327;
    --bg:#FAF9F4;
    --panel:#FFFFFF;
    --border:#E4E1D6;
    --muted:#6B7568;
    --green:#2F6F4E;
    --green-soft:#E7F1EA;
    --green-bright:#3F9863;
    --amber:#C9822A;
    --amber-soft:#FBEEDD;
    --red:#C0392B;
    --red-soft:#FBE7E4;
    --gold:#B08D3E;
    --shadow: 0 1px 2px rgba(16,36,28,0.04), 0 8px 24px rgba(16,36,28,0.06);
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Assistant', sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
  }
  h1,h2,h3,h4{ font-family:'Rubik', sans-serif; margin:0; }
  .mono{ font-family:'Roboto Mono', monospace; }

  /* ---------- LAYOUT ---------- */
  .app{ display:flex; min-height:100vh; }

  .sidebar{
    width:230px;
    background:var(--ink);
    color:#EFEAD9;
    display:flex;
    flex-direction:column;
    padding:22px 16px;
    flex-shrink:0;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    padding:6px 8px 22px 8px;
    border-bottom:1px solid rgba(239,234,217,0.12);
    margin-bottom:18px;
  }
  .brand-mark{
    width:38px;height:38px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .brand-mark img{ width:100%; height:100%; object-fit:contain; }
  .brand-text{ line-height:1.25; }
  .brand-text .t1{ font-family:'Rubik'; font-weight:700; font-size:15.5px; color:#FBF8EF; letter-spacing:.01em; }
  .brand-text .t2{ font-size:11.5px; color:#9FB0A2; }
  .brand-text .t3{ font-size:10px; color:#6E7D71; margin-top:1px; }

  .notif-bell-btn{
    display:flex; align-items:center; gap:10px; width:100%; margin-bottom:12px;
    padding:10px 12px; border-radius:10px; border:1px solid rgba(239,234,217,0.12);
    background:rgba(239,234,217,0.06); color:#C9D3C7; font-family:'Assistant'; font-size:14px; font-weight:600;
    cursor:pointer; position:relative; text-align:right;
  }
  .notif-bell-btn:hover{ background:rgba(239,234,217,0.12); color:#FBF8EF; }
  .notif-bell-btn svg{ width:17px; height:17px; flex-shrink:0; }
  .notif-badge{
    margin-right:auto; background:var(--red); color:#fff; font-size:10.5px; font-weight:700;
    border-radius:20px; padding:1px 7px; min-width:18px; text-align:center;
  }
  .notif-item{ padding:12px 14px; border-radius:10px; border:1px solid var(--border); margin-bottom:8px; cursor:pointer; background:#FCFBF7; }
  .notif-item.unread{ background:var(--green-soft); border-color:var(--green-bright); }
  .notif-item:hover{ border-color:var(--green-bright); }
  .notif-item .t{ font-weight:700; font-size:13.5px; }
  .notif-item .b{ font-size:12.5px; color:var(--muted); margin-top:3px; line-height:1.5; }
  .notif-item .time{ font-size:11px; color:var(--muted); margin-top:6px; }

  .nav{ display:flex; flex-direction:column; gap:3px; flex:1; }
  .nav-item{
    display:flex; align-items:center; gap:11px;
    padding:10px 12px; border-radius:10px;
    color:#C9D3C7; font-size:14.5px; font-weight:500;
    cursor:pointer; user-select:none; transition:.15s;
    border:1px solid transparent;
  }
  .nav-item svg{ width:18px;height:18px; flex-shrink:0; opacity:.85; }
  .nav-item:hover{ background:rgba(239,234,217,0.06); color:#FBF8EF; }
  .nav-item.active{
    background:rgba(63,152,99,0.18);
    color:#B7F0CB;
    border-color:rgba(63,152,99,0.35);
  }
  .nav-item .badge{
    margin-right:auto;
    background:var(--red); color:#fff; font-size:10.5px; font-weight:700;
    border-radius:20px; padding:1px 7px;
  }
  .sidebar-foot{
    border-top:1px solid rgba(239,234,217,0.12);
    padding-top:14px; margin-top:10px;
  }
  .role-switch{
    display:flex; background:rgba(239,234,217,0.06); border:1px solid rgba(239,234,217,0.1);
    border-radius:10px; padding:3px; gap:3px; margin-bottom:10px;
  }
  .role-btn{
    flex:1; background:transparent; border:none; color:#9FB0A2; font-family:'Assistant';
    font-size:12px; font-weight:700; padding:7px 6px; border-radius:8px; cursor:pointer; transition:.15s;
  }
  .role-btn:hover{ color:#FBF8EF; }
  .role-btn.active{ background:var(--green); color:#fff; }
  .user-switch{
    background:rgba(239,234,217,0.06);
    border:1px solid rgba(239,234,217,0.1);
    border-radius:10px; padding:10px 11px;
  }
  .user-switch label{ font-size:10.5px; color:#8FA192; display:block; margin-bottom:5px; font-weight:600; letter-spacing:.02em;}
  .user-switch select{
    width:100%; background:transparent; color:#FBF8EF; border:none; font-family:'Assistant';
    font-size:13.5px; font-weight:600; outline:none; cursor:pointer;
  }
  .user-switch select option{ color:#111; }

  /* ---------- ALTERNATE LAYOUT: TOP BAR INSTEAD OF SIDE SIDEBAR ---------- */
  body.nav-top .app{ flex-direction:column; }
  body.nav-top .sidebar{
    width:100%; flex-direction:row; flex-wrap:wrap; align-items:center;
    padding:12px 24px; gap:20px;
  }
  body.nav-top .brand{ border-bottom:none; padding:0; margin-bottom:0; }
  body.nav-top .global-timer-widget{
    flex-direction:row; flex-wrap:wrap; border-bottom:none; padding-bottom:0; margin-bottom:0; width:auto;
  }
  body.nav-top .global-timer-widget .fab-start{ width:auto; }
  body.nav-top .global-timer-widget .mini-timer-card{ width:auto; }
  body.nav-top .notif-bell-btn{ width:auto; margin-bottom:0; }
  body.nav-top .nav{ flex-direction:row; flex-wrap:wrap; flex:1; }
  body.nav-top .main{ margin:0 auto; width:100%; }

  .main{ flex:1; padding:26px 34px 60px; max-width:1360px; }
  .page-head{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:22px; gap:16px; flex-wrap:wrap;}
  .page-head h1{ font-size:24px; font-weight:700; }
  .page-head p{ margin:4px 0 0; color:var(--muted); font-size:13.5px; }

  /* ---------- BUTTONS ---------- */
  .btn{
    display:inline-flex; align-items:center; gap:7px;
    padding:10px 16px; border-radius:10px; border:1px solid transparent;
    font-family:'Assistant'; font-weight:700; font-size:14px;
    cursor:pointer; transition:.15s; white-space:nowrap;
  }
  .btn svg{ width:16px;height:16px; }
  .btn-primary{ background:var(--green); color:#fff; }
  .btn-primary:hover{ background:var(--green-bright); }
  .btn-ghost{ background:transparent; color:var(--ink); border-color:var(--border); }
  .btn-ghost:hover{ background:#F1EFE6; }
  .btn-danger-ghost{ background:transparent; color:var(--red); border-color:#EFD3CE; }
  .btn-danger-ghost:hover{ background:var(--red-soft); }
  .btn-sm{ padding:6px 11px; font-size:12.5px; border-radius:8px; }
  .btn-block{ width:100%; justify-content:center; }
  .icon-btn{
    width:32px;height:32px;border-radius:8px;border:1px solid var(--border);
    background:#fff; display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);
  }
  .icon-btn:hover{ background:#F1EFE6; color:var(--ink); }
  .icon-btn svg{ width:15px;height:15px; }

  /* ---------- CARDS / PANELS ---------- */
  .panel{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .panel-pad{ padding:20px; }
  .panel-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px; border-bottom:1px solid var(--border);
  }
  .panel-head h3{ font-size:15.5px; font-weight:700; }
  .panel-head .sub{ font-size:12px; color:var(--muted); font-weight:500; margin-top:2px;}

  /* ---------- SETTINGS SPLIT VIEW ---------- */
  .settings-layout{ display:grid; grid-template-columns:290px 1fr; gap:18px; align-items:start; }
  @media(max-width:900px){ .settings-layout{ grid-template-columns:1fr; } }
  .settings-cat-list{ overflow:hidden; }
  .settings-cat-row{
    display:flex; align-items:center; gap:11px; padding:14px 16px; cursor:pointer;
    border-bottom:1px solid var(--border); position:relative; user-select:none;
  }
  .settings-cat-row:last-child{ border-bottom:none; }
  .settings-cat-row:hover{ background:#FBFAF5; }
  .settings-cat-row svg{ width:18px; height:18px; color:var(--muted); flex-shrink:0; }
  .settings-cat-row .settings-cat-label{ font-size:13.5px; font-weight:600; flex:1; }
  .settings-cat-row.active{ background:var(--green-soft); }
  .settings-cat-row.active svg{ color:var(--green); }
  .settings-cat-row.active .settings-cat-label{ color:var(--green); }
  .settings-cat-row.active::after{ content:''; position:absolute; top:0; bottom:0; right:0; width:3px; background:var(--green); }

  .grid{ display:grid; gap:18px; }
  .grid-4{ grid-template-columns:repeat(4,1fr); }
  .grid-3{ grid-template-columns:repeat(3,1fr); }
  .grid-2{ grid-template-columns:2fr 1fr; }
  @media(max-width:1100px){ .grid-4{grid-template-columns:repeat(2,1fr);} .grid-2{grid-template-columns:1fr;} .grid-3{grid-template-columns:1fr;} }

  .stat-card{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:17px 18px; box-shadow:var(--shadow);
  }
  .stat-card .label{ font-size:12.5px; color:var(--muted); font-weight:600; display:flex; align-items:center; gap:7px;}
  .stat-card .value{ font-family:'Rubik'; font-size:28px; font-weight:700; margin-top:8px; }
  .stat-card .foot{ font-size:11.5px; color:var(--muted); margin-top:4px; }
  .stat-icon{
    width:30px;height:30px;border-radius:8px; display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .stat-icon svg{ width:15px;height:15px; }

  /* ---------- TABLE ---------- */
  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  thead th{
    text-align:right; font-size:11.5px; text-transform:none; color:var(--muted);
    font-weight:700; padding:9px 20px; border-bottom:1px solid var(--border); background:#FCFBF7;
    letter-spacing:.01em;
  }
  tbody td{ padding:12px 20px; border-bottom:1px solid #F1EFE6; vertical-align:middle; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:#FBFAF5; }
  .cell-muted{ color:var(--muted); font-size:12.5px; }
  .empty-row td{ padding:34px 20px; text-align:center; color:var(--muted); }

  .pill{ display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:700; }
  .pill-green{ background:var(--green-soft); color:var(--green); }
  .pill-amber{ background:var(--amber-soft); color:var(--amber); }
  .pill-red{ background:var(--red-soft); color:var(--red); }
  .pill-gray{ background:#EFEDE3; color:var(--muted); }
  .dot{ width:6px;height:6px;border-radius:50%; background:currentColor; }

  /* ---------- PROGRESS ---------- */
  .progress-track{ background:#EFEDE3; height:7px; border-radius:20px; overflow:hidden; width:100%; }
  .progress-fill{ height:100%; border-radius:20px; transition:width .3s; }

  /* ---------- BANNER ---------- */
  .banner{
    display:flex; align-items:flex-start; gap:11px;
    padding:13px 16px; border-radius:12px; margin-bottom:14px; font-size:13.5px; border:1px solid;
  }
  .banner svg{ width:17px;height:17px; flex-shrink:0; margin-top:1px; }
  .banner-red{ background:var(--red-soft); border-color:#F0CCC5; color:#8E2E22; }
  .banner-amber{ background:var(--amber-soft); border-color:#EFD8B0; color:#8A5A16; }
  .banner b{ font-weight:700; }
  .banner .sub{ opacity:.8; font-size:12.5px; margin-top:2px; }

  /* ---------- TIMER ---------- */
  .timer-live-card{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    background:var(--ink); color:#EFEAD9; border-radius:14px; padding:16px 18px;
    position:relative; overflow:hidden;
  }
  .timer-live-card.overtime{ background:#3A1712; }
  .timer-live-card .pulse{
    width:11px;height:11px;border-radius:50%; background:var(--green-bright); flex-shrink:0;
    box-shadow:0 0 0 0 rgba(63,152,99,0.6); animation:pulse 1.8s infinite;
  }
  .timer-live-card.overtime .pulse{ background:#E4695A; box-shadow:0 0 0 0 rgba(228,105,90,0.6); animation:pulse-red 1.4s infinite; }
  @keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(63,152,99,.55);} 70%{box-shadow:0 0 0 9px rgba(63,152,99,0);} 100%{box-shadow:0 0 0 0 rgba(63,152,99,0);} }
  @keyframes pulse-red{ 0%{box-shadow:0 0 0 0 rgba(228,105,90,.55);} 70%{box-shadow:0 0 0 9px rgba(228,105,90,0);} 100%{box-shadow:0 0 0 0 rgba(228,105,90,0);} }
  .timer-live-info{ display:flex; align-items:center; gap:12px; }
  .timer-live-text .name{ font-weight:700; font-size:14px; }
  .timer-live-text .meta{ font-size:12px; color:#9FB0A2; margin-top:1px;}
  .timer-live-clock{ font-family:'Roboto Mono'; font-size:22px; font-weight:600; letter-spacing:.02em; }

  .big-timer{
    text-align:center; padding:38px 20px 30px;
  }
  .big-timer .clock{ font-family:'Roboto Mono'; font-size:56px; font-weight:600; letter-spacing:.02em; }
  .big-timer .clock.idle{ color:#C8C3B2; }
  .big-timer .clock.running{ color:var(--green); }

  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; }
  .field select, .field input, .field textarea{
    width:100%; border:1px solid var(--border); border-radius:9px; padding:10px 12px;
    font-family:'Assistant'; font-size:14px; background:#fff; color:var(--ink); outline:none;
  }
  .field select:focus, .field input:focus, .field textarea:focus{ border-color:var(--green-bright); box-shadow:0 0 0 3px var(--green-soft); }
  .search-input{
    width:100%; border:1px solid var(--border); border-radius:12px; padding:13px 16px;
    font-family:'Assistant'; font-size:14.5px; background:var(--panel); color:var(--ink); outline:none;
    box-shadow:var(--shadow);
  }
  .search-input:focus{ border-color:var(--green-bright); box-shadow:0 0 0 3px var(--green-soft); }
  .search-input::placeholder{ color:var(--muted); }
  .field textarea{ resize:vertical; min-height:70px; }
  .field-row{ display:flex; gap:12px; }
  .field-row .field{ flex:1; }
  .hint{ font-size:11.5px; color:var(--muted); margin-top:4px; }
  .dashboard-widget{ min-height:60px; transition:opacity .15s; }
  .dashboard-widget[data-draggable="1"]{ cursor:grab; }
  .dashboard-widget.dragging{ opacity:.5; cursor:grabbing; box-shadow:0 8px 20px rgba(0,0,0,.2); z-index:5; }
  .widget-resize-arrow{
    position:absolute; width:20px; height:20px; border-radius:50%; border:1px solid var(--border);
    background:var(--panel); color:var(--muted); display:flex; align-items:center; justify-content:center;
    font-size:12px; line-height:1; opacity:.55; box-shadow:var(--shadow);
  }
  .widget-resize-arrow:hover{ opacity:1; border-color:var(--green-bright); color:var(--green-bright); }
  .widget-resize-arrow-w{ right:-8px; top:50%; margin-top:-10px; cursor:ew-resize; }
  .widget-resize-arrow-h{ bottom:-8px; left:50%; margin-left:-10px; cursor:ns-resize; }

  .checkbox-list{
    border:1px solid var(--border); border-radius:9px; background:#fff;
    max-height:190px; overflow-y:auto;
  }
  .checkbox-row{
    display:flex; align-items:center; gap:10px;
    padding:9px 12px; font-size:13.5px; cursor:pointer; border-bottom:1px solid #F1EFE6;
    transition:.1s;
  }
  .checkbox-row:last-child{ border-bottom:none; }
  .checkbox-row:hover{ background:#FBFAF5; }
  .checkbox-row input[type=checkbox]{
    width:16px; height:16px; accent-color:var(--green); cursor:pointer; flex-shrink:0;
  }

  /* ---------- MODAL ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(16,36,28,0.45); display:none;
    align-items:center; justify-content:center; z-index:100; padding:20px; backdrop-filter:blur(1px);
  }
  .modal-overlay.open{ display:flex; }
  .modal{
    background:#fff; border-radius:16px; width:100%; max-width:480px; max-height:88vh; overflow-y:auto;
    box-shadow:0 20px 60px rgba(16,36,28,0.25);
  }
  .modal.modal-wide{ max-width:840px; }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--border); }
  .modal-head h3{ font-size:16.5px; }
  .modal-body{ padding:20px 22px; }
  .modal-foot{ padding:16px 22px; border-top:1px solid var(--border); display:flex; gap:10px; justify-content:flex-start; }
  .modal-close{ cursor:pointer; color:var(--muted); background:none; border:none; padding:4px; }
  .modal-close svg{ width:19px;height:19px; }

  /* ---------- BARS (mini chart) ---------- */
  .bars{ display:flex; align-items:flex-end; gap:9px; height:120px; padding-top:6px; }
  .bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .bar-wrap{ flex:1; display:flex; align-items:flex-end; width:100%; justify-content:center; }
  .bar{ width:60%; max-width:26px; border-radius:6px 6px 3px 3px; background:linear-gradient(180deg, var(--green-bright), var(--green)); min-height:3px; }
  .bar-label{ font-size:10.5px; color:var(--muted); font-weight:600; }
  .bar-val{ font-size:10px; color:var(--ink); font-weight:700; }

  /* toast */
  .toast-wrap{ position:fixed; bottom:22px; left:22px; z-index:200; display:flex; flex-direction:column; gap:8px; }
  .toast{
    background:var(--ink); color:#FBF8EF; padding:12px 16px; border-radius:10px; font-size:13.5px;
    box-shadow:0 10px 30px rgba(0,0,0,0.25); display:flex; align-items:center; gap:9px; max-width:340px;
    animation:toast-in .2s ease-out;
  }
  @keyframes toast-in{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  .toast svg{ width:16px;height:16px; color:var(--green-bright); flex-shrink:0; }

  .avatar{
    width:28px;height:28px;border-radius:50%; background:var(--green-soft); color:var(--green);
    display:flex;align-items:center;justify-content:center; font-size:11.5px; font-weight:700; flex-shrink:0;
  }
  .row-flex{ display:flex; align-items:center; gap:9px; }

  .empty-state{ text-align:center; padding:40px 20px; color:var(--muted); }
  .empty-state svg{ width:34px;height:34px; margin-bottom:10px; opacity:.5; }
  .empty-state .t{ font-weight:700; color:var(--ink-soft); margin-bottom:3px; }

  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-thumb{ background:#DEDBCC; border-radius:20px; }

  .filters{ display:flex; gap:10px; flex-wrap:wrap; }
  .filters select, .filters input{
    border:1px solid var(--border); border-radius:9px; padding:8px 11px; font-family:'Assistant'; font-size:13px; background:#fff;
  }

  /* ---------- WEEKLY TIMELINE ---------- */
  .tl-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .tl-week-label{ font-weight:700; font-size:14px; }
  .tl-nav{ display:flex; align-items:center; gap:8px; }
  .tl-legend{ display:flex; flex-wrap:wrap; gap:8px 14px; margin-bottom:16px; }
  .tl-legend-item{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); font-weight:600; }
  .tl-legend-dot{ width:9px; height:9px; border-radius:3px; flex-shrink:0; }
  .tl-grid{ display:flex; flex-direction:row; border:1px solid var(--border); border-radius:12px; overflow:hidden; background:#fff; }
  .tl-day-col{
    flex:1; min-width:0; border-left:1px solid #F1EFE6; display:flex; flex-direction:column;
  }
  .tl-day-col:last-of-type{ border-left:none; }
  .tl-day-head{
    text-align:center; padding:9px 4px; border-bottom:1px solid var(--border); background:#FCFBF7;
  }
  .tl-day-head .d{ font-size:11.5px; font-weight:700; color:var(--ink-soft); }

/* ==================== REAL BACKEND INTEGRATION ==================== */
const API = '/api';
let authToken = localStorage.getItem('tt_dashboard_token');

async function apiCall(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      ...(authToken ? { Authorization: `Bearer ${authToken}` } : {}),
      ...(opts.headers || {}),
    },
  });
  const data = await res.json().catch(() => null);
  if (!res.ok) throw new Error(data?.message || data?.error || `HTTP ${res.status}`);
  return data;
}

async function downloadClientField(projectId, fieldId, fileName){
  try{
    const res = await fetch(`${API}/projects/${projectId}/fields/${fieldId}/file`, {
      headers: authToken ? { Authorization: `Bearer ${authToken}` } : {},
    });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fileName || 'file';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }catch(err){ toast('שגיאה בהורדת הקובץ: '+err.message); }
}

async function apiUpload(path, file){
  const form = new FormData();
  form.append('file', file);
  const res = await fetch(API + path, {
    method: 'POST',
    headers: authToken ? { Authorization: `Bearer ${authToken}` } : {},
    body: form,
  });
  const data = await res.json().catch(() => null);
  if (!res.ok) throw new Error(data?.message || data?.error || `HTTP ${res.status}`);
  return data;
}

function renderNotifBell(){
  const btn = document.getElementById('notifBellBtn');
  if(!btn) return;
  const unread = state.notifications.filter(n=>!n.read).length;
  btn.innerHTML = `
    ${ICON.bell}<span>התראות</span>
    <span class="notif-badge ${unread?'':'hidden'}">${unread}</span>
  `;
}

function notifTimeAgo(iso){
  const mins = Math.floor((Date.now()-new Date(iso).getTime())/60000);
  if(mins < 1) return 'עכשיו';
  if(mins < 60) return `לפני ${mins} דק'`;
  const hours = Math.floor(mins/60);
  if(hours < 24) return `לפני ${hours} שע'`;
  return fmtDateHe(iso.slice(0,10));
}

async function saveGuideVideo(videoId){

/* --- mapping: server rows (numbers, snake_case) -> local state shape (strings, camelCase) --- */
function mapFreelancer(e){
  return {
    id: String(e.id), publicId: e.public_id, name: e.full_name, email: e.email, phone: e.phone||'',
    role: e.role||'employee', active: e.active, businessType: e.business_type||'', foreignWorker: !!e.foreign_worker,
    hourlyRate: String(e.hourly_rate||0), notes: e.notes||'',
    bankBeneficiary: e.bank_beneficiary||'', bankName: e.bank_name||'', bankBranch: e.bank_branch||'',
    bankAccount: e.bank_account||'', bankTaxId: e.bank_tax_id||'',
    fieldValues: e.field_values||{},
  };
}
function mapEmployeeField(f){
  return { id: String(f.id), key: f.key, label: f.label, type: f.field_type, options: f.options||[], active: f.active };
}
function mapTicket(t){
  return {
    id: String(t.id), subject: t.subject, status: t.status, priority: t.priority,
    createdAt: t.created_at, updatedAt: t.updated_at,
  };
}
function mapEditRequest(r){
  return {
    id: String(r.id), entryId: String(r.entry_id), freelancerId: String(r.employee_id), reason: r.reason,
    status: r.status, adminNote: r.admin_note||'', requestedAt: r.requested_at, resolvedAt: r.resolved_at,
  };
}
function mapClient(p){
  return {
    id: String(p.id), name: p.name, businessName: p.business_name||'',
    phone: p.contact_phone||'', email: p.contact_email||'', active: !p.archived,
    description: p.description||'', useHoursBank: p.use_hours_bank, monthlyQuota: Number(p.monthly_quota_hours)||0,
    paymentMethod: p.payment_method||'hours_bank', hourlyRate: Number(p.hourly_rate)||0,
    linkedFreelancerIds: (p.linked_employee_ids||[]).map(String),
    createdByName: p.created_by_name||'', updatedByName: p.updated_by_name||'',
    serialNumber: p.serial_number||null, instanceId: p.instance_id||'', createdAt: p.created_at,
    fieldValues: p.field_values||{},
  };
}
function mapClientField(f){
  return { id: String(f.id), key: f.key, label: f.label, type: f.field_type, options: f.options||[], active: f.active };
}
function toHM(iso){ const d = new Date(iso); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function toDateStr(iso){ return new Date(iso).toISOString().slice(0,10); }
function mapEntry(t){
  const minutes = Math.round((new Date(t.ended_at)-new Date(t.started_at))/60000);
  return {
    id: String(t.id), freelancerId: String(t.employee_id), clientId: t.project_id?String(t.project_id):null,
    taskId: t.task_id?String(t.task_id):null,
    date: toDateStr(t.started_at), start: toHM(t.started_at), end: toHM(t.ended_at), minutes,
    description: t.description||'', rateSnapshot: Number(t.rate_snapshot)||0, cost: Number(t.cost)||0,
  };
}
function mapActiveTimer(t){
  return { id: String(t.id), freelancerId: String(t.employee_id), clientId: t.project_id?String(t.project_id):null, taskId: t.task_id?String(t.task_id):null, startedAt: t.started_at, pausedAt: t.paused_at, pausedSeconds: t.paused_seconds||0 };
}
function mapTask(t){
  return {
    id: String(t.id), clientId: t.project_id?String(t.project_id):null, freelancerId: t.employee_id?String(t.employee_id):null,
    description: t.description||'', deadline: t.deadline?toDateStr(t.deadline):null, status: t.status,
    createdAt: t.created_at, updatedAt: t.updated_at,
  };
}

async function refreshData(){
  const [employees, projects, entries, editRequests, clientFields, intakeLinks, notificationSettings, employeeFields, employeeIntakeLinks, tickets, notifications, tasks, dashboardWidgets, timerSettings, apiKeys] = await Promise.all([
    apiCall('/employees'),
    apiCall('/projects'),
    apiCall('/time-entries'),
    apiCall('/edit-requests'),
    apiCall('/client-fields?include_inactive=true'),
    apiCall('/client-intake-links'),
    apiCall('/notification-settings'),
    apiCall('/employee-fields?include_inactive=true'),
    apiCall('/employee-intake-links'),
    apiCall('/tickets'),
    apiCall('/notifications'),
    apiCall('/tasks'),
    // Frontend and backend deploy as two independent, unsynchronized CI jobs, so there's
    // a brief window right after a push where this endpoint (or its migration) might not
    // exist on the server yet. Isolate it so that window can't break login for everyone.
    apiCall('/dashboard-widgets').catch(() => []),
    apiCall('/timer-settings').catch(() => ({ max_concurrent_timers: 3 })),
    // /api-keys is admin-only server-side (403 for employees) -- skip the call
    // entirely for non-admins instead of letting it fail the whole Promise.all.
    isAdmin() ? apiCall('/api-keys') : Promise.resolve([]),
  ]);
  state.freelancers = employees.map(mapFreelancer);
  state.clients = projects.map(mapClient);
  state.entries = entries.filter(t=>t.ended_at).map(mapEntry);
  state.activeTimers = entries.filter(t=>!t.ended_at).map(mapActiveTimer);
  state.editRequests = editRequests.map(mapEditRequest);
  state.clientFields = clientFields.map(mapClientField);
  state.intakeLinks = intakeLinks;
  state.notificationSettings = notificationSettings;
  state.employeeFields = employeeFields.map(mapEmployeeField);
  state.employeeIntakeLinks = employeeIntakeLinks;
  state.notifications = notifications;
  state.supportTickets = tickets.map(mapTicket);
  state.tasks = tasks.map(mapTask);
  state.dashboardWidgets = dashboardWidgets;
  state.timerSettings = timerSettings;
  state.apiKeys = apiKeys;
}

    document.getElementById('appRoot').style.display = '';

function isSameMonth(dateStr, ref=new Date()){

function clientWeeklyTrend(clientId){

    const mins = state.entries.filter(e=>{

function freelancerMonthMinutes(freelancerId){

function freelancerWeeklyTrend(freelancerId){

    const start = new Date(end); start.setDate(start.getDate()-6);
    const mins = state.entries.filter(e=>{

  }

function totalMonthMinutes(){

function lastEntryDateFor(freelancerId){

  return list.length ? list[0].date : null;

function daysSince(dateStr){
  if(!dateStr) return null;
  const d1 = new Date(dateStr+'T00:00:00'), d2 = new Date(); d2.setHours(0,0,0,0);
  return Math.round((d2-d1)/86400000);
}
/* elapsedMinutes/elapsedClock take the full timer object (not just startedAt) so the
   result freezes while paused: whatever's already banked in pausedSeconds, plus the
   ongoing span since pausedAt if it's paused right now, is subtracted from raw elapsed. */
function timerPausedSecondsSoFar(t){
  const base = t.pausedSeconds||0;
  if(t.pausedAt) return base + Math.max(0, Math.floor((Date.now() - new Date(t.pausedAt).getTime())/1000));
  return base;
}
function elapsedMinutes(t){
  return Math.floor(((Date.now() - new Date(t.startedAt).getTime())/1000 - timerPausedSecondsSoFar(t))/60);
}
function elapsedClock(t){
  const totalSec = Math.max(0, Math.floor((Date.now() - new Date(t.startedAt).getTime())/1000 - timerPausedSecondsSoFar(t)));
  const h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60), s = totalSec%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function nowTimeStr(){
  const d = new Date();
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function minutesBetween(start,end){
  const [sh,sm] = start.split(':').map(Number), [eh,em] = end.split(':').map(Number);
  let diff = (eh*60+em) - (sh*60+sm);
  if(diff<0) diff += 24*60;
  return diff;
}

/* פונקציית עזר גנרית: מקבלת שם קובץ ומערך גיליונות {name, rows}, ומורידה קובץ xlsx */
function exportToExcel(filename, sheets){
  if(typeof XLSX === 'undefined'){
    toast('טעינת ספריית האקסל נכשלה — ודא חיבור לאינטרנט ונסה שוב');
    return;
  }
  const wb = XLSX.utils.book_new();
  sheets.forEach(sheet=>{
    const ws = XLSX.utils.json_to_sheet(sheet.rows);
    XLSX.utils.book_append_sheet(wb, ws, sheet.name.slice(0,31)); // שם גיליון מוגבל ל-31 תווים
  });
  XLSX.writeFile(wb, `${filename}.xlsx`);
  toast('קובץ האקסל יוצא בהצלחה');
}
function todayFileStamp(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

async function importClientsFromFile(){
  const fileInput = document.getElementById('importClientsFile');
  const msgEl = document.getElementById('importClientsMsg');
  const btn = document.getElementById('importClientsBtn');
  const file = fileInput.files[0];
  if(!file){ msgEl.textContent = 'יש לבחור קובץ תחילה'; return; }
  if(typeof XLSX === 'undefined'){ msgEl.textContent = 'טעינת ספריית האקסל נכשלה — ודא חיבור לאינטרנט ונסה שוב'; return; }

  btn.disabled = true;
  msgEl.textContent = 'קורא קובץ...';

  try{
    const isCsv = /\.csv$/i.test(file.name);
    const wb = isCsv
      ? XLSX.read(await file.text(), { type:'string' })
      : XLSX.read(await file.arrayBuffer(), { type:'array' });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { defval:'' });

    if(!rows.length){ msgEl.textContent = 'הקובץ ריק או שלא ניתן היה לקרוא אותו'; btn.disabled = false; return; }

    let created = 0, failed = 0;
    const errors = [];
    for(const row of rows){
      const businessName = String(row['שם העסק']||'').trim();
      const contactName = String(row['איש קשר']||'').trim();
      if(!businessName && !contactName){ failed++; continue; }

      const statusRaw = String(row['סטטוס']||'').trim();
      const active = statusRaw !== 'לא פעיל';
      const quotaRaw = row['בנק שעות (שעות בחודש)'];
      const quota = Number(quotaRaw);
      const useHoursBank = !isNaN(quota) && quota > 0;

      const body = {
        name: businessName || contactName,
        business_name: businessName,
        contact_phone: String(row['נייד']||'').trim(),
        contact_email: String(row['דוא"ל']||row['דואל']||'').trim(),
        description: String(row['תיאור']||'').trim(),
        archived: !active,
        payment_method: useHoursBank ? 'hours_bank' : 'hourly',
        monthly_quota_hours: useHoursBank ? quota : 0,
      };

      msgEl.textContent = `מייבא... ${created+failed+1}/${rows.length}`;
      try{
        await apiCall('/projects', { method:'POST', body: JSON.stringify(body) });
        created++;
      }catch(err){
        failed++;
        errors.push(`${businessName||contactName}: ${err.message}`);
      }
    }

    await refreshData();
    renderAll();
    msgEl.textContent = `יובאו ${created} לקוחות בהצלחה${failed?`, ${failed} נכשלו`:''}`;
    if(errors.length) console.warn('שגיאות ייבוא לקוחות:', errors);
    toast(`יובאו ${created} לקוחות${failed?`, ${failed} נכשלו`:''}`);
  }catch(err){
    msgEl.textContent = 'שגיאה בקריאת הקובץ: '+err.message;
  }
  btn.disabled = false;
}

const PAGE_SLUGS = {
  dashboard: 'dashboard', clients: 'clients', reports: 'reports',
  editRequests: 'edit-requests', support: 'support', freelancers: 'users', settings: 'settings',
  guides: 'guides', myAccount: 'account', tasks: 'tasks',
};
const SLUG_TO_PAGE = Object.fromEntries(Object.entries(PAGE_SLUGS).map(([k,v])=>[v,k]));

function pageSlugFromPath(){
  const m = location.pathname.match(/^\/c\/[a-zA-Z0-9-]+\/?([a-zA-Z0-9-]*)/);
  return m ? (m[1]||'') : '';
}

function navigateToPage(pageId, replace){
  activePage = pageId;
  if(state.companySlug){
    const url = `/c/${state.companySlug}/${PAGE_SLUGS[pageId]||''}`;
    if(replace) history.replaceState({page:pageId}, '', url);

}

    <div class="modal-body">
      <div class="hint" style="margin-bottom:12px;">האימייל הנוכחי: ${me?.email||'—'}</div>
      <div class="field"><label>אימייל חדש</label><input type="email" id="ceNew" autocomplete="username"></div>
      <div class="field"><label>סיסמה נוכחית (לאימות)</label><input type="password" id="cePassword" autocomplete="current-password"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-primary" onclick="submitChangeEmail()">${ICON.check} שנה אימייל</button>
      <button class="btn btn-ghost" onclick="closeModal()">ביטול</button>
    </div>
    <div class="error hidden" id="ceError" style="color:var(--red);font-size:13px;padding:0 20px 14px;"></div>
  `);
}

async function submitChangeEmail(){
  const new_email = document.getElementById('ceNew').value.trim();
  const current_password = document.getElementById('cePassword').value;
  const errEl = document.getElementById('ceError');
  errEl.classList.add('hidden');
  if(!new_email){ errEl.textContent = 'יש להזין אימייל חדש'; errEl.classList.remove('hidden'); return; }
  try{
    await apiCall('/auth/change-email', { method:'POST', body: JSON.stringify({ current_password, new_email }) });
    closeModal();
    toast('האימייל שונה בהצלחה — יש להשתמש בו בכניסה הבאה');
    await refreshData();
    renderAll();
  }catch(err){
    errEl.textContent = err.message;
    errEl.classList.remove('hidden');
  }
}

/* ---------------------------- MODAL ---------------------------- */
function openModal(html, wide){
  const box = document.getElementById('modalBox');
  box.innerHTML = html;
  box.classList.toggle('modal-wide', !!wide);
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
  const box = document.getElementById('modalBox');
  box.innerHTML = '';
  box.classList.remove('modal-wide');
}
document.getElementById('modalOverlay').addEventListener('click', (e)=>{
  if(e.target.id==='modalOverlay') closeModal();
});

let userClientSearchQuery = '';
function renderUserClientSearchResultsHtml(){
  const q = userClientSearchQuery.trim().toLowerCase();
  const pool = clientsForFreelancer(state.currentUserId);
  const list = !q ? pool : pool.filter(c=>
    (c.name||'').toLowerCase().includes(q) ||
    (c.businessName||'').toLowerCase().includes(q) ||
    (c.phone||'').toLowerCase().includes(q) ||
    (c.email||'').toLowerCase().includes(q)
  );
  if(!list.length) return `<div class="cell-muted" style="font-size:13px;">${q?'לא נמצאו לקוחות תואמים':'אין לקוחות זמינים'}</div>`;

    <div style="padding:9px 0; border-bottom:1px solid var(--border); font-size:13.5px;">
      <b>${clientDisplayName(c)}</b>
      <div class="cell-muted" style="font-size:12px; margin-top:2px;">${c.phone||'ללא טלפון'}${c.email?` · ${c.email}`:''}</div>
    </div>
  `).join('');
}
function onUserClientSearchInput(el){
  userClientSearchQuery = el.value;
  const wrap = document.getElementById('userClientSearchResults');
  if(wrap) wrap.innerHTML = renderUserClientSearchResultsHtml();
}

function renderDashboard(){
  const overQuotaClients = state.clients.filter(c=>c.useHoursBank && c.monthlyQuota>0).map(c=>{
    const used = clientMonthMinutes(c.id);
    const pct = used/(c.monthlyQuota*60)*100;
    return {...c, used, pct};
  }).filter(c=>c.pct>=80);

  // banners
  let banners = '';
  const overtimeTimers = state.activeTimers.filter(t=>elapsedMinutes(t)>=240);
  if(overtimeTimers.length){
    banners += `<div class="banner banner-red">${ICON.alert}
      <div><b>שעון עבודה פתוח מעל 4 שעות</b>
      <div class="sub">${overtimeTimers.map(t=>{
        const f=getFreelancer(t.freelancerId), c=getClient(t.clientId);
        return `${f?.name} על ${clientDisplayName(c)} (${elapsedClock(t)})`;
      }).join(' · ')} — נשלחה התראה למנהל המערכת (סימולציה)</div></div>
    </div>`;
  }
  if(overQuotaClients.length){
    banners += `<div class="banner banner-amber">${ICON.bell}
      <div><b>לקוחות שהתקרבו למכסת השעות החודשית</b>
      <div class="sub">${overQuotaClients.map(c=>`${clientDisplayName(c)} (${Math.round(c.pct)}%)`).join(' · ')} — נשלחה התראת מייל למנהל (סימולציה)</div></div>
    </div>`;
  }
  const pendingReqCount = pendingEditRequestsCount();
  if(pendingReqCount){
    banners += `<div class="banner banner-amber">${ICON.request}
      <div><b>${pendingReqCount} בקשות עריכת דיווח ממתינות לאישור</b>
      <div class="sub">היכנס ל"בקשות עריכה" בתפריט כדי לאשר או לדחות</div></div>
    </div>`;
  }
  const unseenIntakes = state.intakeLinks.filter(l=>l.used && !l.seen);
  if(unseenIntakes.length){
    banners += `<div class="banner banner-amber">${ICON.mail}
      <div><b>${unseenIntakes.length} לקוחות חדשים נרשמו דרך לינק עצמאי</b>
      <div class="sub">${unseenIntakes.map(l=>`${l.created_project_name||'לקוח חדש'} <a href="#" onclick="acknowledgeIntake(${l.id}); return false;" style="color:inherit;font-weight:700;">(סמן כנקרא)</a>`).join(' · ')}</div></div>
    </div>`;
  }
  const unseenEmployeeIntakes = state.employeeIntakeLinks.filter(l=>l.used && !l.seen);
  if(unseenEmployeeIntakes.length){
    banners += `<div class="banner banner-amber">${ICON.mail}
      <div><b>${unseenEmployeeIntakes.length} עובדים חדשים נרשמו דרך לינק עצמאי</b>
      <div class="sub">${unseenEmployeeIntakes.map(l=>`${l.created_employee_name||'עובד חדש'} <a href="#" onclick="acknowledgeEmployeeIntake(${l.id}); return false;" style="color:inherit;font-weight:700;">(סמן כנקרא)</a>`).join(' · ')}</div></div>
    </div>`;
  }

  // weekly bars - last 6 weeks
  const weeks = [];
  for(let i=5;i>=0;i--){
    const end = new Date(); end.setDate(end.getDate() - i*7);
    const start = new Date(end); start.setDate(start.getDate()-6);
    const mins = state.entries.filter(e=>{
      const d = new Date(e.date+'T00:00:00');
      return d>=start && d<=end;
    }).reduce((s,e)=>s+e.minutes,0);
    weeks.push({ label: `${start.getDate()}/${start.getMonth()+1}`, mins });
  }
  const maxWeek = Math.max(1, ...weeks.map(w=>w.mins));

  const html = `
    <div class="page-head">
      <div>
        <h1>דשבורד ראשי</h1>
        <p>תמונת מצב כללית של זמני העבודה, הלקוחות והצוות — החודש הנוכחי</p>
      </div>
    </div>

    ${banners}

    ${renderDashboardWidgetsSection()}

    <div style="display:flex; flex-wrap:wrap; gap:12px; margin-top:18px;">
      <div class="panel" style="flex:1 1 420px;">
        <div class="panel-head"><h3>מגמת שעות — 6 שבועות אחרונים</h3></div>
        <div class="panel-pad">
          <div class="bars">
            ${weeks.map(w=>`
              <div class="bar-col">
                <div class="bar-val">${w.mins? fmtHoursShort(w.mins):''}</div>
                <div class="bar-wrap"><div class="bar" style="height:${Math.max(4,(w.mins/maxWeek*100))}%;"></div></div>
                <div class="bar-label">${w.label}</div>
              </div>
            `).join('')}
          </div>
        </div>
      </div>

      <div class="panel" style="flex:1 1 420px;">
        <div class="panel-head">
          <h3>כל השעונים הפתוחים במערכת</h3>
          <div class="sub">${state.activeTimers.length} פעילים</div>
        </div>
        <div id="allTimersWrap">
        </div>
      </div>
    </div>
  `;
  return html;
}

function renderOneDashboardWidget(w, admin){
  const deleteButton = admin ? `<button class="icon-btn" title="הסר מהדשבורד" onclick="removeDashboardWidget(${w.id})">${ICON.trash}</button>` : '';
  // Press-and-hold arrow handles: one stretches width, one stretches height. No preset sizes anymore.
  const resizeHandles = admin ? `
    <div class="widget-resize-arrow widget-resize-arrow-w" title="לחץ והחזק כדי למתוח לרוחב">↔</div>
    <div class="widget-resize-arrow widget-resize-arrow-h" title="לחץ והחזק כדי למתוח לגובה">↕</div>
  ` : '';
  const draggableAttr = admin ? `data-draggable="1"` : '';

  if(w.type==='kpi'){
    const val = (w.value===null || w.value===undefined) ? '—' : (Number.isInteger(w.value) ? w.value : w.value.toFixed(1));
    const sizeStyle = (w.width_px?`width:${w.width_px}px; flex:0 0 auto;`:'flex:1 1 220px;') + (w.height_px?`height:${w.height_px}px;`:'');
    return `
      <div class="panel dashboard-widget" data-widget-id="${w.id}" ${draggableAttr} style="padding:14px 16px; min-width:200px; position:relative; box-sizing:border-box; ${sizeStyle}">
        <div class="cell-muted" style="font-size:12.5px;">${w.title}</div>
        <div style="display:flex; align-items:flex-end; justify-content:space-between; gap:8px; flex-wrap:wrap;">
          <div style="font-size:26px; font-weight:800;">${val}</div>
          <div style="display:flex; gap:4px; flex-shrink:0; flex-wrap:wrap; justify-content:flex-end;">
            ${admin?`<button class="icon-btn" title="ערוך" onclick="openEditKpiWidgetModal(${w.id})">${ICON.edit}</button>`:''}
            ${deleteButton}
          </div>
        </div>
        ${resizeHandles}
      </div>`;
  }
  if(w.type==='chart'){
    const sizeStyle = (w.width_px?`width:${w.width_px}px; flex:0 0 auto;`:'flex:1 1 320px;') + (w.height_px?`height:${w.height_px}px; overflow:auto;`:'');
    return `
      <div class="panel dashboard-widget" data-widget-id="${w.id}" ${draggableAttr} style="padding:14px 16px; position:relative; box-sizing:border-box; ${sizeStyle}">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; flex-wrap:wrap; gap:6px;">
          <div style="font-weight:700;">${w.title}</div>
          <div style="display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end;">
            ${admin?`<button class="icon-btn" title="ערוך" onclick="openEditChartWidgetModal(${w.id})">${ICON.edit}</button>`:''}
            ${deleteButton}
          </div>
        </div>
        ${renderChartBars(w.config, w.data)}
        ${resizeHandles}

// Shared renderer for chart-widget bars, used both on the live dashboard (with
// server-computed w.data) and inside the builder's preview (with fresh data
// from /chart/preview) so the two never drift visually.
function chartValueLabel(config, rawLabel){
  if(rawLabel===null || rawLabel===undefined || rawLabel==='') return 'ללא';
  if(config.data_source==='tasks' && config.group_by==='status') return TASK_STATUS_LABEL[rawLabel] || rawLabel;
  const map = CHART_VALUE_LABELS[`${config.data_source}:${config.group_by}`];
  return (map && map[rawLabel]) || rawLabel;
}
function renderChartBars(config, data){
  if(!data || !data.length) return `<div class="cell-muted">אין נתונים להצגה</div>`;
  const max = Math.max(1, ...data.map(d=>d.value));
  return data.map(d=>{
    const pct = Math.round((d.value/max)*100);
    const valueText = Number.isInteger(d.value) ? d.value : d.value.toFixed(1);
    return `<div style="margin-bottom:9px;">
      <div style="display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:3px;">
        <span>${chartValueLabel(config, d.label)}</span><span style="font-weight:700;">${valueText}</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%; background:var(--green);"></div></div>
    </div>`;
  }).join('');
}

// Press-and-hold the ↔ arrow, then drag left/right to stretch the widget's width.
let resizingWidgetW = null;
function onWidgetWidthResizeStart(e){
  e.preventDefault();
  const el = e.target.closest('.dashboard-widget');
  if(!el) return;
  resizingWidgetW = { el, id: Number(el.dataset.widgetId), startX: e.clientX, startW: el.offsetWidth };
  document.addEventListener('mousemove', onWidgetWidthResizeMove);
  document.addEventListener('mouseup', onWidgetWidthResizeEnd);
}
function onWidgetWidthResizeMove(e){
  if(!resizingWidgetW) return;
  const dx = e.clientX - resizingWidgetW.startX;
  const dir = document.documentElement.dir === 'rtl' || getComputedStyle(document.body).direction === 'rtl' ? -1 : 1;
  const w = Math.max(200, resizingWidgetW.startW + dir*dx);
  resizingWidgetW.el.style.width = w+'px';
  resizingWidgetW.el.style.flex = '0 0 auto';
  resizingWidgetW.width = Math.round(w);
}
async function onWidgetWidthResizeEnd(){
  document.removeEventListener('mousemove', onWidgetWidthResizeMove);
  document.removeEventListener('mouseup', onWidgetWidthResizeEnd);
  if(!resizingWidgetW) return;
  const { id, width } = resizingWidgetW;
  resizingWidgetW = null;
  if(!width) return;
  try{
    await apiCall(`/dashboard-widgets/${id}`, { method:'PATCH', body: JSON.stringify({ width_px: width }) });
    const w = (state.dashboardWidgets||[]).find(x=>x.id===id);
    if(w) w.width_px = width;
  }catch(err){ toast('שגיאה בשמירת רוחב: '+err.message); }
}

// Press-and-hold the ↕ arrow, then drag up/down to stretch the widget's height.
let resizingWidgetH = null;
function onWidgetHeightResizeStart(e){
  e.preventDefault();
  const el = e.target.closest('.dashboard-widget');
  if(!el) return;
  resizingWidgetH = { el, id: Number(el.dataset.widgetId), startY: e.clientY, startH: el.offsetHeight };
  document.addEventListener('mousemove', onWidgetHeightResizeMove);
  document.addEventListener('mouseup', onWidgetHeightResizeEnd);
}
function onWidgetHeightResizeMove(e){
  if(!resizingWidgetH) return;
  const dy = e.clientY - resizingWidgetH.startY;
  const h = Math.max(60, resizingWidgetH.startH + dy);
  resizingWidgetH.el.style.height = h+'px';
  resizingWidgetH.height = Math.round(h);
}
async function onWidgetHeightResizeEnd(){
  document.removeEventListener('mousemove', onWidgetHeightResizeMove);
  document.removeEventListener('mouseup', onWidgetHeightResizeEnd);
  if(!resizingWidgetH) return;
  const { id, height } = resizingWidgetH;
  resizingWidgetH = null;
  if(!height) return;
  try{
    await apiCall(`/dashboard-widgets/${id}`, { method:'PATCH', body: JSON.stringify({ height_px: height }) });
    const w = (state.dashboardWidgets||[]).find(x=>x.id===id);

}

// Long mouse press (350ms, without moving off the widget) starts a drag; moving the mouse
// live-reorders the DOM among sibling widgets; releasing persists the new order.
let dragPending = null;
let dragActive = null;
function onWidgetDragMouseDown(e){
  if(e.button !== 0) return;
  if(e.target.closest('button, select, input, a, .widget-resize-arrow')) return;
  const el = e.currentTarget;
  dragPending = { el, startX: e.clientX, startY: e.clientY };
  dragPending.timer = setTimeout(()=>{
    if(!dragPending) return;
    dragActive = { el: dragPending.el };
    dragPending = null;
    el.classList.add('dragging');
    document.body.style.userSelect = 'none';
  }, 350);
  document.addEventListener('mousemove', onWidgetDragMouseMove);
  document.addEventListener('mouseup', onWidgetDragMouseUp);
}
function onWidgetDragMouseMove(e){
  if(dragPending){
    if(Math.abs(e.clientX-dragPending.startX)>6 || Math.abs(e.clientY-dragPending.startY)>6){
      clearTimeout(dragPending.timer);
      dragPending = null;
    }
    return;
  }
  if(!dragActive) return;
  const hit = document.elementFromPoint(e.clientX, e.clientY);
  const targetWidget = hit && hit.closest('.dashboard-widget');
  if(!targetWidget || targetWidget === dragActive.el) return;
  const container = targetWidget.parentElement;
  if(container !== dragActive.el.parentElement) return;
  const rect = targetWidget.getBoundingClientRect();
  const before = (e.clientX - rect.left) < rect.width/2;
  container.insertBefore(dragActive.el, before ? targetWidget : targetWidget.nextSibling);
}
async function onWidgetDragMouseUp(){
  document.removeEventListener('mousemove', onWidgetDragMouseMove);
  document.removeEventListener('mouseup', onWidgetDragMouseUp);
  if(dragPending){ clearTimeout(dragPending.timer); dragPending = null; }
  if(!dragActive) return;
  const el = dragActive.el;
  el.classList.remove('dragging');
  document.body.style.userSelect = '';
  dragActive = null;
  const order = Array.from(el.parentElement.querySelectorAll('.dashboard-widget')).map(x=>Number(x.dataset.widgetId));
  try{
    await apiCall('/dashboard-widgets/reorder', { method:'POST', body: JSON.stringify({ order }) });
    await refreshData();
    renderAll();
  }catch(err){ toast('שגיאה בשמירת הסדר: '+err.message); }
}

async function fetchListWidgetRows(config){
  const f = config.filters || {};
  if(config.source==='time_entries'){
    const qs = new URLSearchParams();
    if(f.employee_id) qs.set('employee_id', f.employee_id);
    if(f.project_id) qs.set('project_id', f.project_id);
    if(f.date_from) qs.set('from', f.date_from);
    if(f.date_to) qs.set('to', f.date_to);
    const rows = await apiCall(`/time-entries?${qs.toString()}`);
    return rows.slice(0,10);
  }
  if(config.source==='tasks'){
    const qs = new URLSearchParams();
    if(f.employee_id) qs.set('employee_id', f.employee_id);
    if(f.status) qs.set('status', f.status);
    let rows = await apiCall(`/tasks?${qs.toString()}`);
    // project_id and date range aren't server-side filters on /api/tasks -- mirror the
    // same client-side filtering renderTasksPage already does for those two.
    if(f.project_id) rows = rows.filter(t=>String(t.project_id)===String(f.project_id));
    if(f.date_from) rows = rows.filter(t=>t.deadline && t.deadline>=f.date_from);
    if(f.date_to) rows = rows.filter(t=>t.deadline && t.deadline<=f.date_to);
    return rows.slice(0,10);
  }
  if(config.source==='clients_usage' || config.source==='employees_activity'){
    const qs = new URLSearchParams();
    if(f.date_from) qs.set('date_from', f.date_from);
    if(f.date_to) qs.set('date_to', f.date_to);
    const path = config.source==='clients_usage' ? '/dashboard-widgets/relations/clients-usage' : '/dashboard-widgets/relations/employees-activity';
    const rows = await apiCall(`${path}?${qs.toString()}`);
    return rows.slice(0,10);
  }
  if(config.source==='projects'){
    const rows = await apiCall('/projects');
    return rows.slice(0,10);
  }
  return [];
}

// Generic, column-driven table renderer shared by every list-widget source.
// selectedColumns is an array of column keys (config.columns); falls back to
// all available columns for that source when not set (older saved widgets).
function renderListWidgetRows(source, rows, selectedColumns){
  const allColumns = LIST_SOURCE_COLUMNS[source] || [];
  const columns = (selectedColumns && selectedColumns.length)
    ? allColumns.filter(c=>selectedColumns.includes(c.key))
    : allColumns;
  if(!columns.length) return '<span class="cell-muted">אין עמודות להצגה</span>';
  if(!rows.length) return '<span class="cell-muted">אין תוצאות עבור הסינון הזה</span>';
  return `<table><thead><tr>${columns.map(c=>`<th>${c.label}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(row=>`<tr>${columns.map(c=>`<td>${c.render(row)}</td>`).join('')}</tr>`).join('')}
  </tbody></table>`;
}

  if(f.employee_id && document.getElementById('kpiEmployee')) document.getElementById('kpiEmployee').value = f.employee_id;
  if(f.project_id && document.getElementById('kpiProject')) document.getElementById('kpiProject').value = f.project_id;
  if(f.status && document.getElementById('kpiTimeEntryStatus')) document.getElementById('kpiTimeEntryStatus').value = f.status;
  if(f.status && document.getElementById('kpiStatus')) document.getElementById('kpiStatus').value = f.status;
  if(f.payment_method) document.getElementById('kpiPaymentMethod').value = f.payment_method;
  if(f.role) document.getElementById('kpiRole').value = f.role;
  if(f.threshold_pct!==undefined) document.getElementById('kpiThresholdPct').value = f.threshold_pct;

function onKpiSourceChange(){
  const source = document.getElementById('kpiSource').value;
  document.querySelectorAll('[data-source-only]').forEach(el=>{
    const allowed = el.dataset.sourceOnly.split(',');
    el.style.display = allowed.includes(source) ? '' : 'none';
  });
  onKpiAggChange();
}

function onKpiAggChange(){
  const source = document.getElementById('kpiSource').value;
  const wrap = document.getElementById('kpiFieldWrap');
  if(['clients_usage','employees_activity'].includes(source)){ wrap.style.display = 'none'; return; }
  const agg = document.getElementById('kpiAgg').value;
  const fieldSelect = document.getElementById('kpiField');
  if(agg==='count'){ wrap.style.display = 'none'; return; }
  wrap.style.display = '';
  const fields = KPI_NUMERIC_FIELDS[source] || [];
  fieldSelect.innerHTML = fields.length
    ? fields.map(f=>`<option value="${f.value}">${f.label}</option>`).join('')
    : '<option value="">אין שדה מספרי למקור הזה — בחר "ספירה"</option>';
}

function collectKpiConfig(){
  const source = document.getElementById('kpiSource').value;
  const filters = {};
  const from = document.getElementById('kpiFrom').value; if(from) filters.date_from = from;
  const to = document.getElementById('kpiTo').value; if(to) filters.date_to = to;

  if(source==='clients_usage'){
    filters.threshold_pct = Number(document.getElementById('kpiThresholdPct').value) || 0;
    return { data_source: source, filters };
  }
  if(source==='employees_activity'){
    filters.min_hours = Number(document.getElementById('kpiMinHours').value) || 0;
    return { data_source: source, filters };
  }

  const aggregation = document.getElementById('kpiAgg').value;
  const field = aggregation==='count' ? undefined : (document.getElementById('kpiField').value || undefined);
  if(['time_entries','tasks'].includes(source)){
    const emp = document.getElementById('kpiEmployee').value; if(emp) filters.employee_id = emp;
    const proj = document.getElementById('kpiProject').value; if(proj) filters.project_id = proj;
  }
  if(source==='time_entries'){
    const status = document.getElementById('kpiTimeEntryStatus').value; if(status) filters.status = status;
  }
  if(source==='tasks'){
    const status = document.getElementById('kpiStatus').value; if(status) filters.status = status;
  }
  if(source==='projects'){
    const pm = document.getElementById('kpiPaymentMethod').value; if(pm) filters.payment_method = pm;
  }
  if(source==='employees'){
    const role = document.getElementById('kpiRole').value; if(role) filters.role = role;
  }
  return { data_source: source, aggregation, field, filters };
}

function renderTimerLists(){
  const allWrap = document.getElementById('allTimersWrap');
  if(!allWrap) return;

  allWrap.innerHTML = state.activeTimers.length ? `<table><thead><tr><th>עובד</th><th>לקוח</th><th>זמן רץ</th><th>סטטוס</th><th></th></tr></thead><tbody>
    ${state.activeTimers.map(t=>{
      const f = getFreelancer(t.freelancerId), c = getClient(t.clientId);
      const mins = elapsedMinutes(t);
      const over = mins>=240;
      const paused = !!t.pausedAt;
      return `<tr>
        <td><div class="row-flex"><div class="avatar">${initials(f?.name||'?')}</div>${f?.name||'—'}</div></td>
        <td>${clientDisplayName(c)}</td>
        <td class="mono" data-timer-clock="${t.id}">${elapsedClock(t)}</td>
        <td>${paused ? `<span class="pill pill-amber">${ICON.clock} מוקפא</span>` : over ? `<span class="pill pill-red">${ICON.alert} מעל 4 שעות</span>` : `<span class="pill pill-green">רץ</span>`}</td>
        <td style="display:flex; gap:6px;">
          ${paused
            ? `<button class="btn btn-sm btn-ghost" onclick="resumeTimer('${t.id}')">${ICON.play} המשך</button>`
            : `<button class="btn btn-sm btn-ghost" onclick="pauseTimer('${t.id}')">${ICON.clock} השהה</button>`}
          <button class="btn btn-sm btn-ghost" onclick="stopTimer('${t.id}')">עצור</button>
        </td>
      </tr>`;
    }).join('')}
  </tbody></table>` : `<div class="empty-state">${ICON.clock}<div class="t">אין שעונים פתוחים במערכת</div></div>`;
}

function stopTimer(timerId){
  const t = state.activeTimers.find(x=>x.id===timerId);
  if(!t) return;
  const c = getClient(t.clientId);
  const startedDate = new Date(t.startedAt);
  const nowD = new Date();
  const minutes = Math.max(1, Math.round((nowD-startedDate)/60000));
  const startTime = `${String(startedDate.getHours()).padStart(2,'0')}:${String(startedDate.getMinutes()).padStart(2,'0')}`;
  const endTime = nowTimeStr();
  const rate = parseRate(getFreelancer(t.freelancerId)?.hourlyRate);
  const stopClientOptions = clientsForFreelancer(t.freelancerId);
  if(!stopClientOptions.some(cl=>cl.id===t.clientId) && c){ stopClientOptions.unshift(c); }

  openModal(`
    <div class="modal-head"><h3>סיום דיווח עבודה</h3><button class="modal-close" onclick="closeModal()">${ICON.close}</button></div>
    <div class="modal-body">
      <div class="field">
        <label>לקוח</label>
        <select id="stopClientSelect">
          ${stopClientOptions.map(cl=>`<option value="${cl.id}" ${cl.id===t.clientId?'selected':''}>${clientDisplayName(cl)}</option>`).join('')}
        </select>
      </div>
      <div class="field-row">
        <div class="field"><label>תאריך</label><input type="date" id="stopDate" value="${todayStr()}"></div>
        <div class="field"><label>משך זמן (מחושב אוטומטית)</label><input type="text" id="stopDuration" value="${fmtMinutes(minutes)}" disabled style="background:#F6F4EC;color:var(--ink); font-weight:700;"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>שעת התחלה</label><input type="time" id="stopStart" value="${startTime}" oninput="updateStopDuration()"></div>
        <div class="field"><label>שעת סיום</label><input type="time" id="stopEnd" value="${endTime}" oninput="updateStopDuration()"></div>
      </div>
      <div class="hint" style="margin:-6px 0 12px;">${rate ? `הדיווח ייצרב לפי תעריף ${fmtCurrency(rate)} לשעה (${getFreelancer(t.freelancerId)?.name})` : `לא הוגדר תעריף שעתי ל-${getFreelancer(t.freelancerId)?.name} — הדיווח ייצרב בעלות 0 ₪`}</div>
      <div class="field">
        <label>תיאור דיווח העבודה</label>
        <textarea id="stopDesc" placeholder="מה בוצע בזמן הזה? (חובה למלא לפחות 10 תווים)" oninput="updateStopDescCounter()"></textarea>
        <div class="hint" id="stopDescCounter">0/10 תווים לפחות</div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-primary" onclick="confirmStopTimer('${timerId}')">${ICON.check} שמור דיווח</button>
      <button class="btn btn-ghost" onclick="closeModal()">ביטול</button>
    </div>
  `);
  updateStopDescCounter();
}

  const c = getClient(t.clientId);

function updateStopDuration(){
  const start = document.getElementById('stopStart').value;
  const end = document.getElementById('stopEnd').value;
  const durField = document.getElementById('stopDuration');
  if(!start || !end || !durField) return;
  const minutes = minutesBetween(start,end);
  durField.value = fmtMinutes(minutes);
}

function updateStopDescCounter(){
  const desc = document.getElementById('stopDesc');
  const counter = document.getElementById('stopDescCounter');
  if(!desc || !counter) return;
  const len = desc.value.trim().length;
  const ok = len>=10;
  counter.textContent = ok ? `${len} תווים ✓` : `${len}/10 תווים לפחות`;
  counter.style.color = ok ? 'var(--green)' : 'var(--red)';
}

async function confirmStopTimer(timerId){
  const t = state.activeTimers.find(x=>x.id===timerId);
  if(!t) return;
  const clientId = document.getElementById('stopClientSelect').value;
  const date = document.getElementById('stopDate').value;
  const start = document.getElementById('stopStart').value;
  const end = document.getElementById('stopEnd').value;
  const description = document.getElementById('stopDesc').value.trim();

  if(description.length < 10){
    toast('יש למלא תיאור דיווח עבודה של לפחות 10 תווים');
    updateStopDescCounter();
    return;
  }

  try{
    await apiCall('/time-entries/stop', { method:'POST', body: JSON.stringify({ employee_id: Number(t.freelancerId), entry_id: Number(t.id) }) });
    await apiCall(`/time-entries/${t.id}`, {
      method:'PATCH',
      body: JSON.stringify({
        project_id: clientId?Number(clientId):null,
        description,
        started_at: new Date(`${date}T${start}:00`).toISOString(),
        ended_at: new Date(`${date}T${end}:00`).toISOString(),
      }),
    });
    closeModal();
    toast('דיווח העבודה נשמר בהצלחה');
    await refreshData();
    renderAll();
  }catch(err){ toast('שגיאה: '+err.message); }
}

let clientSearchQuery = '';
function filteredClients(){
  const base = isAdmin() ? state.clients : clientsForFreelancer(state.currentUserId);
  const q = clientSearchQuery.trim().toLowerCase();
  if(!q) return base;
  return base.filter(c=>
    (c.name||'').toLowerCase().includes(q) ||
    (c.businessName||'').toLowerCase().includes(q) ||
    (c.phone||'').toLowerCase().includes(q) ||
    (c.email||'').toLowerCase().includes(q)
  );
}

function renderClientCard(c){
  const used = clientMonthMinutes(c.id);
  const hasQuota = !!(c.useHoursBank && c.monthlyQuota>0);
  const pct = hasQuota ? Math.min(100, used/(c.monthlyQuota*60)*100) : 0;
  const color = pct>=100?'var(--red)':pct>=80?'var(--amber)':'var(--green)';
  const entryCount = state.entries.filter(e=>e.clientId===c.id).length;
  const linked = (c.linkedFreelancerIds||[]).map(id=>getFreelancer(id)).filter(Boolean);
  return `<div class="panel panel-pad">
    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
      <div>
        <div style="display:flex; align-items:center; gap:8px;">
          <h3 style="font-size:15.5px;">${clientDisplayName(c)}</h3>
          ${c.active===false?`<span class="pill pill-gray">לא פעיל</span>`:`<span class="pill pill-green">פעיל</span>`}
        </div>
        ${c.name && c.businessName ? `<div class="cell-muted" style="margin-top:2px; font-size:12px;">איש קשר: ${c.name}</div>` : ''}
        <div class="cell-muted" style="margin-top:3px;">${c.phone||'ללא טלפון'}${c.email?` · ${c.email}`:''}</div>
      </div>
      <div style="display:flex; gap:6px;">
        ${isAdmin() ? `
          <button class="icon-btn" title="לינק ללקוח" onclick="openClientPortalLinkModal('${c.id}')">${ICON.link}</button>
          <button class="icon-btn" onclick="openClientForm('${c.id}')">${ICON.edit}</button>
          <button class="icon-btn" title="העבר לארכיון" onclick="deleteClient('${c.id}')">${ICON.trash}</button>
        ` : `<button class="btn btn-sm btn-ghost" onclick="openClientForm('${c.id}')">פתח</button>`}
      </div>
    </div>
    ${c.description?`<div class="cell-muted" style="margin-top:10px; font-size:12.5px; line-height:1.5;">${c.description}</div>`:''}

    <div style="margin-top:12px; display:flex; align-items:center; gap:7px; flex-wrap:wrap;">
      <span class="hint" style="margin:0;">מקושרים ללקוח:</span>
      ${linked.length ? linked.map(f=>`<span class="pill pill-gray">${f.name}</span>`).join('') : `<span class="cell-muted" style="font-size:12px;">פתוח לכל העובדים</span>`}
    </div>

    <div style="margin-top:14px;">
      ${hasQuota ? `
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;">
          <span style="font-weight:700;">${fmtHoursShort(used)} / ${c.monthlyQuota} ש׳ החודש</span>
          <span style="color:${color}; font-weight:700;">${Math.round(pct)}%</span>
        </div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%; background:${color};"></div></div>
        ${pct>=80?`<div class="hint" style="color:${color};">${pct>=100?'חרג מהמכסה החודשית':'מתקרב למכסה החודשית'}</div>`:''}
      ` : `<div class="pill pill-gray">ללא בנק שעות</div> <span class="cell-muted" style="margin-right:8px;">${fmtHoursShort(used)} ש׳ החודש</span>`}
    </div>
    <div class="hint" style="margin-top:10px;">${entryCount} דיווחים בסה״כ</div>
  </div>`;
}

async function createClientField(){
  const label = document.getElementById('nfLabel').value.trim();
  const field_type = document.getElementById('nfType').value;
  const errEl = document.getElementById('nfError');
  errEl.classList.add('hidden');
  if(!label){ errEl.textContent = 'יש להזין שם לשדה'; errEl.classList.remove('hidden'); return; }
  const body = { label, field_type };
  if(field_type === 'select'){
    const options = document.getElementById('nfOptions').value.split('\n').map(s=>s.trim()).filter(Boolean);
    if(!options.length){ errEl.textContent = 'יש להזין לפחות אפשרות אחת'; errEl.classList.remove('hidden'); return; }
    body.options = options;
  }
  try{
    await apiCall('/client-fields', { method:'POST', body: JSON.stringify(body) });
    await refreshData();
    toast('השדה נוסף בהצלחה');
    openManageFieldsModal();
  }catch(err){ errEl.textContent = 'שגיאה: '+err.message; errEl.classList.remove('hidden'); }
}

function renderCustomFieldInput(field, c){
  const fv = c?.fieldValues?.[field.id] || {};
  const inputId = `cf_${field.id}`;
  if(field.type === 'file'){
    const current = fv.file_name
      ? `<div class="hint">קובץ נוכחי: <a href="#" onclick="downloadClientField('${c.id}','${field.id}','${fv.file_name}'); return false;">${fv.file_name}</a> (${Math.round((fv.file_size||0)/1024)}KB)</div>`
      : `<div class="hint">לא הועלה קובץ עדיין</div>`;
    return `<div class="field">
      <label>${field.label}</label>
      ${current}
      <input type="file" id="${inputId}" onchange="pendingFieldFiles['${field.id}']=this.files[0]">
    </div>`;
  }
  if(field.type === 'textarea'){
    return `<div class="field"><label>${field.label}</label><textarea id="${inputId}">${fv.value||''}</textarea></div>`;
  }
  if(field.type === 'select'){
    return `<div class="field"><label>${field.label}</label>
      <select id="${inputId}">
        <option value="">— לא נבחר —</option>
        ${(field.options||[]).map(o=>`<option value="${o}" ${fv.value===o?'selected':''}>${o}</option>`).join('')}
      </select>
    </div>`;
  }
  const type = field.type === 'url' ? 'url' : 'text';
  return `<div class="field"><label>${field.label}</label><input type="${type}" id="${inputId}" value="${fv.value||''}"></div>`;
}

async function saveClient(clientId){
  const businessName = document.getElementById('cBusinessName').value.trim();
  const name = document.getElementById('cName').value.trim();
  if(!businessName && !name){ toast('יש להזין שם עסק או שם איש קשר'); return; }
  const phone = document.getElementById('cPhone').value.trim();
  const email = document.getElementById('cEmail').value.trim();
  const active = document.getElementById('cActive').value === 'true';
  const description = document.getElementById('cDescription').value.trim();
  const paymentMethod = document.getElementById('cPaymentMethod').value;
  const monthlyQuota = paymentMethod==='hours_bank' ? (Number(document.getElementById('cQuota').value)||0) : 0;
  const hourlyRate = paymentMethod==='hourly' ? (Number(document.getElementById('cHourlyRate').value)||0) : 0;
  const linkedFreelancerIds = Array.from(document.querySelectorAll('#cLinkedFreelancers input[type=checkbox]:checked')).map(el=>el.value);

  const body = {
    name: businessName || name, business_name: businessName, contact_phone: phone, contact_email: email,
    description, payment_method: paymentMethod, monthly_quota_hours: monthlyQuota, hourly_rate: hourlyRate, archived: !active,
  };

  try{
    let savedId = clientId;
    if(clientId){
      await apiCall(`/projects/${clientId}`, { method:'PATCH', body: JSON.stringify(body) });
      toast('פרטי הלקוח עודכנו');
    }else{
      const created = await apiCall('/projects', { method:'POST', body: JSON.stringify(body) });
      savedId = created.id;
      toast('הלקוח נוסף בהצלחה');
    }
    await apiCall(`/projects/${savedId}/freelancers`, {
      method:'PUT',
      body: JSON.stringify({ employee_ids: linkedFreelancerIds.map(Number) }),
    });

    for(const f of state.clientFields.filter(f=>f.active)){
      if(f.type === 'file'){
        const file = pendingFieldFiles[f.id];
        if(file) await apiUpload(`/projects/${savedId}/fields/${f.id}/file`, file);
        continue;
      }
      const el = document.getElementById(`cf_${f.id}`);
      if(!el) continue;
      await apiCall(`/projects/${savedId}/fields/${f.id}`, { method:'PUT', body: JSON.stringify({ value: el.value || null }) });
    }

    closeModal();
    await refreshData();
    renderAll();
  }catch(err){
    const el = document.getElementById('cFieldsError');
    if(el){ el.textContent = 'שגיאה: '+err.message; el.classList.remove('hidden'); }
    else toast('שגיאה: '+err.message);
  }
}

async function deleteClient(clientId){

function exportClientsToExcel(){
  if(!state.clients.length){ toast('אין לקוחות לייצוא'); return; }
  const rows = state.clients.map(c=>{
    const used = clientMonthMinutes(c.id);
    const pct = (c.useHoursBank && c.monthlyQuota>0) ? Math.round(used/(c.monthlyQuota*60)*100) : null;
    const linked = (c.linkedFreelancerIds||[]).map(id=>getFreelancer(id)?.name).filter(Boolean);
    return {
      'שם העסק': c.businessName || '',
      'איש קשר': c.name || '',
      'נייד': c.phone || '',
      'דוא"ל': c.email || '',
      'סטטוס': c.active===false ? 'לא פעיל' : 'פעיל',
      'בנק שעות (שעות בחודש)': c.useHoursBank ? c.monthlyQuota : 'ללא',
      'שעות שנוצלו החודש': fmtHoursShort(used),
      'אחוז ניצול': pct!==null ? pct+'%' : '—',
      'מקושרים ללקוח': linked.length ? linked.join(', ') : 'פתוח לכולם',
      'תיאור': c.description || '',
    };
  });
  exportToExcel(`לקוחות_${todayFileStamp()}`, [{ name:'לקוחות', rows }]);
}

    <div class="page-head">
      <div>
        <h1>${admin?'דיווחי עבודה':'הדיווחים שלי'}</h1>
        <p>${admin?'כל הדיווחים שנרשמו במערכת, ניתן לסנן ולהוסיף דיווח ידני':'כל דיווחי העבודה שלך. אם משהו לא מדויק, אפשר לבקש עריכה מהמנהל.'}</p>

        </select>` : ''}
        <select id="fClient">
          <option value="">כל הלקוחות</option>

        <input type="date" id="fTo" value="${reportFilters.to}">
        <button class="btn btn-ghost btn-sm" onclick="clearFilters()">נקה סינון</button>
        ${admin ? `<button class="btn btn-ghost btn-sm" onclick="openSaveListWidgetModal('time_entries', {employee_id: reportFilters.freelancerId||undefined, project_id: reportFilters.clientId||undefined, date_from: reportFilters.from||undefined, date_to: reportFilters.to||undefined})">${ICON.plus} שמור תצוגה כ-widget</button>` : ''}
        <div style="margin-right:auto; align-self:center; display:flex; gap:16px;" class="cell-muted">
          <span>סה״כ זמן: <b style="color:var(--ink);">${fmtMinutes(totalMin)}</b></span>
          <span>סה״כ עלות: <b style="color:var(--ink);">${fmtCurrency(totalCost)}</b></span>
        </div>
      </div>
    </div>

    <div class="panel">
      <table>
        <thead><tr>${admin?'<th>עובד</th>':''}<th>תאריך</th><th>לקוח</th><th>שעות</th><th>משך</th><th>עלות</th><th>תיאור</th><th></th></tr></thead>
        <tbody>
          ${filtered.map(e=>{

            const rateNote = e.rateSnapshot ? `${fmtCurrency(e.rateSnapshot)}/ש׳` : 'ללא תעריף';
            const pendingReq = state.editRequests.find(r=>r.entryId===e.id && r.status==='pending');
            const isMine = e.freelancerId === state.currentUserId;
            let requestCell = '';
            if(isMine){
              requestCell = pendingReq
                ? `<span class="pill pill-amber" title="בקשת עריכה ממתינה לאישור מנהל">${ICON.request} ממתין לאישור</span>`
                : `<button class="icon-btn" title="בקש עריכת דיווח" onclick="openEditRequestForm('${e.id}')">${ICON.request}</button>`;
            }
            const adminActions = admin ? `
                <button class="icon-btn" onclick="openEntryForm('${e.id}')">${ICON.edit}</button>
                <button class="icon-btn" onclick="deleteEntry('${e.id}')">${ICON.trash}</button>` : '';

              ${admin?`<td>${f?.name||'—'}</td>`:''}
              <td class="cell-muted">${fmtDateHe(e.date)}</td>
              <td>${clientDisplayName(c)}</td>
              <td class="mono cell-muted">${e.start}–${e.end}</td>
              <td class="mono">${fmtMinutes(e.minutes)}</td>
              <td class="mono" title="נצרב לפי תעריף ${rateNote}">${fmtCurrency(e.cost||0)}<div class="cell-muted" style="font-size:10.5px; font-weight:500;">${rateNote}</div></td>
              <td style="max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${e.description||''}">${e.autoClosed?`<span class="pill pill-amber" style="margin-left:5px;">${ICON.bolt} אוטומטי</span>`:''}${e.description||'—'}</td>

function bindReportFilters(){
  const fF = document.getElementById('fFreelancer');
  const fC = document.getElementById('fClient');
  const fFrom = document.getElementById('fFrom');
  const fTo = document.getElementById('fTo');
  if(!fC) return;
  if(fF) fF.onchange = ()=>{ reportFilters.freelancerId = fF.value; renderAll(); };
  fC.onchange = ()=>{ reportFilters.clientId = fC.value; renderAll(); };
  fFrom.onchange = ()=>{ reportFilters.from = fFrom.value; renderAll(); };
  fTo.onchange = ()=>{ reportFilters.to = fTo.value; renderAll(); };
}
function clearFilters(){ reportFilters = { freelancerId:'', clientId:'', from:'', to:'' }; renderAll(); }

function exportReportsToExcel(){
  const entries = isAdmin() ? state.entries : state.entries.filter(e=>e.freelancerId===state.currentUserId);
  if(!entries.length){ toast('אין דיווחים לייצוא'); return; }
  const rows = entries.map(e=>{
    const f = getFreelancer(e.freelancerId), c = getClient(e.clientId);
    return {
      'תאריך': fmtDateHe(e.date),
      'עובד': f?.name || '—',
      'לקוח': clientDisplayName(c),
      'שעת התחלה': e.start,
      'שעת סיום': e.end,
      'משך (דקות)': e.minutes,
      'משך': fmtMinutes(e.minutes),
      'תעריף לשעה (₪)': e.rateSnapshot || 0,
      'עלות (₪)': e.cost || 0,
      'תיאור': e.description || '',
      'נסגר אוטומטית': e.autoClosed ? 'כן' : 'לא',
    };
  });
  exportToExcel(`דיווחי-עבודה_${todayFileStamp()}`, [{ name:'דיווחי עבודה', rows }]);
}

function openEntryForm(entryId){
  const e = entryId ? state.entries.find(x=>x.id===entryId) : null;
  const admin = isAdmin();
  const formFreelancerId = e?.freelancerId || state.currentUserId;
  const clientOptions = admin ? state.clients : clientsForFreelancer(formFreelancerId);
