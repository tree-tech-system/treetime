<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TreeTime | ניהול זמני עבודה</title>
<link rel="icon" type="image/png" href="/api/branding/logo" id="faviconLink">
<script>
  (function(){
    var v = Date.now();
    document.getElementById('faviconLink').href = '/api/branding/logo?v=' + v;
    document.addEventListener('DOMContentLoaded', function(){
      var img = document.getElementById('brandLogoImg');
      if(img) img.src = '/api/branding/logo?v=' + v;
    });
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Assistant:wght@400;500;600;700&family=Roboto+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#10241C;
    --ink-soft:#1D3327;
    --bg:#FAF9F4;
    --panel:#FFFFFF;
    --border:#E4E1D6;
    --muted:#6B7568;
    --green:#2F6F4E;
    --green-soft:#E7F1EA;
    --green-bright:#3F9863;
    --amber:#C9822A;
    --amber-soft:#FBEEDD;
    --red:#C0392B;
    --red-soft:#FBE7E4;
    --gold:#B08D3E;
    --shadow: 0 1px 2px rgba(16,36,28,0.04), 0 8px 24px rgba(16,36,28,0.06);
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Assistant', sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
  }
  h1,h2,h3,h4{ font-family:'Rubik', sans-serif; margin:0; }
  .mono{ font-family:'Roboto Mono', monospace; }

  /* ---------- LAYOUT ---------- */
  .app{ display:flex; min-height:100vh; }

  .sidebar{
    width:230px;
    background:var(--ink);
    color:#EFEAD9;
    display:flex;
    flex-direction:column;
    padding:22px 16px;
    flex-shrink:0;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    padding:6px 8px 22px 8px;
    border-bottom:1px solid rgba(239,234,217,0.12);
    margin-bottom:18px;
  }
  .brand-mark{
    width:38px;height:38px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .brand-mark img{ width:100%; height:100%; object-fit:contain; }
  .brand-text{ line-height:1.25; }
  .brand-text .t1{ font-family:'Rubik'; font-weight:700; font-size:15.5px; color:#FBF8EF; letter-spacing:.01em; }
  .brand-text .t2{ font-size:11.5px; color:#9FB0A2; }
  .brand-text .t3{ font-size:10px; color:#6E7D71; margin-top:1px; }

  .notif-bell-btn{
    display:flex; align-items:center; gap:10px; width:100%; margin-bottom:12px;
    padding:10px 12px; border-radius:10px; border:1px solid rgba(239,234,217,0.12);
    background:rgba(239,234,217,0.06); color:#C9D3C7; font-family:'Assistant'; font-size:14px; font-weight:600;
    cursor:pointer; position:relative; text-align:right;
  }
  .notif-bell-btn:hover{ background:rgba(239,234,217,0.12); color:#FBF8EF; }
  .notif-bell-btn svg{ width:17px; height:17px; flex-shrink:0; }
  .notif-badge{
    margin-right:auto; background:var(--red); color:#fff; font-size:10.5px; font-weight:700;
    border-radius:20px; padding:1px 7px; min-width:18px; text-align:center;
  }
  .notif-item{ padding:12px 14px; border-radius:10px; border:1px solid var(--border); margin-bottom:8px; cursor:pointer; background:#FCFBF7; }
  .notif-item.unread{ background:var(--green-soft); border-color:var(--green-bright); }
  .notif-item:hover{ border-color:var(--green-bright); }
  .notif-item .t{ font-weight:700; font-size:13.5px; }
  .notif-item .b{ font-size:12.5px; color:var(--muted); margin-top:3px; line-height:1.5; }
  .notif-item .time{ font-size:11px; color:var(--muted); margin-top:6px; }

  .nav{ display:flex; flex-direction:column; gap:3px; flex:1; }
  .nav-item{
    display:flex; align-items:center; gap:11px;
    padding:10px 12px; border-radius:10px;
    color:#C9D3C7; font-size:14.5px; font-weight:500;
    cursor:pointer; user-select:none; transition:.15s;
    border:1px solid transparent;
  }
  .nav-item svg{ width:18px;height:18px; flex-shrink:0; opacity:.85; }
  .nav-item:hover{ background:rgba(239,234,217,0.06); color:#FBF8EF; }
  .nav-item.active{
    background:rgba(63,152,99,0.18);
    color:#B7F0CB;
    border-color:rgba(63,152,99,0.35);
  }
  .nav-item .badge{
    margin-right:auto;
    background:var(--red); color:#fff; font-size:10.5px; font-weight:700;
    border-radius:20px; padding:1px 7px;
  }
  .sidebar-foot{
    border-top:1px solid rgba(239,234,217,0.12);
    padding-top:14px; margin-top:10px;
  }
  .role-switch{
    display:flex; background:rgba(239,234,217,0.06); border:1px solid rgba(239,234,217,0.1);
    border-radius:10px; padding:3px; gap:3px; margin-bottom:10px;
  }
  .role-btn{
    flex:1; background:transparent; border:none; color:#9FB0A2; font-family:'Assistant';
    font-size:12px; font-weight:700; padding:7px 6px; border-radius:8px; cursor:pointer; transition:.15s;
  }
  .role-btn:hover{ color:#FBF8EF; }
  .role-btn.active{ background:var(--green); color:#fff; }
  .user-switch{
    background:rgba(239,234,217,0.06);
    border:1px solid rgba(239,234,217,0.1);
    border-radius:10px; padding:10px 11px;
  }
  .user-switch label{ font-size:10.5px; color:#8FA192; display:block; margin-bottom:5px; font-weight:600; letter-spacing:.02em;}
  .user-switch select{
    width:100%; background:transparent; color:#FBF8EF; border:none; font-family:'Assistant';
    font-size:13.5px; font-weight:600; outline:none; cursor:pointer;
  }
  .user-switch select option{ color:#111; }

  .main{ flex:1; padding:26px 34px 60px; max-width:1360px; }
  .page-head{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:22px; gap:16px; flex-wrap:wrap;}
  .page-head h1{ font-size:24px; font-weight:700; }
  .page-head p{ margin:4px 0 0; color:var(--muted); font-size:13.5px; }

  /* ---------- BUTTONS ---------- */
  .btn{
    display:inline-flex; align-items:center; gap:7px;
    padding:10px 16px; border-radius:10px; border:1px solid transparent;
    font-family:'Assistant'; font-weight:700; font-size:14px;
    cursor:pointer; transition:.15s; white-space:nowrap;
  }
  .btn svg{ width:16px;height:16px; }
  .btn-primary{ background:var(--green); color:#fff; }
  .btn-primary:hover{ background:var(--green-bright); }
  .btn-ghost{ background:transparent; color:var(--ink); border-color:var(--border); }
  .btn-ghost:hover{ background:#F1EFE6; }
  .btn-danger-ghost{ background:transparent; color:var(--red); border-color:#EFD3CE; }
  .btn-danger-ghost:hover{ background:var(--red-soft); }
  .btn-sm{ padding:6px 11px; font-size:12.5px; border-radius:8px; }
  .btn-block{ width:100%; justify-content:center; }
  .icon-btn{
    width:32px;height:32px;border-radius:8px;border:1px solid var(--border);
    background:#fff; display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);
  }
  .icon-btn:hover{ background:#F1EFE6; color:var(--ink); }
  .icon-btn svg{ width:15px;height:15px; }

  /* ---------- CARDS / PANELS ---------- */
  .panel{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .panel-pad{ padding:20px; }
  .panel-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px; border-bottom:1px solid var(--border);
  }
  .panel-head h3{ font-size:15.5px; font-weight:700; }
  .panel-head .sub{ font-size:12px; color:var(--muted); font-weight:500; margin-top:2px;}

  /* ---------- SETTINGS SPLIT VIEW ---------- */
  .settings-layout{ display:grid; grid-template-columns:290px 1fr; gap:18px; align-items:start; }
  @media(max-width:900px){ .settings-layout{ grid-template-columns:1fr; } }
  .settings-cat-list{ overflow:hidden; }
  .settings-cat-row{
    display:flex; align-items:center; gap:11px; padding:14px 16px; cursor:pointer;
    border-bottom:1px solid var(--border); position:relative; user-select:none;
  }
  .settings-cat-row:last-child{ border-bottom:none; }
  .settings-cat-row:hover{ background:#FBFAF5; }
  .settings-cat-row svg{ width:18px; height:18px; color:var(--muted); flex-shrink:0; }
  .settings-cat-row .settings-cat-label{ font-size:13.5px; font-weight:600; flex:1; }
  .settings-cat-row.active{ background:var(--green-soft); }
  .settings-cat-row.active svg{ color:var(--green); }
  .settings-cat-row.active .settings-cat-label{ color:var(--green); }
  .settings-cat-row.active::after{ content:''; position:absolute; top:0; bottom:0; right:0; width:3px; background:var(--green); }

  .grid{ display:grid; gap:18px; }
  .grid-4{ grid-template-columns:repeat(4,1fr); }
  .grid-3{ grid-template-columns:repeat(3,1fr); }
  .grid-2{ grid-template-columns:2fr 1fr; }
  @media(max-width:1100px){ .grid-4{grid-template-columns:repeat(2,1fr);} .grid-2{grid-template-columns:1fr;} .grid-3{grid-template-columns:1fr;} }

  .stat-card{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:17px 18px; box-shadow:var(--shadow);
  }
  .stat-card .label{ font-size:12.5px; color:var(--muted); font-weight:600; display:flex; align-items:center; gap:7px;}
  .stat-card .value{ font-family:'Rubik'; font-size:28px; font-weight:700; margin-top:8px; }
  .stat-card .foot{ font-size:11.5px; color:var(--muted); margin-top:4px; }
  .stat-icon{
    width:30px;height:30px;border-radius:8px; display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .stat-icon svg{ width:15px;height:15px; }

  /* ---------- TABLE ---------- */
  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  thead th{
    text-align:right; font-size:11.5px; text-transform:none; color:var(--muted);
    font-weight:700; padding:9px 20px; border-bottom:1px solid var(--border); background:#FCFBF7;
    letter-spacing:.01em;
  }
  tbody td{ padding:12px 20px; border-bottom:1px solid #F1EFE6; vertical-align:middle; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:#FBFAF5; }
  .cell-muted{ color:var(--muted); font-size:12.5px; }
  .empty-row td{ padding:34px 20px; text-align:center; color:var(--muted); }

  .pill{ display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:700; }
  .pill-green{ background:var(--green-soft); color:var(--green); }
  .pill-amber{ background:var(--amber-soft); color:var(--amber); }
  .pill-red{ background:var(--red-soft); color:var(--red); }
  .pill-gray{ background:#EFEDE3; color:var(--muted); }
  .dot{ width:6px;height:6px;border-radius:50%; background:currentColor; }

  /* ---------- PROGRESS ---------- */
  .progress-track{ background:#EFEDE3; height:7px; border-radius:20px; overflow:hidden; width:100%; }
  .progress-fill{ height:100%; border-radius:20px; transition:width .3s; }

  /* ---------- BANNER ---------- */
  .banner{
    display:flex; align-items:flex-start; gap:11px;
    padding:13px 16px; border-radius:12px; margin-bottom:14px; font-size:13.5px; border:1px solid;
  }
  .banner svg{ width:17px;height:17px; flex-shrink:0; margin-top:1px; }
  .banner-red{ background:var(--red-soft); border-color:#F0CCC5; color:#8E2E22; }
  .banner-amber{ background:var(--amber-soft); border-color:#EFD8B0; color:#8A5A16; }
  .banner b{ font-weight:700; }
  .banner .sub{ opacity:.8; font-size:12.5px; margin-top:2px; }

  /* ---------- TIMER ---------- */
  .timer-live-card{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    background:var(--ink); color:#EFEAD9; border-radius:14px; padding:16px 18px;
    position:relative; overflow:hidden;
  }
  .timer-live-card.overtime{ background:#3A1712; }
  .timer-live-card .pulse{
    width:11px;height:11px;border-radius:50%; background:var(--green-bright); flex-shrink:0;
    box-shadow:0 0 0 0 rgba(63,152,99,0.6); animation:pulse 1.8s infinite;
  }
  .timer-live-card.overtime .pulse{ background:#E4695A; box-shadow:0 0 0 0 rgba(228,105,90,0.6); animation:pulse-red 1.4s infinite; }
  @keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(63,152,99,.55);} 70%{box-shadow:0 0 0 9px rgba(63,152,99,0);} 100%{box-shadow:0 0 0 0 rgba(63,152,99,0);} }
  @keyframes pulse-red{ 0%{box-shadow:0 0 0 0 rgba(228,105,90,.55);} 70%{box-shadow:0 0 0 9px rgba(228,105,90,0);} 100%{box-shadow:0 0 0 0 rgba(228,105,90,0);} }
  .timer-live-info{ display:flex; align-items:center; gap:12px; }
  .timer-live-text .name{ font-weight:700; font-size:14px; }
  .timer-live-text .meta{ font-size:12px; color:#9FB0A2; margin-top:1px;}
  .timer-live-clock{ font-family:'Roboto Mono'; font-size:22px; font-weight:600; letter-spacing:.02em; }

  .big-timer{
    text-align:center; padding:38px 20px 30px;
  }
  .big-timer .clock{ font-family:'Roboto Mono'; font-size:56px; font-weight:600; letter-spacing:.02em; }
  .big-timer .clock.idle{ color:#C8C3B2; }
  .big-timer .clock.running{ color:var(--green); }

  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; }
  .field select, .field input, .field textarea{
    width:100%; border:1px solid var(--border); border-radius:9px; padding:10px 12px;
    font-family:'Assistant'; font-size:14px; background:#fff; color:var(--ink); outline:none;
  }
  .field select:focus, .field input:focus, .field textarea:focus{ border-color:var(--green-bright); box-shadow:0 0 0 3px var(--green-soft); }
  .search-input{
    width:100%; border:1px solid var(--border); border-radius:12px; padding:13px 16px;
    font-family:'Assistant'; font-size:14.5px; background:var(--panel); color:var(--ink); outline:none;
    box-shadow:var(--shadow);
  }
  .search-input:focus{ border-color:var(--green-bright); box-shadow:0 0 0 3px var(--green-soft); }
  .search-input::placeholder{ color:var(--muted); }
  .field textarea{ resize:vertical; min-height:70px; }
  .field-row{ display:flex; gap:12px; }
  .field-row .field{ flex:1; }
  .hint{ font-size:11.5px; color:var(--muted); margin-top:4px; }

  .checkbox-list{
    border:1px solid var(--border); border-radius:9px; background:#fff;
    max-height:190px; overflow-y:auto;
  }
  .checkbox-row{
    display:flex; align-items:center; gap:10px;
    padding:9px 12px; font-size:13.5px; cursor:pointer; border-bottom:1px solid #F1EFE6;
    transition:.1s;
  }
  .checkbox-row:last-child{ border-bottom:none; }
  .checkbox-row:hover{ background:#FBFAF5; }
  .checkbox-row input[type=checkbox]{
    width:16px; height:16px; accent-color:var(--green); cursor:pointer; flex-shrink:0;
  }

  /* ---------- MODAL ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(16,36,28,0.45); display:none;
    align-items:center; justify-content:center; z-index:100; padding:20px; backdrop-filter:blur(1px);
  }
  .modal-overlay.open{ display:flex; }
  .modal{
    background:#fff; border-radius:16px; width:100%; max-width:480px; max-height:88vh; overflow-y:auto;
    box-shadow:0 20px 60px rgba(16,36,28,0.25);
  }
  .modal.modal-wide{ max-width:840px; }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--border); }
  .modal-head h3{ font-size:16.5px; }
  .modal-body{ padding:20px 22px; }
  .modal-foot{ padding:16px 22px; border-top:1px solid var(--border); display:flex; gap:10px; justify-content:flex-start; }
  .modal-close{ cursor:pointer; color:var(--muted); background:none; border:none; padding:4px; }
  .modal-close svg{ width:19px;height:19px; }

  /* ---------- BARS (mini chart) ---------- */
  .bars{ display:flex; align-items:flex-end; gap:9px; height:120px; padding-top:6px; }
  .bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .bar-wrap{ flex:1; display:flex; align-items:flex-end; width:100%; justify-content:center; }
  .bar{ width:60%; max-width:26px; border-radius:6px 6px 3px 3px; background:linear-gradient(180deg, var(--green-bright), var(--green)); min-height:3px; }
  .bar-label{ font-size:10.5px; color:var(--muted); font-weight:600; }
  .bar-val{ font-size:10px; color:var(--ink); font-weight:700; }

  /* toast */
  .toast-wrap{ position:fixed; bottom:22px; left:22px; z-index:200; display:flex; flex-direction:column; gap:8px; }
  .toast{
    background:var(--ink); color:#FBF8EF; padding:12px 16px; border-radius:10px; font-size:13.5px;
    box-shadow:0 10px 30px rgba(0,0,0,0.25); display:flex; align-items:center; gap:9px; max-width:340px;
    animation:toast-in .2s ease-out;
  }
  @keyframes toast-in{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  .toast svg{ width:16px;height:16px; color:var(--green-bright); flex-shrink:0; }

  .avatar{
    width:28px;height:28px;border-radius:50%; background:var(--green-soft); color:var(--green);
    display:flex;align-items:center;justify-content:center; font-size:11.5px; font-weight:700; flex-shrink:0;
  }
  .row-flex{ display:flex; align-items:center; gap:9px; }

  .empty-state{ text-align:center; padding:40px 20px; color:var(--muted); }
  .empty-state svg{ width:34px;height:34px; margin-bottom:10px; opacity:.5; }
  .empty-state .t{ font-weight:700; color:var(--ink-soft); margin-bottom:3px; }

  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-thumb{ background:#DEDBCC; border-radius:20px; }

  .filters{ display:flex; gap:10px; flex-wrap:wrap; }
  .filters select, .filters input{
    border:1px solid var(--border); border-radius:9px; padding:8px 11px; font-family:'Assistant'; font-size:13px; background:#fff;
  }

  /* ---------- WEEKLY TIMELINE ---------- */
  .tl-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .tl-week-label{ font-weight:700; font-size:14px; }
  .tl-nav{ display:flex; align-items:center; gap:8px; }
  .tl-legend{ display:flex; flex-wrap:wrap; gap:8px 14px; margin-bottom:16px; }
  .tl-legend-item{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); font-weight:600; }
  .tl-legend-dot{ width:9px; height:9px; border-radius:3px; flex-shrink:0; }
  .tl-grid{ display:flex; flex-direction:row; border:1px solid var(--border); border-radius:12px; overflow:hidden; background:#fff; }
  .tl-day-col{
    flex:1; min-width:0; border-left:1px solid #F1EFE6; display:flex; flex-direction:column;
  }
  .tl-day-col:last-of-type{ border-left:none; }
  .tl-day-head{
    text-align:center; padding:9px 4px; border-bottom:1px solid var(--border); background:#FCFBF7;
  }
  .tl-day-head .d{ font-size:11.5px; font-weight:700; color:var(--ink-soft); }
  .tl-day-head .n{ font-size:10.5px; color:var(--muted); margin-top:1px; }
  .tl-day-head.today{ background:var(--green-soft); }
  .tl-day-head.today .d{ color:var(--green); }
  .tl-day-body{ position:relative; height:400px; }
  .tl-gridline{ position:absolute; left:0; right:0; border-top:1px dashed #EFEDE3; }
  .tl-block{
    position:absolute; left:3px; right:3px; border-radius:6px; padding:3px 6px;
    font-size:10px; font-weight:700; color:#fff; overflow:hidden; cursor:default;
    box-shadow:0 1px 3px rgba(16,36,28,0.15); line-height:1.3;
  }
  .tl-block .c{ font-size:9px; font-weight:600; opacity:.9; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tl-day-foot{ text-align:center; padding:7px 4px; border-top:1px solid var(--border); font-size:11px; font-weight:700; color:var(--ink-soft); background:#FCFBF7; }
  .tl-axis{ width:38px; flex:0 0 38px; position:relative; border-left:1px solid var(--border); }
  .tl-axis-label{ position:absolute; right:4px; font-size:9.5px; color:var(--muted); transform:translateY(-50%); }
  .tl-empty-day{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:10px; color:#D8D4C4; }

  /* ---------- SUPPORT TICKET THREAD (forum style) ---------- */
  .ticket-summary-bar{
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    background:#FCFBF7; border:1px solid var(--border); border-right:4px solid var(--green);
    border-radius:9px; padding:12px 14px; margin-bottom:12px; font-size:13px;
  }
  .ticket-number{ font-size:11.5px; color:var(--muted); margin-bottom:14px; }

/* ==================== REAL BACKEND INTEGRATION ==================== */
const API = '/api';
let authToken = localStorage.getItem('tt_dashboard_token');

async function apiCall(path, opts = {}) {
  const res = await fetch(API + path, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      ...(authToken ? { Authorization: `Bearer ${authToken}` } : {}),
      ...(opts.headers || {}),
    },
  });
  const data = await res.json().catch(() => null);
  if (!res.ok) throw new Error(data?.message || data?.error || `HTTP ${res.status}`);
  return data;
}

async function downloadClientField(projectId, fieldId, fileName){
  try{
    const res = await fetch(`${API}/projects/${projectId}/fields/${fieldId}/file`, {
      headers: authToken ? { Authorization: `Bearer ${authToken}` } : {},
    });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fileName || 'file';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }catch(err){ toast('שגיאה בהורדת הקובץ: '+err.message); }
}

async function apiUpload(path, file){
  const form = new FormData();
  form.append('file', file);
  const res = await fetch(API + path, {
    method: 'POST',
    headers: authToken ? { Authorization: `Bearer ${authToken}` } : {},
    body: form,
  });
  const data = await res.json().catch(() => null);
  if (!res.ok) throw new Error(data?.message || data?.error || `HTTP ${res.status}`);
  return data;
}

function notifTimeAgo(iso){
  const mins = Math.floor((Date.now()-new Date(iso).getTime())/60000);
  if(mins < 1) return 'עכשיו';
  if(mins < 60) return `לפני ${mins} דק'`;
  const hours = Math.floor(mins/60);
  if(hours < 24) return `לפני ${hours} שע'`;
  return fmtDateHe(iso.slice(0,10));
}

function fmtMinutes(mins){
  const h = Math.floor(mins/60), m = mins%60;
  if(h<=0) return `${m} דק׳`;
  if(m===0) return `${h} ש׳`;
  return `${h} ש׳ ${m} דק׳`;
}
function fmtHoursShort(mins){
  return (mins/60).toFixed(1).replace(/\.0$/,'') ;
}
function parseRate(hourlyRate){
  const n = parseFloat(String(hourlyRate||'').replace(',','.'));
  return isNaN(n) ? 0 : n;
}
function computeCost(minutes, rate){
  return Math.round((minutes/60)*rate*100)/100;
}
function fmtCurrency(amount){
  return '₪' + amount.toLocaleString('he-IL', { minimumFractionDigits:0, maximumFractionDigits:2 });
}
function monthCostTotal(){
  return monthEntries().reduce((s,e)=>s+(e.cost||0),0);
}
function freelancerMonthCost(freelancerId){
  return monthEntries().filter(e=>e.freelancerId===freelancerId).reduce((s,e)=>s+(e.cost||0),0);
}
function fmtDateHe(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('he-IL', { day:'2-digit', month:'2-digit', year:'numeric' });
}
function initials(name){
  return name.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('');
}
function isSameMonth(dateStr, ref=new Date()){
  const d = new Date(dateStr+'T00:00:00');
  return d.getMonth()===ref.getMonth() && d.getFullYear()===ref.getFullYear();
}
function monthEntries(){
  return state.entries.filter(e=>isSameMonth(e.date));
}
function clientMonthMinutes(clientId){
  return monthEntries().filter(e=>e.clientId===clientId).reduce((s,e)=>s+e.minutes,0);
}
function clientWeeklyTrend(clientId){
  const weeks = [];
  for(let i=5;i>=0;i--){
    const end = new Date(); end.setDate(end.getDate() - i*7);
    const start = new Date(end); start.setDate(start.getDate()-6);
    const mins = state.entries.filter(e=>{
      if(e.clientId!==clientId) return false;
      const d = new Date(e.date+'T00:00:00');
      return d>=start && d<=end;
    }).reduce((s,e)=>s+e.minutes,0);
    weeks.push({ label: `${start.getDate()}/${start.getMonth()+1}`, mins });
  }
  return weeks;
}
function clientRecentEntries(clientId, n){
  return state.entries.filter(e=>e.clientId===clientId).sort((a,b)=>(b.date+b.start).localeCompare(a.date+a.start)).slice(0,n);
}
function freelancerMonthMinutes(freelancerId){
  return monthEntries().filter(e=>e.freelancerId===freelancerId).reduce((s,e)=>s+e.minutes,0);
}
function totalMonthMinutes(){
  return monthEntries().reduce((s,e)=>s+e.minutes,0);
}
function lastEntryDateFor(freelancerId){
  const list = state.entries.filter(e=>e.freelancerId===freelancerId).sort((a,b)=>b.date.localeCompare(a.date));
  return list.length ? list[0].date : null;
}
function daysSince(dateStr){
  if(!dateStr) return null;
  const d1 = new Date(dateStr+'T00:00:00'), d2 = new Date(); d2.setHours(0,0,0,0);
  return Math.round((d2-d1)/86400000);
}
function elapsedMinutes(startedAtIso){
  return Math.floor((Date.now() - new Date(startedAtIso).getTime())/60000);
}
function elapsedClock(startedAtIso){
  const totalSec = Math.floor((Date.now() - new Date(startedAtIso).getTime())/1000);
  const h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60), s = totalSec%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function nowTimeStr(){
  const d = new Date();
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function minutesBetween(start,end){
  const [sh,sm] = start.split(':').map(Number), [eh,em] = end.split(':').map(Number);
  let diff = (eh*60+em) - (sh*60+sm);
  if(diff<0) diff += 24*60;
  return diff;
}

/* פונקציית עזר גנרית: מקבלת שם קובץ ומערך גיליונות {name, rows}, ומורידה קובץ xlsx */
function exportToExcel(filename, sheets){
  if(typeof XLSX === 'undefined'){
    toast('טעינת ספריית האקסל נכשלה — ודא חיבור לאינטרנט ונסה שוב');
    return;
  }
  const wb = XLSX.utils.book_new();
  sheets.forEach(sheet=>{
    const ws = XLSX.utils.json_to_sheet(sheet.rows);
    XLSX.utils.book_append_sheet(wb, ws, sheet.name.slice(0,31)); // שם גיליון מוגבל ל-31 תווים
  });
  XLSX.writeFile(wb, `${filename}.xlsx`);
  toast('קובץ האקסל יוצא בהצלחה');
}

  const btn = document.getElementById('importClientsBtn');
  const file = fileInput.files[0];
  if(!file){ msgEl.textContent = 'יש לבחור קובץ תחילה'; return; }
  if(typeof XLSX === 'undefined'){ msgEl.textContent = 'טעינת ספריית האקסל נכשלה — ודא חיבור לאינטרנט ונסה שוב'; return; }

  btn.disabled = true;
  msgEl.textContent = 'קורא קובץ...';

  try{
    const isCsv = /\.csv$/i.test(file.name);
    const wb = isCsv
      ? XLSX.read(await file.text(), { type:'string' })
      : XLSX.read(await file.arrayBuffer(), { type:'array' });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { defval:'' });

    if(!rows.length){ msgEl.textContent = 'הקובץ ריק או שלא ניתן היה לקרוא אותו'; btn.disabled = false; return; }

    let created = 0, failed = 0;
    const errors = [];
    for(const row of rows){
      const businessName = String(row['שם העסק']||'').trim();
      const contactName = String(row['איש קשר']||'').trim();
      if(!businessName && !contactName){ failed++; continue; }

      const statusRaw = String(row['סטטוס']||'').trim();
      const active = statusRaw !== 'לא פעיל';
      const quotaRaw = row['בנק שעות (שעות בחודש)'];
      const quota = Number(quotaRaw);
      const useHoursBank = !isNaN(quota) && quota > 0;

      const body = {
        name: businessName || contactName,
        business_name: businessName,
        contact_phone: String(row['נייד']||'').trim(),
        contact_email: String(row['דוא"ל']||row['דואל']||'').trim(),
        description: String(row['תיאור']||'').trim(),
        archived: !active,
        payment_method: useHoursBank ? 'hours_bank' : 'hourly',
        monthly_quota_hours: useHoursBank ? quota : 0,
      };

      msgEl.textContent = `מייבא... ${created+failed+1}/${rows.length}`;
      try{
        await apiCall('/projects', { method:'POST', body: JSON.stringify(body) });
        created++;
      }catch(err){
        failed++;
        errors.push(`${businessName||contactName}: ${err.message}`);
      }
    }

    await refreshData();
    renderAll();
    msgEl.textContent = `יובאו ${created} לקוחות בהצלחה${failed?`, ${failed} נכשלו`:''}`;
    if(errors.length) console.warn('שגיאות ייבוא לקוחות:', errors);
    toast(`יובאו ${created} לקוחות${failed?`, ${failed} נכשלו`:''}`);
  }catch(err){
    msgEl.textContent = 'שגיאה בקריאת הקובץ: '+err.message;
  }
  btn.disabled = false;
}


/* English technical URL slugs, one per "room" — e.g. /c/acme-design/settings */
const PAGE_SLUGS = {
  dashboard: 'dashboard', clients: 'clients', reports: 'reports',
  editRequests: 'edit-requests', support: 'support', freelancers: 'users', settings: 'settings',
  guides: 'guides', myAccount: 'account', tasks: 'tasks',
};
const SLUG_TO_PAGE = Object.fromEntries(Object.entries(PAGE_SLUGS).map(([k,v])=>[v,k]));

function pageSlugFromPath(){
  const m = location.pathname.match(/^\/c\/[a-zA-Z0-9-]+\/?([a-zA-Z0-9-]*)/);
  return m ? (m[1]||'') : '';
}

function navigateToPage(pageId, replace){
  activePage = pageId;
  if(state.companySlug){
    const url = `/c/${state.companySlug}/${PAGE_SLUGS[pageId]||''}`;
    if(replace) history.replaceState({page:pageId}, '', url);
    else history.pushState({page:pageId}, '', url);
  }
  renderAll();
}

window.addEventListener('popstate', ()=>{
  if(!state.companySlug) return;
  activePage = SLUG_TO_PAGE[pageSlugFromPath()] || 'dashboard';
  renderAll();
});

function renderNav(){
  const nav = document.getElementById('nav');
  const pages = isAdmin() ? ADMIN_PAGES : FREELANCER_PAGES;
  // הגנה: אם עברנו תפקיד ועמוד קודם לא קיים בתפריט החדש, נחזור לעמוד הבית
  if(!pages.some(p=>p.id===activePage)) activePage = 'dashboard';

  nav.innerHTML = pages.map(p=>{
    let badgeCount = 0;
    if(p.id==='editRequests') badgeCount = pendingEditRequestsCount();
    if(p.id==='tasks') badgeCount = (isAdmin() ? state.tasks : state.tasks.filter(t=>t.freelancerId===state.currentUserId)).filter(t=>t.status!=='done').length;
    const badge = badgeCount ? `<span class="badge">${badgeCount}</span>` : '';
    return `<div class="nav-item ${activePage===p.id?'active':''}" data-page="${p.id}">${p.icon}<span>${p.label}</span>${badge}</div>`;
  }).join('');
  nav.querySelectorAll('.nav-item').forEach(el=>{
    el.addEventListener('click', ()=>{ navigateToPage(el.dataset.page); });
  });
}

  openModal(`
    <div class="modal-head"><h3>שינוי סיסמה</h3><button class="modal-close" onclick="closeModal()">${ICON.close}</button></div>
    <div class="modal-body">
      <div class="field"><label>סיסמה נוכחית</label><input type="password" id="cpCurrent" autocomplete="current-password"></div>
      <div class="field"><label>סיסמה חדשה (לפחות 8 תווים)</label><input type="password" id="cpNew" autocomplete="new-password"></div>
      <div class="field"><label>אימות סיסמה חדשה</label><input type="password" id="cpConfirm" autocomplete="new-password"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-primary" onclick="submitChangePassword()">${ICON.check} שנה סיסמה</button>
      <button class="btn btn-ghost" onclick="closeModal()">ביטול</button>
    </div>
    <div class="error hidden" id="cpError" style="color:var(--red);font-size:13px;padding:0 20px 14px;"></div>
  `);
}

async function submitChangePassword(){
  const current_password = document.getElementById('cpCurrent').value;
  const new_password = document.getElementById('cpNew').value;
  const confirm = document.getElementById('cpConfirm').value;
  const errEl = document.getElementById('cpError');
  errEl.classList.add('hidden');
  if(new_password.length < 8){ errEl.textContent = 'הסיסמה החדשה חייבת להיות לפחות 8 תווים'; errEl.classList.remove('hidden'); return; }
  if(new_password !== confirm){ errEl.textContent = 'אימות הסיסמה לא תואם'; errEl.classList.remove('hidden'); return; }
  try{
    await apiCall('/auth/change-password', { method:'POST', body: JSON.stringify({ current_password, new_password }) });
    closeModal();
    toast('הסיסמה שונתה בהצלחה');
  }catch(err){
    errEl.textContent = err.message;
    errEl.classList.remove('hidden');
  }
}

function stopTimer(timerId){
  const t = state.activeTimers.find(x=>x.id===timerId);
  if(!t) return;
  const c = getClient(t.clientId);
  const startedDate = new Date(t.startedAt);
  const nowD = new Date();
  const minutes = Math.max(1, Math.round((nowD-startedDate)/60000));
  const startTime = `${String(startedDate.getHours()).padStart(2,'0')}:${String(startedDate.getMinutes()).padStart(2,'0')}`;
  const endTime = nowTimeStr();
  const rate = parseRate(getFreelancer(t.freelancerId)?.hourlyRate);
  const stopClientOptions = clientsForFreelancer(t.freelancerId);
  if(!stopClientOptions.some(cl=>cl.id===t.clientId) && c){ stopClientOptions.unshift(c); }

  openModal(`
    <div class="modal-head"><h3>סיום דיווח עבודה</h3><button class="modal-close" onclick="closeModal()">${ICON.close}</button></div>
    <div class="modal-body">
      <div class="field">
        <label>לקוח</label>
        <select id="stopClientSelect">
          ${stopClientOptions.map(cl=>`<option value="${cl.id}" ${cl.id===t.clientId?'selected':''}>${clientDisplayName(cl)}</option>`).join('')}
        </select>
      </div>
      <div class="field-row">
        <div class="field"><label>תאריך</label><input type="date" id="stopDate" value="${todayStr()}"></div>
        <div class="field"><label>משך זמן (מחושב אוטומטית)</label><input type="text" id="stopDuration" value="${fmtMinutes(minutes)}" disabled style="background:#F6F4EC;color:var(--ink); font-weight:700;"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>שעת התחלה</label><input type="time" id="stopStart" value="${startTime}" oninput="updateStopDuration()"></div>
        <div class="field"><label>שעת סיום</label><input type="time" id="stopEnd" value="${endTime}" oninput="updateStopDuration()"></div>
      </div>
      <div class="hint" style="margin:-6px 0 12px;">${rate ? `הדיווח ייצרב לפי תעריף ${fmtCurrency(rate)} לשעה (${getFreelancer(t.freelancerId)?.name})` : `לא הוגדר תעריף שעתי ל-${getFreelancer(t.freelancerId)?.name} — הדיווח ייצרב בעלות 0 ₪`}</div>
      <div class="field">
        <label>תיאור דיווח העבודה</label>
        <textarea id="stopDesc" placeholder="מה בוצע בזמן הזה? (חובה למלא לפחות 10 תווים)" oninput="updateStopDescCounter()"></textarea>
        <div class="hint" id="stopDescCounter">0/10 תווים לפחות</div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-primary" onclick="confirmStopTimer('${timerId}')">${ICON.check} שמור דיווח</button>
      <button class="btn btn-ghost" onclick="closeModal()">ביטול</button>
    </div>
  `);
  updateStopDescCounter();
}

function updateStopDuration(){
  const start = document.getElementById('stopStart').value;
  const end = document.getElementById('stopEnd').value;
  const durField = document.getElementById('stopDuration');
  if(!start || !end || !durField) return;
  const minutes = minutesBetween(start,end);
  durField.value = fmtMinutes(minutes);
}

function updateStopDescCounter(){
  const desc = document.getElementById('stopDesc');
  const counter = document.getElementById('stopDescCounter');
  if(!desc || !counter) return;
  const len = desc.value.trim().length;
  const ok = len>=10;
  counter.textContent = ok ? `${len} תווים ✓` : `${len}/10 תווים לפחות`;
  counter.style.color = ok ? 'var(--green)' : 'var(--red)';
}

async function confirmStopTimer(timerId){
  const t = state.activeTimers.find(x=>x.id===timerId);
  if(!t) return;
  const clientId = document.getElementById('stopClientSelect').value;
  const date = document.getElementById('stopDate').value;
  const start = document.getElementById('stopStart').value;
  const end = document.getElementById('stopEnd').value;
  const description = document.getElementById('stopDesc').value.trim();

  if(description.length < 10){
    toast('יש למלא תיאור דיווח עבודה של לפחות 10 תווים');
    updateStopDescCounter();
    return;
  }

  try{
    await apiCall('/time-entries/stop', { method:'POST', body: JSON.stringify({ employee_id: Number(t.freelancerId), entry_id: Number(t.id) }) });
    await apiCall(`/time-entries/${t.id}`, {
      method:'PATCH',
      body: JSON.stringify({
        project_id: clientId?Number(clientId):null,
        description,
        started_at: new Date(`${date}T${start}:00`).toISOString(),
        ended_at: new Date(`${date}T${end}:00`).toISOString(),
      }),
    });
    closeModal();
    toast('דיווח העבודה נשמר בהצלחה');
    await refreshData();
    renderAll();
  }catch(err){ toast('שגיאה: '+err.message); }
}

        </div>

        <div class="cell-muted" style="margin-top:3px;">${c.phone||'ללא טלפון'}${c.email?` · ${c.email}`:''}</div>
      </div>
      <div style="display:flex; gap:6px;">
        <button class="icon-btn" onclick="openClientForm('${c.id}')">${ICON.edit}</button>
        <button class="icon-btn" title="העבר לארכיון" onclick="deleteClient('${c.id}')">${ICON.trash}</button>
      </div>
    </div>
    ${c.description?`<div class="cell-muted" style="margin-top:10px; font-size:12.5px; line-height:1.5;">${c.description}</div>`:''}

    <div style="margin-top:12px; display:flex; align-items:center; gap:7px; flex-wrap:wrap;">
      <span class="hint" style="margin:0;">מקושרים ללקוח:</span>
      ${linked.length ? linked.map(f=>`<span class="pill pill-gray">${f.name}</span>`).join('') : `<span class="cell-muted" style="font-size:12px;">פתוח לכל העובדים</span>`}
    </div>

    <div style="margin-top:14px;">
      ${hasQuota ? `
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;">
          <span style="font-weight:700;">${fmtHoursShort(used)} / ${c.monthlyQuota} ש׳ החודש</span>
          <span style="color:${color}; font-weight:700;">${Math.round(pct)}%</span>
        </div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%; background:${color};"></div></div>
        ${pct>=80?`<div class="hint" style="color:${color};">${pct>=100?'חרג מהמכסה החודשית':'מתקרב למכסה החודשית'}</div>`:''}
      ` : `<div class="pill pill-gray">ללא בנק שעות</div> <span class="cell-muted" style="margin-right:8px;">${fmtHoursShort(used)} ש׳ החודש</span>`}
    </div>
    <div class="hint" style="margin-top:10px;">${entryCount} דיווחים בסה״כ</div>
  </div>`;
}

async function createClientField(){
  const label = document.getElementById('nfLabel').value.trim();
  const field_type = document.getElementById('nfType').value;
  const errEl = document.getElementById('nfError');
  errEl.classList.add('hidden');
  if(!label){ errEl.textContent = 'יש להזין שם לשדה'; errEl.classList.remove('hidden'); return; }
  const body = { label, field_type };
  if(field_type === 'select'){
    const options = document.getElementById('nfOptions').value.split('\n').map(s=>s.trim()).filter(Boolean);
    if(!options.length){ errEl.textContent = 'יש להזין לפחות אפשרות אחת'; errEl.classList.remove('hidden'); return; }
    body.options = options;
  }
  try{
    await apiCall('/client-fields', { method:'POST', body: JSON.stringify(body) });
    await refreshData();
    toast('השדה נוסף בהצלחה');
    openManageFieldsModal();
  }catch(err){ errEl.textContent = 'שגיאה: '+err.message; errEl.classList.remove('hidden'); }
}

async function toggleClientField(fieldId, currentlyActive){
  try{
    await apiCall(`/client-fields/${fieldId}`, { method:'PATCH', body: JSON.stringify({ active: !currentlyActive }) });
    await refreshData();
    openManageFieldsModal();
  }catch(err){ toast('שגיאה: '+err.message); }
}

async function createEmployeeField(){
  const label = document.getElementById('nefLabel').value.trim();
  const field_type = document.getElementById('nefType').value;
  const errEl = document.getElementById('nefError');
  errEl.classList.add('hidden');
  if(!label){ errEl.textContent = 'יש להזין שם לשדה'; errEl.classList.remove('hidden'); return; }
  const body = { label, field_type };
  if(field_type === 'select'){
    const options = document.getElementById('nefOptions').value.split('\n').map(s=>s.trim()).filter(Boolean);
    if(!options.length){ errEl.textContent = 'יש להזין לפחות אפשרות אחת'; errEl.classList.remove('hidden'); return; }
    body.options = options;
  }
  try{
    await apiCall('/employee-fields', { method:'POST', body: JSON.stringify(body) });
    await refreshData();
    toast('השדה נוסף בהצלחה');
    openManageEmployeeFieldsModal();
  }catch(err){ errEl.textContent = 'שגיאה: '+err.message; errEl.classList.remove('hidden'); }
}

function renderCustomFieldInput(field, c){
  const fv = c?.fieldValues?.[field.id] || {};
  const inputId = `cf_${field.id}`;
  if(field.type === 'file'){
    const current = fv.file_name
      ? `<div class="hint">קובץ נוכחי: <a href="#" onclick="downloadClientField('${c.id}','${field.id}','${fv.file_name}'); return false;">${fv.file_name}</a> (${Math.round((fv.file_size||0)/1024)}KB)</div>`
      : `<div class="hint">לא הועלה קובץ עדיין</div>`;
    return `<div class="field">
      <label>${field.label}</label>
      ${current}
      <input type="file" id="${inputId}" onchange="pendingFieldFiles['${field.id}']=this.files[0]">
    </div>`;
  }
  if(field.type === 'textarea'){
    return `<div class="field"><label>${field.label}</label><textarea id="${inputId}">${fv.value||''}</textarea></div>`;
  }
  if(field.type === 'select'){
    return `<div class="field"><label>${field.label}</label>
      <select id="${inputId}">
        <option value="">— לא נבחר —</option>
        ${(field.options||[]).map(o=>`<option value="${o}" ${fv.value===o?'selected':''}>${o}</option>`).join('')}
      </select>
    </div>`;
  }
  const type = field.type === 'url' ? 'url' : 'text';
  return `<div class="field"><label>${field.label}</label><input type="${type}" id="${inputId}" value="${fv.value||''}"></div>`;
}

async function saveClient(clientId){
  const businessName = document.getElementById('cBusinessName').value.trim();
  const name = document.getElementById('cName').value.trim();
  if(!businessName && !name){ toast('יש להזין שם עסק או שם איש קשר'); return; }
  const phone = document.getElementById('cPhone').value.trim();
  const email = document.getElementById('cEmail').value.trim();
  const active = document.getElementById('cActive').value === 'true';
  const description = document.getElementById('cDescription').value.trim();
  const paymentMethod = document.getElementById('cPaymentMethod').value;
  const monthlyQuota = paymentMethod==='hours_bank' ? (Number(document.getElementById('cQuota').value)||0) : 0;
  const hourlyRate = paymentMethod==='hourly' ? (Number(document.getElementById('cHourlyRate').value)||0) : 0;
  const linkedFreelancerIds = Array.from(document.querySelectorAll('#cLinkedFreelancers input[type=checkbox]:checked')).map(el=>el.value);

  const body = {
    name: businessName || name, business_name: businessName, contact_phone: phone, contact_email: email,
    description, payment_method: paymentMethod, monthly_quota_hours: monthlyQuota, hourly_rate: hourlyRate, archived: !active,
  };

  try{
    let savedId = clientId;
    if(clientId){
      await apiCall(`/projects/${clientId}`, { method:'PATCH', body: JSON.stringify(body) });
      toast('פרטי הלקוח עודכנו');
    }else{
      const created = await apiCall('/projects', { method:'POST', body: JSON.stringify(body) });
      savedId = created.id;
      toast('הלקוח נוסף בהצלחה');
    }
    await apiCall(`/projects/${savedId}/freelancers`, {
      method:'PUT',
      body: JSON.stringify({ employee_ids: linkedFreelancerIds.map(Number) }),
    });

    for(const f of state.clientFields.filter(f=>f.active)){
      if(f.type === 'file'){
        const file = pendingFieldFiles[f.id];
        if(file) await apiUpload(`/projects/${savedId}/fields/${f.id}/file`, file);
        continue;
      }
      const el = document.getElementById(`cf_${f.id}`);
      if(!el) continue;
      await apiCall(`/projects/${savedId}/fields/${f.id}`, { method:'PUT', body: JSON.stringify({ value: el.value || null }) });
    }

    closeModal();
    await refreshData();
    renderAll();
  }catch(err){
    const el = document.getElementById('cFieldsError');
    if(el){ el.textContent = 'שגיאה: '+err.message; el.classList.remove('hidden'); }
    else toast('שגיאה: '+err.message);
  }
}

function exportClientsToExcel(){
  if(!state.clients.length){ toast('אין לקוחות לייצוא'); return; }
  const rows = state.clients.map(c=>{
    const used = clientMonthMinutes(c.id);
    const pct = (c.useHoursBank && c.monthlyQuota>0) ? Math.round(used/(c.monthlyQuota*60)*100) : null;
    const linked = (c.linkedFreelancerIds||[]).map(id=>getFreelancer(id)?.name).filter(Boolean);
    return {
      'שם העסק': c.businessName || '',
      'איש קשר': c.name || '',
      'נייד': c.phone || '',
      'דוא"ל': c.email || '',
      'סטטוס': c.active===false ? 'לא פעיל' : 'פעיל',
      'בנק שעות (שעות בחודש)': c.useHoursBank ? c.monthlyQuota : 'ללא',
      'שעות שנוצלו החודש': fmtHoursShort(used),
      'אחוז ניצול': pct!==null ? pct+'%' : '—',
      'מקושרים ללקוח': linked.length ? linked.join(', ') : 'פתוח לכולם',
      'תיאור': c.description || '',
    };
  });
  exportToExcel(`לקוחות_${todayFileStamp()}`, [{ name:'לקוחות', rows }]);
}

              requestCell = pendingReq
                ? `<span class="pill pill-amber" title="בקשת עריכה ממתינה לאישור מנהל">${ICON.request} ממתין לאישור</span>`
                : `<button class="icon-btn" title="בקש עריכת דיווח" onclick="openEditRequestForm('${e.id}')">${ICON.request}</button>`;
            }
            const adminActions = admin ? `
                <button class="icon-btn" onclick="openEntryForm('${e.id}')">${ICON.edit}</button>
                <button class="icon-btn" onclick="deleteEntry('${e.id}')">${ICON.trash}</button>` : '';
            return `<tr>
              ${admin?`<td>${f?.name||'—'}</td>`:''}
              <td class="cell-muted">${fmtDateHe(e.date)}</td>
              <td>${clientDisplayName(c)}</td>
              <td class="mono cell-muted">${e.start}–${e.end}</td>
              <td class="mono">${fmtMinutes(e.minutes)}</td>
              <td class="mono" title="נצרב לפי תעריף ${rateNote}">${fmtCurrency(e.cost||0)}<div class="cell-muted" style="font-size:10.5px; font-weight:500;">${rateNote}</div></td>
              <td style="max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${e.description||''}">${e.autoClosed?`<span class="pill pill-amber" style="margin-left:5px;">${ICON.bolt} אוטומטי</span>`:''}${e.description||'—'}</td>
              <td style="display:flex; gap:5px; align-items:center;">
                ${requestCell}
                ${adminActions}
              </td>
            </tr>`;
          }).join('') || `<tr class="empty-row"><td colspan="${admin?8:7}">לא נמצאו דיווחים תואמים לסינון</td></tr>`}
        </tbody>
      </table>
    </div>
  `;
  return html;
}

function updateEntryDuration(){
  const start = document.getElementById('eStart').value;
  const end = document.getElementById('eEnd').value;
  const durField = document.getElementById('eDuration');
  if(!start || !end || !durField) return;
  durField.value = fmtMinutes(minutesBetween(start,end));
}

function updateEntryRateHint(){
  const lockedField = document.getElementById('eFreelancerLocked');
  const sel = document.getElementById('eFreelancer');
  const hint = document.getElementById('eRateHint');
  if(!hint) return;
  const freelancerId = lockedField ? lockedField.value : sel?.value;
  const f = getFreelancer(freelancerId);
  const rate = parseRate(f?.hourlyRate);
  hint.textContent = rate
    ? `הדיווח ייצרב לפי תעריף ${fmtCurrency(rate)} לשעה (${f?.name})`
    : `לא הוגדר תעריף שעתי ל-${f?.name||'העובד'} — הדיווח ייצרב בעלות 0 ₪`;
}

function updateEntryDescCounter(){
  const desc = document.getElementById('eDesc');
  const counter = document.getElementById('eDescCounter');
  if(!desc || !counter) return;
  const len = desc.value.trim().length;
  const ok = len>=10;
  counter.textContent = ok ? `${len} תווים ✓` : `${len}/10 תווים לפחות`;
  counter.style.color = ok ? 'var(--green)' : 'var(--red)';
}

async function saveEntry(entryId){
  const lockedField = document.getElementById('eFreelancerLocked');
  const freelancerId = lockedField ? lockedField.value : document.getElementById('eFreelancer').value;
  const clientId = document.getElementById('eClient').value;
  const date = document.getElementById('eDate').value;
  const start = document.getElementById('eStart').value;
  const end = document.getElementById('eEnd').value;
  const description = document.getElementById('eDesc').value.trim();
  if(!date || !start || !end){ toast('יש למלא תאריך ושעות'); return; }
  if(description.length < 10){
    toast('יש למלא תיאור דיווח עבודה של לפחות 10 תווים');
    updateEntryDescCounter();
    return;
  }

  const started_at = new Date(`${date}T${start}:00`).toISOString();
  const ended_at = new Date(`${date}T${end}:00`).toISOString();
  const body = { project_id: clientId?Number(clientId):null, description, started_at, ended_at };

  try{
    if(entryId){
      await apiCall(`/time-entries/${entryId}`, { method:'PATCH', body: JSON.stringify(body) });
      toast('הדיווח עודכן בהצלחה');
    }else{
      await apiCall('/time-entries', {
        method:'POST',
        body: JSON.stringify({ ...body, employee_id: state.currentUserId!==freelancerId?Number(freelancerId):undefined }),
      });
      toast('הדיווח נוסף בהצלחה');
    }
    closeModal();
    await refreshData();
    renderAll();
  }catch(err){ toast('שגיאה: '+err.message); }
}

async function deleteEntry(entryId){
  try{
    await apiCall(`/time-entries/${entryId}`, { method:'DELETE' });
    toast('הדיווח נמחק');
    await refreshData();
    renderAll();
  }catch(err){ toast('שגיאה: '+err.message); }
}

  return state.editRequests.some(r=>r.entryId===entryId && r.status==='pending');
}

function updateReqReasonCounter(){
  const el = document.getElementById('reqReason');
  const counter = document.getElementById('reqReasonCounter');
  if(!el || !counter) return;
  const len = el.value.trim().length;
  const ok = len>=10;

}

async function submitEditRequest(entryId){
  const reason = document.getElementById('reqReason').value.trim();
  if(reason.length < 10){
    toast('יש לפרט את הבעיה ב-10 תווים לפחות');
    updateReqReasonCounter();
    return;

  try{
    await apiCall('/edit-requests', { method:'POST', body: JSON.stringify({ entry_id: Number(entryId), reason }) });
    closeModal();
    toast('הבקשה נשלחה למנהל המערכת בהצלחה');
    await refreshData();
    renderAll();
  }catch(err){ toast('שגיאה: '+err.message); }
}

              : `<span class="pill pill-red">${ICON.close} נדחה</span>`;
            const entryCell = e
              ? `<div style="font-weight:600;">${clientDisplayName(c)}</div><div class="cell-muted" style="font-size:12px;">${fmtDateHe(e.date)} · ${e.start}–${e.end}</div>`

function updateTicketDescCounter(){
  const el = document.getElementById('tDesc');
  const counter = document.getElementById('tDescCounter');
  if(!el || !counter) return;
  const len = el.value.trim().length;
  const ok = len>=10;
  counter.textContent = ok ? `${len} תווים ✓` : `${len}/10 תווים לפחות`;
  counter.style.color = ok ? 'var(--green)' : 'var(--red)';
}

async function saveSupportTicket(){
  const subject = document.getElementById('tSubject').value;
  const message = document.getElementById('tDesc').value.trim();
  if(message.length < 10){
    toast('יש לפרט את הפנייה ב-10 תווים לפחות');
    updateTicketDescCounter();
    return;
  }
  try{
    await apiCall('/tickets', { method:'POST', body: JSON.stringify({ subject, message }) });
    closeModal();
    toast('הפנייה נפתחה בהצלחה ותועבר ישירות לצוות TreeTime');
    await refreshData();
    activePage = 'support';
    renderAll();

    const el = document.getElementById('tError');
    if(el){ el.textContent = 'שגיאה: '+err.message; el.classList.remove('hidden'); }
    else toast('שגיאה: '+err.message);
  }
}

function fmtTicketDateTime(iso){
  const d = new Date(iso);
  const datePart = d.toLocaleDateString('he-IL',{day:'numeric',month:'long',year:'numeric'});
  const timePart = d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
  return `${datePart} בשעה ${timePart}`;
}

let pendingEmployeeFieldFiles = {};

function renderEmployeeCustomFieldInput(field, f){
  const fv = f?.fieldValues?.[field.id] || {};
  const inputId = `ef_${field.id}`;
  if(field.type === 'file'){
    const current = fv.file_name
      ? `<div class="hint">קובץ נוכחי: <a href="#" onclick="downloadEmployeeField('${f.id}','${field.id}','${fv.file_name}'); return false;">${fv.file_name}</a> (${Math.round((fv.file_size||0)/1024)}KB)</div>`
      : `<div class="hint">לא הועלה קובץ עדיין</div>`;
    return `<div class="field">
      <label>${field.label}</label>
      ${current}
      <input type="file" id="${inputId}" onchange="pendingEmployeeFieldFiles['${field.id}']=this.files[0]">
    </div>`;
  }
  if(field.type === 'textarea'){
    return `<div class="field"><label>${field.label}</label><textarea id="${inputId}">${fv.value||''}</textarea></div>`;
  }
  if(field.type === 'select'){
    return `<div class="field"><label>${field.label}</label>
      <select id="${inputId}">
        <option value="">— לא נבחר —</option>
        ${(field.options||[]).map(o=>`<option value="${o}" ${fv.value===o?'selected':''}>${o}</option>`).join('')}
      </select>
    </div>`;
  }
  const type = field.type === 'url' ? 'url' : 'text';
  return `<div class="field"><label>${field.label}</label><input type="${type}" id="${inputId}" value="${fv.value||''}"></div>`;
}

async function downloadEmployeeField(employeeId, fieldId, fileName){
  try{
    const res = await fetch(`${API}/employees/${employeeId}/fields/${fieldId}/file`, {
      headers: authToken ? { Authorization: `Bearer ${authToken}` } : {},
    });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fileName || 'file';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }catch(err){ toast('שגיאה בהורדת הקובץ: '+err.message); }
}

async function saveFreelancer(freelancerId){
  const name = document.getElementById('frName').value.trim();
  if(!name){ toast('יש להזין שם'); return; }
  const email = document.getElementById('frEmail').value.trim();
  const phone = document.getElementById('frPhone').value.trim();
  const active = document.getElementById('frActive').value === 'true';
  const role = document.getElementById('frRole').value;
  const businessType = document.getElementById('frBusinessType').value;
  const foreignWorker = document.getElementById('frForeign').value === 'true';
  const hourlyRate = Number(document.getElementById('frRate').value) || 0;
  const notes = document.getElementById('frNotes').value.trim();
  const bankBeneficiary = document.getElementById('frBankBeneficiary').value.trim();
  const bankName = document.getElementById('frBankName').value.trim();
  const bankBranch = document.getElementById('frBankBranch').value.trim();
  const bankAccount = document.getElementById('frBankAccount').value.trim();
  const bankTaxId = document.getElementById('frBankTaxId').value.trim();
  const password = document.getElementById('frPassword').value;

  const body = {
    full_name: name, email, phone, active, role, business_type: businessType,
    foreign_worker: foreignWorker, hourly_rate: hourlyRate, notes,
    bank_beneficiary: bankBeneficiary, bank_name: bankName, bank_branch: bankBranch,
    bank_account: bankAccount, bank_tax_id: bankTaxId,
  };
  if(password) body.password = password;
  if(!freelancerId && (!password || password.length < 8)){
    toast('יש להזין סיסמה של לפחות 8 תווים לעובד חדש');
    return;
  }

  try{
    let savedId = freelancerId;
    if(freelancerId){
      await apiCall(`/employees/${freelancerId}`, { method:'PATCH', body: JSON.stringify(body) });
      toast('פרטי העובד עודכנו');
    }else{
      const created = await apiCall('/employees', { method:'POST', body: JSON.stringify(body) });
      savedId = created.id;
      toast('העובד נוסף בהצלחה');
    }

    for(const ef of state.employeeFields.filter(ef=>ef.active)){
      if(ef.type === 'file'){
        const file = pendingEmployeeFieldFiles[ef.id];
        if(file) await apiUpload(`/employees/${savedId}/fields/${ef.id}/file`, file);
        continue;
      }
      const el = document.getElementById(`ef_${ef.id}`);
      if(!el) continue;
      await apiCall(`/employees/${savedId}/fields/${ef.id}`, { method:'PUT', body: JSON.stringify({ value: el.value || null }) });
    }

    closeModal();
    await refreshData();
    renderAll();
  }catch(err){
    const el = document.getElementById('frError');
    if(el){ el.textContent = 'שגיאה: '+err.message; el.classList.remove('hidden'); }
    else toast('שגיאה: '+err.message);
  }
}

const HE_DAY_NAMES = ['יום א׳','יום ב׳','יום ג׳','יום ד׳','יום ה׳','יום ו׳','שבת'];

let timelineState = { freelancerId:null, weekOffset:0 };

function getClientColor(clientId){
  const idx = state.clients.findIndex(c=>c.id===clientId);
  return TL_COLORS[idx>=0 ? idx % TL_COLORS.length : 0];
}

function getWeekDates(weekOffset){
  const now = new Date();
  const sunday = new Date(now);
  sunday.setDate(now.getDate() - now.getDay() + (weekOffset*7));
  sunday.setHours(0,0,0,0);
  return Array.from({length:7}, (_,i)=>{
    const d = new Date(sunday);
    d.setDate(sunday.getDate()+i);
    return d;
  });
}

function toDateKey(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function openTimelineView(freelancerId){
  timelineState = { freelancerId, weekOffset:0 };
  openModal(renderTimelineModalContent(), true);
}

function changeTimelineWeek(delta){
  timelineState.weekOffset += delta;
  document.getElementById('modalBox').innerHTML = renderTimelineModalContent();
}

function renderTimelineModalContent(){
  const f = getFreelancer(timelineState.freelancerId);
  const weekDates = getWeekDates(timelineState.weekOffset);
  const weekStart = weekDates[0], weekEnd = weekDates[6];
  const weekLabel = timelineState.weekOffset===0
    ? `השבוע · ${weekStart.getDate()}–${weekEnd.getDate()} ב${weekEnd.toLocaleDateString('he-IL',{month:'long'})}`
    : `${weekStart.getDate()}–${weekEnd.getDate()} ב${weekEnd.toLocaleDateString('he-IL',{month:'long'})} ${weekEnd.getFullYear()}`;

  const weekEntries = state.entries.filter(e=>{
    if(e.freelancerId!==timelineState.freelancerId) return false;
    return weekDates.some(d=>toDateKey(d)===e.date);
  });

  const usedClientIds = [...new Set(weekEntries.map(e=>e.clientId))];
  const todayKey = toDateKey(new Date());
  const totalRangeMin = (TL_END_HOUR-TL_START_HOUR)*60;
  const hourMarks = [];
  for(let h=TL_START_HOUR; h<=TL_END_HOUR; h+=3) hourMarks.push(h);

  const dayColumns = weekDates.map(d=>{
    const key = toDateKey(d);
    const dayEntries = weekEntries.filter(e=>e.date===key);
    const dayMinutes = dayEntries.reduce((s,e)=>s+e.minutes,0);
    const isToday = key===todayKey;

    const blocksHtml = dayEntries.map(e=>{
      const [sh,sm] = e.start.split(':').map(Number);
      let startMin = (sh*60+sm) - TL_START_HOUR*60;
      let durMin = e.minutes;
      startMin = Math.max(0, Math.min(startMin, totalRangeMin));
      durMin = Math.max(14, Math.min(durMin, totalRangeMin-startMin));
      const top = (startMin/totalRangeMin)*100;
      const height = (durMin/totalRangeMin)*100;
      const c = getClient(e.clientId);
      const color = getClientColor(e.clientId);
      return `<div class="tl-block" style="top:${top}%; height:${height}%; background:${color};" title="${clientDisplayName(c)} · ${e.start}–${e.end} · ${fmtMinutes(e.minutes)}${e.description?' · '+e.description:''}">
        <div>${e.start}–${e.end}</div>
        <div class="c">${clientDisplayName(c)}</div>
      </div>`;
    }).join('');

    const gridlinesHtml = hourMarks.map(h=>{
      const top = ((h-TL_START_HOUR)*60/totalRangeMin)*100;
      return `<div class="tl-gridline" style="top:${top}%;"></div>`;
    }).join('');

    return `<div class="tl-day-col">
      <div class="tl-day-head ${isToday?'today':''}">
        <div class="d">${HE_DAY_NAMES[d.getDay()]}</div>
        <div class="n">${d.getDate()}/${d.getMonth()+1}</div>
      </div>
      <div class="tl-day-body">
        ${gridlinesHtml}
        ${blocksHtml || `<div class="tl-empty-day">אין דיווחים</div>`}
      </div>
      <div class="tl-day-foot" style="${dayMinutes>=480?'color:var(--amber);':''}">${dayMinutes? fmtHoursShort(dayMinutes)+' ש׳' : '—'}</div>
    </div>`;
  }).join('');

  const axisHtml = `<div class="tl-axis">
    <div class="tl-day-head">&nbsp;</div>
    <div class="tl-day-body">
      ${hourMarks.map(h=>{
        const top = ((h-TL_START_HOUR)*60/totalRangeMin)*100;
        return `<div class="tl-axis-label" style="top:${top}%;">${h}:00</div>`;
      }).join('')}
    </div>
    <div class="tl-day-foot">&nbsp;</div>
  </div>`;

  const weekTotal = weekEntries.reduce((s,e)=>s+e.minutes,0);

  return `
    <div class="modal-head"><h3>ציר זמן שבועי — ${f?.name||'—'}</h3><button class="modal-close" onclick="closeModal()">${ICON.close}</button></div>
    <div class="modal-body">
      <div class="tl-header">
        <div class="tl-nav">
          <button class="icon-btn" onclick="changeTimelineWeek(-1)" title="שבוע קודם">›</button>
          <div class="tl-week-label">${weekLabel}</div>
          <button class="icon-btn" onclick="changeTimelineWeek(1)" title="שבוע הבא">‹</button>
        </div>
        <div class="cell-muted" style="font-size:12.5px;">סה״כ השבוע: <b style="color:var(--ink);">${fmtHoursShort(weekTotal)} ש׳</b></div>
      </div>

      ${usedClientIds.length ? `<div class="tl-legend">
        ${usedClientIds.map(cid=>{
          const c = getClient(cid);
          return `<div class="tl-legend-item"><span class="tl-legend-dot" style="background:${getClientColor(cid)};"></span>${clientDisplayName(c)}</div>`;
        }).join('')}
      </div>` : ''}

      <div class="tl-grid">
        ${dayColumns}
        ${axisHtml}
      </div>
      <div class="hint" style="margin-top:10px;">כל בלוק צבוע לפי הלקוח (ראה מקרא למעלה). עמודה ריקה מסמנת יום ללא דיווח.</div>
    </div>
  `;
}

const TASK_STATUS_PILL = { new:'pill-gray', in_progress:'pill-amber', done:'pill-green' };

let taskFilters = { freelancerId:'', clientId:'', from:'', to:'' };

function tasksForCurrentView(){
  return isAdmin() ? state.tasks : state.tasks.filter(t=>t.freelancerId===state.currentUserId);
}

function renderTasksPage(){
  const admin = isAdmin();
  const list = [...tasksForCurrentView()].filter(t=>{
    if(taskFilters.freelancerId && t.freelancerId!==taskFilters.freelancerId) return false;
    if(taskFilters.clientId && t.clientId!==taskFilters.clientId) return false;
    if(taskFilters.from && (!t.deadline || t.deadline<taskFilters.from)) return false;
    if(taskFilters.to && (!t.deadline || t.deadline>taskFilters.to)) return false;
    return true;
  }).sort((a,b)=>{
    if(a.status==='done' && b.status!=='done') return 1;
    if(a.status!=='done' && b.status==='done') return -1;
    if(!a.deadline && b.deadline) return 1;
    if(a.deadline && !b.deadline) return -1;
    return (a.deadline||'').localeCompare(b.deadline||'');
  });
  const today = todayStr();

  const html = `
    <div class="page-head">
      <div>
        <h1>${admin?'משימות':'המשימות שלי'}</h1>
        <p>${admin?'משימות המקושרות ללקוחות — ניתן לדווח עליהן שעות ישירות מתוך המשימה':'משימות שהוקצו לך — לחץ על משימה כדי להתחיל שעון עבודה מקושר'}</p>
      </div>
      <button class="btn btn-primary" onclick="openTaskForm()">${ICON.plus} משימה חדשה</button>
    </div>

    <div class="panel" style="margin-bottom:16px;">
      <div class="panel-pad filters">
        ${admin ? `<select id="tfFilterFreelancer">
          <option value="">כל העובדים</option>
          ${state.freelancers.map(f=>`<option value="${f.id}" ${taskFilters.freelancerId===f.id?'selected':''}>${f.name}</option>`).join('')}
        </select>` : ''}
        <select id="tfFilterClient">
          <option value="">כל הלקוחות</option>
          ${state.clients.map(c=>`<option value="${c.id}" ${taskFilters.clientId===c.id?'selected':''}>${clientDisplayName(c)}</option>`).join('')}
        </select>
        <input type="date" id="tfFilterFrom" value="${taskFilters.from}">
        <input type="date" id="tfFilterTo" value="${taskFilters.to}">
        <button class="btn btn-ghost btn-sm" onclick="clearTaskFilters()">נקה סינון</button>
      </div>
    </div>

    <div class="panel">
      <table>
        <thead><tr><th>סטטוס</th><th>תיאור</th><th>לקוח</th>${admin?'<th>עובד</th>':''}<th>דדליין</th><th></th></tr></thead>
        <tbody>
          ${list.map(t=>{
            const c = getClient(t.clientId);
            const f = getFreelancer(t.freelancerId);
            const overdue = t.deadline && t.deadline<today && t.status!=='done';
            const deadlineCell = t.deadline
              ? `<span class="${overdue?'pill pill-red':''}">${fmtDateHe(t.deadline)}</span>`
              : `<span class="cell-muted">—</span>`;
            const isAssignee = t.freelancerId===state.currentUserId;
            const runningTimer = state.activeTimers.find(x=>x.taskId===t.id && x.freelancerId===state.currentUserId);
            let timerBtn = '';
            if(t.status!=='done' && isAssignee){
              timerBtn = runningTimer
                ? `<button class="btn btn-sm btn-danger-ghost" onclick="event.stopPropagation(); stopTimer('${runningTimer.id}')">${ICON.stop} עצור</button>`
                : `<button class="btn btn-sm btn-primary" onclick="event.stopPropagation(); startTimerForTask('${t.id}')">${ICON.play} התחל שעון</button>`;
            }
            return `<tr style="cursor:pointer;" onclick="openTaskDetail('${t.id}')">
              <td><span class="pill ${TASK_STATUS_PILL[t.status]}">${TASK_STATUS_LABEL[t.status]}</span></td>
              <td style="max-width:280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${t.description}">${t.description}</td>
              <td>${c?clientDisplayName(c):'<span class="cell-muted">—</span>'}</td>
              ${admin?`<td>${f?.name||'<span class="cell-muted">לא הוקצה</span>'}</td>`:''}
              <td>${deadlineCell}</td>
              <td style="display:flex; gap:6px;">
                ${timerBtn}
                <button class="btn btn-sm btn-ghost" onclick="event.stopPropagation(); openTaskDetail('${t.id}')">פתח</button>
              </td>
            </tr>`;
          }).join('') || `<tr class="empty-row"><td colspan="${admin?6:5}">אין משימות ${admin?'במערכת':'שהוקצו לך'} כרגע</td></tr>`}
        </tbody>
      </table>
    </div>
  `;
  return html;
}

function bindTaskFilters(){
  const fF = document.getElementById('tfFilterFreelancer');
  const fC = document.getElementById('tfFilterClient');
  const fFrom = document.getElementById('tfFilterFrom');
  const fTo = document.getElementById('tfFilterTo');
  if(!fC) return;
  if(fF) fF.onchange = ()=>{ taskFilters.freelancerId = fF.value; renderAll(); };
  fC.onchange = ()=>{ taskFilters.clientId = fC.value; renderAll(); };
  fFrom.onchange = ()=>{ taskFilters.from = fFrom.value; renderAll(); };
  fTo.onchange = ()=>{ taskFilters.to = fTo.value; renderAll(); };
}
function clearTaskFilters(){ taskFilters = { freelancerId:'', clientId:'', from:'', to:'' }; renderAll(); }

  openModal(`
    <div class="modal-head"><h3>משימה</h3><button class="modal-close" onclick="closeModal()">${ICON.close}</button></div>
    <div class="modal-body">

      </div>
      <div class="field-row" style="margin-top:14px;">

        <div class="field"><label>עובד מקושר</label><div>${f?.name||'<span class="cell-muted">לא הוקצה</span>'}</div></div>
      </div>
      <div class="field-row">
        <div class="field"><label>דדליין</label><div>${t.deadline?fmtDateHe(t.deadline):'<span class="cell-muted">לא הוגדר</span>'}</div></div>
        <div class="field"><label>סטטוס</label>
          ${admin || isAssignee
            ? `<select id="taskStatusSelect" onchange="updateTaskStatus('${t.id}', this.value)">
                 ${Object.keys(TASK_STATUS_LABEL).map(s=>`<option value="${s}" ${t.status===s?'selected':''}>${TASK_STATUS_LABEL[s]}</option>`).join('')}
               </select>`
            : `<span class="pill ${TASK_STATUS_PILL[t.status]}">${TASK_STATUS_LABEL[t.status]}</span>`}
        </div>
      </div>
      <hr style="margin:16px 0; border:none; border-top:1px solid var(--border);">
      <div id="taskTimerArea">
        ${runningTimer

             <button class="btn btn-danger-ghost btn-block" onclick="closeModal(); stopTimer('${runningTimer.id}')">${ICON.stop} עצור שעון</button>`
          : (isAssignee

      ${admin ? `<button class="btn btn-ghost" onclick="openTaskForm('${t.id}')">${ICON.edit} עריכה</button>
                 <button class="btn btn-danger-ghost" onclick="deleteTask('${t.id}')">${ICON.trash} מחיקה</button>` : ''}
      <button class="btn btn-ghost" onclick="closeModal()">סגור</button>
    </div>
  `);
}

async function updateTaskStatus(taskId, status){
  try{
    await apiCall(`/tasks/${taskId}`, { method:'PATCH', body: JSON.stringify({ status }) });
    await refreshData();
    toast('סטטוס המשימה עודכן');
    renderAll();
  }catch(err){ toast('שגיאה: '+err.message); }
}

async function startTimerForTask(taskId){
  const myActive = state.activeTimers.filter(t=>t.freelancerId===state.currentUserId);
  if(myActive.length>=3){ toast('הגעת למגבלה של 3 שעונים פתוחים במקביל'); return; }
  try{
    await apiCall('/time-entries/start', { method:'POST', body: JSON.stringify({ task_id: Number(taskId), source:'web' }) });
    closeModal();
    toast('השעון הופעל והוקשר למשימה');
    await refreshData();
    renderAll();
  }catch(err){ toast('שגיאה: '+err.message); }
}

async function saveTask(taskId){
  const description = document.getElementById('tfDesc').value.trim();
  if(!description){ toast('יש למלא תיאור למשימה'); return; }
  const freelancerField = document.getElementById('tfFreelancer');
  const body = {
    description,
    project_id: document.getElementById('tfClient').value ? Number(document.getElementById('tfClient').value) : null,
    employee_id: freelancerField ? (freelancerField.value ? Number(freelancerField.value) : null) : undefined,
    deadline: document.getElementById('tfDeadline').value || null,
    status: document.getElementById('tfStatus').value,
  };
  try{
    if(taskId) await apiCall(`/tasks/${taskId}`, { method:'PATCH', body: JSON.stringify(body) });
    else await apiCall('/tasks', { method:'POST', body: JSON.stringify(body) });
    closeModal();
    toast(taskId?'המשימה עודכנה':'המשימה נוצרה בהצלחה');
    await refreshData();
    renderAll();
  }catch(err){ toast('שגיאה: '+err.message); }
}

async function deleteTask(taskId){
  if(!confirm('למחוק את המשימה? לא ניתן לשחזר.')) return;
  try{
    await apiCall(`/tasks/${taskId}`, { method:'DELETE' });
    closeModal();
    toast('המשימה נמחקה');
    await refreshData();
    renderAll();
  }catch(err){ toast('שגיאה: '+err.message); }
}

        <button class="btn btn-ghost" onclick="exportActiveTimersToExcel()">${ICON.fileExport} שעונים פתוחים כרגע</button>
        <button class="btn btn-ghost" onclick="exportSupportToExcel()">${ICON.fileExport} פניות תמיכה</button>
      </div>

      <div style="margin-top:20px; padding-top:20px; border-top:1px solid var(--border);">
        <div class="sub" style="margin-bottom:10px;">ייבוא לקוחות מקובץ CSV או Excel — עמודות מזוהות: שם העסק, איש קשר, נייד, דוא"ל, סטטוס (פעיל/לא פעיל), בנק שעות (שעות בחודש), תיאור</div>
        <input type="file" id="importClientsFile" accept=".csv,.xlsx,.xls">
        <button class="btn btn-primary" style="width:auto; margin-top:12px;" id="importClientsBtn" onclick="importClientsFromFile()">${ICON.plus} ייבא לקוחות</button>
        <div class="hint" id="importClientsMsg" style="margin-top:8px;"></div>
      </div>
    `;
  }
  if(catId==='autoClose'){
    return `
      <div class="sub" style="margin-bottom:12px;">עבור שעונים שנשארו פתוחים כי שכחו לכבות אותם</div>
      <div class="field">
        <label>האם לאכוף סגירה אוטומטית של דיווחי עבודה פתוחים / שנשכחו?</label>
        <select id="sAutoCloseEnabled" onchange="toggleAutoCloseFields()">
          <option value="false" ${!s.autoCloseEnabled?'selected':''}>לא</option>
          <option value="true" ${s.autoCloseEnabled?'selected':''}>כן</option>
        </select>
      </div>

      <div id="autoCloseFieldsWrap" style="display:${s.autoCloseEnabled?'block':'none'};">
        <div class="field">
          <label>מתי לסגור אוטומטית את הדיווח?</label>
          <select id="sAutoCloseMode" onchange="toggleAutoCloseModeFields()">
            <option value="hours" ${s.autoCloseMode==='hours'?'selected':''}>אחרי כמות שעות רצופות שהדיווח פעיל</option>
            <option value="time" ${s.autoCloseMode==='time'?'selected':''}>בשעה קבועה כל יום</option>
          </select>
        </div>

        <div class="field" id="autoCloseHoursWrap" style="display:${s.autoCloseMode==='hours'?'block':'none'};">
          <label>כמות שעות רצופות עד לסגירה אוטומטית</label>
          <input type="number" min="1" step="0.5" id="sAutoCloseHours" value="${s.autoCloseAfterHours}">
          <div class="hint">לדוגמה: 8 — כל דיווח שנשאר פתוח 8 שעות רצופות ייסגר אוטומטית</div>
        </div>

        <div class="field" id="autoCloseTimeWrap" style="display:${s.autoCloseMode==='time'?'block':'none'};">
          <label>שעה קבועה לסגירת כל הדיווחים הפתוחים</label>
          <input type="time" id="sAutoCloseTime" value="${s.autoCloseTime}">
          <div class="hint">לדוגמה: 23:00 — כל דיווח שעדיין פתוח בשעה הזו ייסגר אוטומטית</div>
        </div>

        <div class="hint" style="background:var(--amber-soft); color:#8A5A16; padding:10px 12px; border-radius:9px; margin-top:6px;">
          כאשר דיווח נסגר אוטומטית, המערכת שומרת אותו כדיווח עבודה רגיל (עד לרגע הסגירה), ושולחת הודעה למנהל המערכת ולעובד שדיווח (בסימולציה). העובד יכול לפתוח לאחר מכן בקשת עריכה אם השעה בפועל הייתה שונה.
        </div>
      </div>
      <div style="margin-top:16px; padding-top:16px; border-top:1px solid var(--border);">
        <button class="btn btn-primary" onclick="saveSettings()">${ICON.check} שמור הגדרות</button>
      </div>
    `;
  }
  return '';
}

  const html = `
    <div class="page-head">

        <h1>הגדרות מערכת</h1>
        <p>לחץ על קטגוריה כדי לצפות בהגדרות הרלוונטיות</p>
      </div>
    </div>

      <div class="panel settings-cat-list">
        ${SETTINGS_CATEGORIES.map(cat=>`
          <div class="settings-cat-row ${settingsOpenCategory===cat.id?'active':''}" onclick="toggleSettingsCategory('${cat.id}')">

  const row = (label, adminKey, employeeKey) => `
    <tr>
