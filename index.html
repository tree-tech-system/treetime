    <div class="modal-head"><h3>${e?'עריכת דיווח':'דיווח עבודה ידני'}</h3><button class="modal-close" onclick="closeModal()">${ICON.close}</button></div>
    <div class="modal-body">
      <div class="field-row">
        <div class="field">
          <label>עובד</label>
          ${admin
            ? `<select id="eFreelancer" onchange="updateEntryRateHint()">${state.freelancers.map(f=>`<option value="${f.id}" ${formFreelancerId===f.id?'selected':''}>${f.name}</option>`).join('')}</select>`
            : `<select id="eFreelancer" disabled style="background:#F6F4EC;color:var(--muted);"><option>${getFreelancer(formFreelancerId)?.name||'—'}</option></select>
               <input type="hidden" id="eFreelancerLocked" value="${formFreelancerId}">`
          }
        </div>
        <div class="field">
          <label>לקוח</label>
          <select id="eClient">${clientOptions.map(c=>`<option value="${c.id}" ${e?.clientId===c.id?'selected':''}>${clientDisplayName(c)}</option>`).join('')}</select>
        </div>
      </div>
      <div class="hint" id="eRateHint" style="margin:-4px 0 12px;"></div>
      <div class="field"><label>תאריך</label><input type="date" id="eDate" value="${e?.date||todayStr()}"></div>
      <div class="field-row">
        <div class="field"><label>שעת התחלה</label><input type="time" id="eStart" value="${e?.start||'09:00'}" oninput="updateEntryDuration()"></div>
        <div class="field"><label>שעת סיום</label><input type="time" id="eEnd" value="${e?.end||'10:00'}" oninput="updateEntryDuration()"></div>
      </div>
      <div class="field"><label>משך זמן (מחושב אוטומטית)</label><input type="text" id="eDuration" value="${fmtMinutes(minutesBetween(e?.start||'09:00', e?.end||'10:00'))}" disabled style="background:#F6F4EC;color:var(--ink); font-weight:700;"></div>
      <div class="field">
        <label>תיאור</label>
        <textarea id="eDesc" placeholder="מה בוצע? (חובה למלא לפחות 10 תווים)" oninput="updateEntryDescCounter()">${e?.description||''}</textarea>
        <div class="hint" id="eDescCounter">0/10 תווים לפחות</div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-primary" onclick="saveEntry(${e?`'${e.id}'`:'null'})">${ICON.check} שמור דיווח</button>
      <button class="btn btn-ghost" onclick="closeModal()">ביטול</button>
    </div>
  `);
  updateEntryDescCounter();
  updateEntryRateHint();
}

function updateEntryDuration(){
  const start = document.getElementById('eStart').value;
  const end = document.getElementById('eEnd').value;
  const durField = document.getElementById('eDuration');
  if(!start || !end || !durField) return;
  durField.value = fmtMinutes(minutesBetween(start,end));
}

function updateEntryRateHint(){
  const lockedField = document.getElementById('eFreelancerLocked');
  const sel = document.getElementById('eFreelancer');
  const hint = document.getElementById('eRateHint');
  if(!hint) return;
  const freelancerId = lockedField ? lockedField.value : sel?.value;
  const f = getFreelancer(freelancerId);
  const rate = parseRate(f?.hourlyRate);
  hint.textContent = rate
    ? `הדיווח ייצרב לפי תעריף ${fmtCurrency(rate)} לשעה (${f?.name})`
    : `לא הוגדר תעריף שעתי ל-${f?.name||'העובד'} — הדיווח ייצרב בעלות 0 ₪`;
}

function updateEntryDescCounter(){
  const desc = document.getElementById('eDesc');
  const counter = document.getElementById('eDescCounter');
  if(!desc || !counter) return;
  const len = desc.value.trim().length;
  const ok = len>=10;
  counter.textContent = ok ? `${len} תווים ✓` : `${len}/10 תווים לפחות`;
  counter.style.color = ok ? 'var(--green)' : 'var(--red)';
}

async function saveEntry(entryId){
  const lockedField = document.getElementById('eFreelancerLocked');
  const freelancerId = lockedField ? lockedField.value : document.getElementById('eFreelancer').value;
  const clientId = document.getElementById('eClient').value;
  const date = document.getElementById('eDate').value;
  const start = document.getElementById('eStart').value;
  const end = document.getElementById('eEnd').value;
  const description = document.getElementById('eDesc').value.trim();
  if(!date || !start || !end){ toast('יש למלא תאריך ושעות'); return; }
  if(description.length < 10){
    toast('יש למלא תיאור דיווח עבודה של לפחות 10 תווים');
    updateEntryDescCounter();
    return;
  }

  const started_at = new Date(`${date}T${start}:00`).toISOString();
  const ended_at = new Date(`${date}T${end}:00`).toISOString();
  const body = { project_id: clientId?Number(clientId):null, description, started_at, ended_at };

  try{
    if(entryId){
      await apiCall(`/time-entries/${entryId}`, { method:'PATCH', body: JSON.stringify(body) });
      toast('הדיווח עודכן בהצלחה');
    }else{
      await apiCall('/time-entries', {
        method:'POST',
        body: JSON.stringify({ ...body, employee_id: state.currentUserId!==freelancerId?Number(freelancerId):undefined }),
      });
      toast('הדיווח נוסף בהצלחה');
    }
    closeModal();
    await refreshData();
    renderAll();
  }catch(err){ toast('שגיאה: '+err.message); }
}

async function deleteEntry(entryId){
  try{
    await apiCall(`/time-entries/${entryId}`, { method:'DELETE' });
    toast('הדיווח נמחק');
    await refreshData();
    renderAll();
  }catch(err){ toast('שגיאה: '+err.message); }
}

function hasPendingRequest(entryId){
  return state.editRequests.some(r=>r.entryId===entryId && r.status==='pending');
}

function openManualEditRequestForm(){
  const myEntries = state.entries
    .filter(e=>e.freelancerId===state.currentUserId && !hasPendingRequest(e.id))
    .sort((a,b)=> (b.date+b.start).localeCompare(a.date+a.start));

  if(!myEntries.length){
    toast('אין דיווחים זמינים לבקשת עריכה (ייתכן שכבר קיימת בקשה ממתינה על כל הדיווחים שלך)');
    return;
  }

  openModal(`
    <div class="modal-head"><h3>בחירת דיווח לבקשת עריכה</h3><button class="modal-close" onclick="closeModal()">${ICON.close}</button></div>
    <div class="modal-body">
      <div class="field">
        <label>בחר את הדיווח שברצונך לבקש לתקן</label>
        <select id="manualReqEntrySelect">
          ${myEntries.map(e=>{
            const c = getClient(e.clientId);
            return `<option value="${e.id}">${fmtDateHe(e.date)} · ${clientDisplayName(c)} · ${e.start}–${e.end}</option>`;
          }).join('')}
        </select>
      </div>
      <div class="hint">מוצגים רק הדיווחים שלך. בשלב הבא תוכל לפרט מה הייתה הבעיה בדיווח שנבחר.</div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-primary" onclick="continueManualEditRequest()">המשך</button>
      <button class="btn btn-ghost" onclick="closeModal()">ביטול</button>
    </div>
  `);
}

function continueManualEditRequest(){
  const entryId = document.getElementById('manualReqEntrySelect').value;
  openEditRequestForm(entryId);
}

/* ---------------------------- PAGE: EDIT REQUESTS ---------------------------- */
/* מטרה: מי ששכח לכבות שעון או דיווח בטעות יכול לפתוח בקשת עריכה למנהל המערכת,
   מקושרת לדיווח הספציפי, עם הסבר מה הייתה הבעיה. המנהל מאשר (ואז עורך את הדיווח בפועל) או דוחה. */

function openEditRequestForm(entryId){
  const e = state.entries.find(x=>x.id===entryId);
  if(!e) return;
  const c = getClient(e.clientId);
  openModal(`
    <div class="modal-head"><h3>בקשת עריכת דיווח</h3><button class="modal-close" onclick="closeModal()">${ICON.close}</button></div>
    <div class="modal-body">
      <div class="panel-pad" style="background:#FCFBF7; border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:16px;">
        <div style="font-weight:700; font-size:13.5px;">${clientDisplayName(c)}</div>
        <div class="cell-muted" style="font-size:12.5px; margin-top:2px;">${fmtDateHe(e.date)} · ${e.start}–${e.end} (${fmtMinutes(e.minutes)})</div>
        ${e.description?`<div class="cell-muted" style="font-size:12.5px; margin-top:6px; line-height:1.5;">"${e.description}"</div>`:''}
      </div>
      <div class="field">
        <label>מה הייתה הבעיה, ומה תרצה לשנות בדיווח?</label>
        <textarea id="reqReason" placeholder="לדוגמה: שכחתי לכבות את השעון בזמן, שעת הסיום בפועל הייתה 17:30 (חובה למלא לפחות 10 תווים)" oninput="updateReqReasonCounter()"></textarea>
        <div class="hint" id="reqReasonCounter">0/10 תווים לפחות</div>
      </div>
      <div class="hint">הבקשה תישלח למנהל המערכת לאישור. הדיווח המקורי לא ישתנה עד לאישור.</div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-primary" onclick="submitEditRequest('${entryId}')">${ICON.check} שלח בקשה למנהל</button>
      <button class="btn btn-ghost" onclick="closeModal()">ביטול</button>
    </div>
  `);
  updateReqReasonCounter();
}

function updateReqReasonCounter(){
  const el = document.getElementById('reqReason');
  const counter = document.getElementById('reqReasonCounter');
  if(!el || !counter) return;
  const len = el.value.trim().length;
  const ok = len>=10;
  counter.textContent = ok ? `${len} תווים ✓` : `${len}/10 תווים לפחות`;
  counter.style.color = ok ? 'var(--green)' : 'var(--red)';
}

async function submitEditRequest(entryId){
  const reason = document.getElementById('reqReason').value.trim();
  if(reason.length < 10){
    toast('יש לפרט את הבעיה ב-10 תווים לפחות');
    updateReqReasonCounter();
    return;
  }
  try{
    await apiCall('/edit-requests', { method:'POST', body: JSON.stringify({ entry_id: Number(entryId), reason }) });
    closeModal();
    toast('הבקשה נשלחה למנהל המערכת בהצלחה');
    await refreshData();
    renderAll();
  }catch(err){ toast('שגיאה: '+err.message); }
}

function renderEditRequestsPage(){
  const admin = isAdmin();
  const list = admin ? state.editRequests : state.editRequests.filter(r=>r.freelancerId===state.currentUserId);
  const sorted = [...list].sort((a,b)=>{
    if(a.status==='pending' && b.status!=='pending') return -1;
    if(a.status!=='pending' && b.status==='pending') return 1;
    return (b.requestedAt||'').localeCompare(a.requestedAt||'');
  });

  const html = `
    <div class="page-head">
      <div>
        <h1>${admin?'בקשות עריכה':'הבקשות שלי'}</h1>
        <p>${admin?`בקשות של עובדים לתיקון דיווחי עבודה שדווחו בטעות — ${pendingEditRequestsCount()} ממתינות לאישור`:'בקשות שהגשת לתיקון דיווחי עבודה, וסטטוס הטיפול בהן'}</p>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-primary" onclick="openManualEditRequestForm()">${ICON.plus} בקשת עריכה חדשה</button>
      </div>
    </div>

    <div class="panel">
      <table>
        <thead><tr><th>סטטוס</th>${admin?'<th>עובד</th>':''}<th>הדיווח המקורי</th><th>סיבת הבקשה</th><th>הוגשה</th><th></th></tr></thead>
        <tbody>
          ${sorted.map(r=>{
            const e = state.entries.find(x=>x.id===r.entryId);
            const f = getFreelancer(r.freelancerId);
            const c = e ? getClient(e.clientId) : null;
            const statusPill = r.status==='pending' ? `<span class="pill pill-amber">${ICON.alert} ממתין</span>`
              : r.status==='approved' ? `<span class="pill pill-green">${ICON.check} אושר</span>`
              : `<span class="pill pill-red">${ICON.close} נדחה</span>`;
            const entryCell = e
              ? `<div style="font-weight:600;">${clientDisplayName(c)}</div><div class="cell-muted" style="font-size:12px;">${fmtDateHe(e.date)} · ${e.start}–${e.end}</div>`
              : `<span class="cell-muted">הדיווח נמחק</span>`;
            const actions = admin
              ? (r.status==='pending' && e
                  ? `<div style="display:flex; gap:6px;">
                      <button class="btn btn-sm btn-primary" onclick="approveEditRequest('${r.id}')">${ICON.check} אשר וערוך</button>
                      <button class="btn btn-sm btn-danger-ghost" onclick="rejectEditRequest('${r.id}')">${ICON.close} דחה</button>
                    </div>`
                  : (r.adminNote ? `<div class="cell-muted" style="font-size:12px;">הערה: ${r.adminNote}</div>` : ''))
              : (r.adminNote ? `<div class="cell-muted" style="font-size:12px;">הערת מנהל: ${r.adminNote}</div>` : (r.status==='pending' ? `<span class="cell-muted" style="font-size:12px;">ממתין לטיפול מנהל</span>` : ''));
            return `<tr>
              <td>${statusPill}</td>
              ${admin?`<td>${f?.name||'—'}</td>`:''}
              <td>${entryCell}</td>
              <td style="max-width:260px; font-size:12.5px; line-height:1.5;">${r.reason}</td>
              <td class="cell-muted" style="font-size:12px;">${fmtDateHe(r.requestedAt.slice(0,10))}</td>
              <td>${actions}</td>
            </tr>`;
          }).join('') || `<tr class="empty-row"><td colspan="${admin?6:5}">אין בקשות עריכה${admin?' במערכת':' שהגשת'}</td></tr>`}
        </tbody>
      </table>
    </div>
  `;
  return html;
}

async function approveEditRequest(requestId){
  const r = state.editRequests.find(x=>x.id===requestId);
  if(!r) return;
  try{
    await apiCall(`/edit-requests/${requestId}`, { method:'PATCH', body: JSON.stringify({ status:'approved' }) });
    toast('הבקשה אושרה — ניתן לערוך כעת את הדיווח');
    await refreshData();
    activePage = 'reports';
    renderAll();
    openEntryForm(r.entryId);
  }catch(err){ toast('שגיאה: '+err.message); }
}

function rejectEditRequest(requestId){
  openModal(`
    <div class="modal-head"><h3>דחיית בקשת עריכה</h3><button class="modal-close" onclick="closeModal()">${ICON.close}</button></div>
    <div class="modal-body">
      <div class="field"><label>הערה לעובד (אופציונלי)</label><textarea id="rejectNote" placeholder="לדוגמה: הדיווח המקורי נבדק ונמצא תקין"></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-danger-ghost" onclick="confirmRejectRequest('${requestId}')">${ICON.close} דחה בקשה</button>
      <button class="btn btn-ghost" onclick="closeModal()">ביטול</button>
    </div>
  `);
}

async function confirmRejectRequest(requestId){
  const admin_note = document.getElementById('rejectNote').value.trim();
  try{

function updateTicketDescCounter(){

  const len = el.value.trim().length;
  const ok = len>=10;
  counter.textContent = ok ? `${len} תווים ✓` : `${len}/10 תווים לפחות`;
  counter.style.color = ok ? 'var(--green)' : 'var(--red)';
}

async function saveSupportTicket(){

function fmtTicketDateTime(iso){
  const d = new Date(iso);
  const datePart = d.toLocaleDateString('he-IL',{day:'numeric',month:'long',year:'numeric'});

  return `${datePart} בשעה ${timePart}`;
}

let pendingEmployeeFieldFiles = {};

function renderEmployeeCustomFieldInput(field, f){
  const fv = f?.fieldValues?.[field.id] || {};
  const inputId = `ef_${field.id}`;
  if(field.type === 'file'){
    const current = fv.file_name
      ? `<div class="hint">קובץ נוכחי: <a href="#" onclick="downloadEmployeeField('${f.id}','${field.id}','${fv.file_name}'); return false;">${fv.file_name}</a> (${Math.round((fv.file_size||0)/1024)}KB)</div>`
      : `<div class="hint">לא הועלה קובץ עדיין</div>`;
    return `<div class="field">
      <label>${field.label}</label>
      ${current}
      <input type="file" id="${inputId}" onchange="pendingEmployeeFieldFiles['${field.id}']=this.files[0]">
    </div>`;
  }
  if(field.type === 'textarea'){
    return `<div class="field"><label>${field.label}</label><textarea id="${inputId}">${fv.value||''}</textarea></div>`;
  }
  if(field.type === 'select'){
    return `<div class="field"><label>${field.label}</label>
      <select id="${inputId}">
        <option value="">— לא נבחר —</option>
        ${(field.options||[]).map(o=>`<option value="${o}" ${fv.value===o?'selected':''}>${o}</option>`).join('')}
      </select>
    </div>`;
  }
  const type = field.type === 'url' ? 'url' : 'text';
  return `<div class="field"><label>${field.label}</label><input type="${type}" id="${inputId}" value="${fv.value||''}"></div>`;
}

async function downloadEmployeeField(employeeId, fieldId, fileName){
  try{
    const res = await fetch(`${API}/employees/${employeeId}/fields/${fieldId}/file`, {
      headers: authToken ? { Authorization: `Bearer ${authToken}` } : {},
    });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fileName || 'file';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }catch(err){ toast('שגיאה בהורדת הקובץ: '+err.message); }
}

    full_name: name, email, phone, active, role, business_type: businessType,
    foreign_worker: foreignWorker, hourly_rate: hourlyRate, notes,
    bank_beneficiary: bankBeneficiary, bank_name: bankName, bank_branch: bankBranch,
    bank_account: bankAccount, bank_tax_id: bankTaxId,
  };
  if(password) body.password = password;
  if(!freelancerId && (!password || password.length < 8)){
    toast('יש להזין סיסמה של לפחות 8 תווים לעובד חדש');
    return;
  }

  try{
    let savedId = freelancerId;
    if(freelancerId){
      await apiCall(`/employees/${freelancerId}`, { method:'PATCH', body: JSON.stringify(body) });
      toast('פרטי העובד עודכנו');
    }else{
      const created = await apiCall('/employees', { method:'POST', body: JSON.stringify(body) });
      savedId = created.id;
      toast('העובד נוסף בהצלחה');
    }

    for(const ef of state.employeeFields.filter(ef=>ef.active)){
      if(ef.type === 'file'){
        const file = pendingEmployeeFieldFiles[ef.id];
        if(file) await apiUpload(`/employees/${savedId}/fields/${ef.id}/file`, file);
        continue;
      }
      const el = document.getElementById(`ef_${ef.id}`);
      if(!el) continue;
      await apiCall(`/employees/${savedId}/fields/${ef.id}`, { method:'PUT', body: JSON.stringify({ value: el.value || null }) });
    }

    closeModal();
    await refreshData();
    renderAll();
  }catch(err){
    const el = document.getElementById('frError');
    if(el){ el.textContent = 'שגיאה: '+err.message; el.classList.remove('hidden'); }
    else toast('שגיאה: '+err.message);
  }
}

/* ---------------------------- WEEKLY TIMELINE (בהשראת Toggl) ---------------------------- */
const TL_COLORS = ['#3F9863','#C9822A','#3B6EA5','#8B5FBF','#B08D3E','#4FA8A0','#C2578A','#6B8E4E'];
const TL_START_HOUR = 7;   // תחילת ציר השעות
const TL_END_HOUR = 22;    // סוף ציר השעות
const HE_DAY_NAMES = ['יום א׳','יום ב׳','יום ג׳','יום ד׳','יום ה׳','יום ו׳','שבת'];

let timelineState = { freelancerId:null, weekOffset:0 };

function getClientColor(clientId){
  const idx = state.clients.findIndex(c=>c.id===clientId);
  return TL_COLORS[idx>=0 ? idx % TL_COLORS.length : 0];
}

function getWeekDates(weekOffset){
  const now = new Date();
  const sunday = new Date(now);
  sunday.setDate(now.getDate() - now.getDay() + (weekOffset*7));
  sunday.setHours(0,0,0,0);
  return Array.from({length:7}, (_,i)=>{
    const d = new Date(sunday);
    d.setDate(sunday.getDate()+i);
    return d;
  });
}

function toDateKey(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function openTimelineView(freelancerId){
  timelineState = { freelancerId, weekOffset:0 };
  openModal(renderTimelineModalContent(), true);
}

function changeTimelineWeek(delta){
  timelineState.weekOffset += delta;
  document.getElementById('modalBox').innerHTML = renderTimelineModalContent();
}

function renderTimelineModalContent(){
  const f = getFreelancer(timelineState.freelancerId);
  const weekDates = getWeekDates(timelineState.weekOffset);
  const weekStart = weekDates[0], weekEnd = weekDates[6];
  const weekLabel = timelineState.weekOffset===0
    ? `השבוע · ${weekStart.getDate()}–${weekEnd.getDate()} ב${weekEnd.toLocaleDateString('he-IL',{month:'long'})}`
    : `${weekStart.getDate()}–${weekEnd.getDate()} ב${weekEnd.toLocaleDateString('he-IL',{month:'long'})} ${weekEnd.getFullYear()}`;

  const weekEntries = state.entries.filter(e=>{
    if(e.freelancerId!==timelineState.freelancerId) return false;
    return weekDates.some(d=>toDateKey(d)===e.date);
  });

  const usedClientIds = [...new Set(weekEntries.map(e=>e.clientId))];
  const todayKey = toDateKey(new Date());
  const totalRangeMin = (TL_END_HOUR-TL_START_HOUR)*60;
  const hourMarks = [];
  for(let h=TL_START_HOUR; h<=TL_END_HOUR; h+=3) hourMarks.push(h);

  const dayColumns = weekDates.map(d=>{
    const key = toDateKey(d);
    const dayEntries = weekEntries.filter(e=>e.date===key);
    const dayMinutes = dayEntries.reduce((s,e)=>s+e.minutes,0);
    const isToday = key===todayKey;

    const blocksHtml = dayEntries.map(e=>{
      const [sh,sm] = e.start.split(':').map(Number);
      let startMin = (sh*60+sm) - TL_START_HOUR*60;
      let durMin = e.minutes;
      startMin = Math.max(0, Math.min(startMin, totalRangeMin));
      durMin = Math.max(14, Math.min(durMin, totalRangeMin-startMin));
      const top = (startMin/totalRangeMin)*100;
      const height = (durMin/totalRangeMin)*100;
      const c = getClient(e.clientId);
      const color = getClientColor(e.clientId);
      return `<div class="tl-block" style="top:${top}%; height:${height}%; background:${color};" title="${clientDisplayName(c)} · ${e.start}–${e.end} · ${fmtMinutes(e.minutes)}${e.description?' · '+e.description:''}">
        <div>${e.start}–${e.end}</div>
        <div class="c">${clientDisplayName(c)}</div>
      </div>`;
    }).join('');

    const gridlinesHtml = hourMarks.map(h=>{
      const top = ((h-TL_START_HOUR)*60/totalRangeMin)*100;
      return `<div class="tl-gridline" style="top:${top}%;"></div>`;
    }).join('');

    return `<div class="tl-day-col">
      <div class="tl-day-head ${isToday?'today':''}">
        <div class="d">${HE_DAY_NAMES[d.getDay()]}</div>
        <div class="n">${d.getDate()}/${d.getMonth()+1}</div>
      </div>
      <div class="tl-day-body">
        ${gridlinesHtml}
        ${blocksHtml || `<div class="tl-empty-day">אין דיווחים</div>`}
      </div>
      <div class="tl-day-foot" style="${dayMinutes>=480?'color:var(--amber);':''}">${dayMinutes? fmtHoursShort(dayMinutes)+' ש׳' : '—'}</div>
    </div>`;
  }).join('');

  const axisHtml = `<div class="tl-axis">
    <div class="tl-day-head">&nbsp;</div>
    <div class="tl-day-body">
      ${hourMarks.map(h=>{
        const top = ((h-TL_START_HOUR)*60/totalRangeMin)*100;
        return `<div class="tl-axis-label" style="top:${top}%;">${h}:00</div>`;
      }).join('')}
    </div>
    <div class="tl-day-foot">&nbsp;</div>
  </div>`;

  const weekTotal = weekEntries.reduce((s,e)=>s+e.minutes,0);

  return `
    <div class="modal-head"><h3>ציר זמן שבועי — ${f?.name||'—'}</h3><button class="modal-close" onclick="closeModal()">${ICON.close}</button></div>
    <div class="modal-body">
      <div class="tl-header">
        <div class="tl-nav">
          <button class="icon-btn" onclick="changeTimelineWeek(-1)" title="שבוע קודם">›</button>
          <div class="tl-week-label">${weekLabel}</div>
          <button class="icon-btn" onclick="changeTimelineWeek(1)" title="שבוע הבא">‹</button>
        </div>
        <div class="cell-muted" style="font-size:12.5px;">סה״כ השבוע: <b style="color:var(--ink);">${fmtHoursShort(weekTotal)} ש׳</b></div>
      </div>

      ${usedClientIds.length ? `<div class="tl-legend">
        ${usedClientIds.map(cid=>{
          const c = getClient(cid);
          return `<div class="tl-legend-item"><span class="tl-legend-dot" style="background:${getClientColor(cid)};"></span>${clientDisplayName(c)}</div>`;
        }).join('')}
      </div>` : ''}

      <div class="tl-grid">
        ${dayColumns}
        ${axisHtml}
      </div>
      <div class="hint" style="margin-top:10px;">כל בלוק צבוע לפי הלקוח (ראה מקרא למעלה). עמודה ריקה מסמנת יום ללא דיווח.</div>
    </div>
  `;
}

const TASK_STATUS_LABEL = { new:'חדשה', in_progress:'בטיפול', done:'טופלה' };
const TASK_STATUS_PILL = { new:'pill-gray', in_progress:'pill-amber', done:'pill-green' };

let taskFilters = { freelancerId:'', clientId:'', from:'', to:'' };

function tasksForCurrentView(){
  return isAdmin() ? state.tasks : state.tasks.filter(t=>t.freelancerId===state.currentUserId);
}

  const admin = isAdmin();
  const list = [...tasksForCurrentView()].filter(t=>{
    if(taskFilters.freelancerId && t.freelancerId!==taskFilters.freelancerId) return false;
    if(taskFilters.clientId && t.clientId!==taskFilters.clientId) return false;
    if(taskFilters.from && (!t.deadline || t.deadline<taskFilters.from)) return false;

    if(a.status==='done' && b.status!=='done') return 1;
    if(a.status!=='done' && b.status==='done') return -1;
    if(!a.deadline && b.deadline) return 1;

  });
  const today = todayStr();

  const html = `
    <div class="page-head">
      <div>
        <h1>${admin?'משימות':'המשימות שלי'}</h1>
        <p>${admin?'משימות המקושרות ללקוחות — ניתן לדווח עליהן שעות ישירות מתוך המשימה':'משימות שהוקצו לך — לחץ על משימה כדי להתחיל שעון עבודה מקושר'}</p>
      </div>

    <div class="panel" style="margin-bottom:16px;">
      <div class="panel-pad filters">
        ${admin ? `<select id="tfFilterFreelancer">
          <option value="">כל העובדים</option>
          ${state.freelancers.map(f=>`<option value="${f.id}" ${taskFilters.freelancerId===f.id?'selected':''}>${f.name}</option>`).join('')}
        </select>` : ''}
        <select id="tfFilterClient">
          <option value="">כל הלקוחות</option>
          ${state.clients.map(c=>`<option value="${c.id}" ${taskFilters.clientId===c.id?'selected':''}>${clientDisplayName(c)}</option>`).join('')}
        </select>
        <input type="date" id="tfFilterFrom" value="${taskFilters.from}">
        <input type="date" id="tfFilterTo" value="${taskFilters.to}">
        <button class="btn btn-ghost btn-sm" onclick="clearTaskFilters()">נקה סינון</button>
        ${admin ? `<button class="btn btn-ghost btn-sm" onclick="openSaveListWidgetModal('tasks', {employee_id: taskFilters.freelancerId||undefined, project_id: taskFilters.clientId||undefined, date_from: taskFilters.from||undefined, date_to: taskFilters.to||undefined})">${ICON.plus} שמור תצוגה כ-widget</button>` : ''}
      </div>
    </div>

    <div class="panel">
      <table>
        <thead><tr><th>סטטוס</th><th>תיאור</th><th>לקוח</th>${admin?'<th>עובד</th>':''}<th>דדליין</th><th></th></tr></thead>
        <tbody>
          ${list.map(t=>{
            const c = getClient(t.clientId);
            const f = getFreelancer(t.freelancerId);
            const overdue = t.deadline && t.deadline<today && t.status!=='done';
            const deadlineCell = t.deadline
              ? `<span class="${overdue?'pill pill-red':''}">${fmtDateHe(t.deadline)}</span>`
              : `<span class="cell-muted">—</span>`;
            const runningTimer = state.activeTimers.find(x=>x.taskId===t.id && x.freelancerId===state.currentUserId);
            let timerBtn = '';
            if(t.status!=='done'){
              timerBtn = runningTimer
                ? `${runningTimer.pausedAt
                    ? `<button class="btn btn-sm btn-ghost" onclick="event.stopPropagation(); resumeTimer('${runningTimer.id}')">${ICON.play} המשך</button>`
                    : `<button class="btn btn-sm btn-ghost" onclick="event.stopPropagation(); pauseTimer('${runningTimer.id}')">${ICON.pause} השהה</button>`}
                   <button class="btn btn-sm btn-danger-ghost" onclick="event.stopPropagation(); stopTimer('${runningTimer.id}')">${ICON.stop} עצור</button>`
                : `<button class="btn btn-sm btn-primary" onclick="event.stopPropagation(); startTimerForTask('${t.id}')">${ICON.play} התחל שעון</button>`;
            }
            return `<tr style="cursor:pointer;" onclick="openTaskDetail('${t.id}')">
              <td><span class="pill ${TASK_STATUS_PILL[t.status]}">${TASK_STATUS_LABEL[t.status]}</span></td>
              <td style="max-width:280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${t.description}">${t.description}</td>
              <td>${c?clientDisplayName(c):'<span class="cell-muted">—</span>'}</td>
              ${admin?`<td onclick="event.stopPropagation();">
                <select class="btn-sm" style="max-width:140px;" onchange="assignTaskEmployee('${t.id}', this.value)">
                  <option value="">לא הוקצה</option>
                  ${state.freelancers.map(fr=>`<option value="${fr.id}" ${t.freelancerId===fr.id?'selected':''}>${fr.name}</option>`).join('')}
                </select>
              </td>`:''}
              <td>${deadlineCell}</td>
              <td style="display:flex; gap:6px;">
                ${timerBtn}
                <button class="btn btn-sm btn-ghost" onclick="event.stopPropagation(); openTaskDetail('${t.id}')">פתח</button>
              </td>
            </tr>`;
          }).join('') || `<tr class="empty-row"><td colspan="${admin?6:5}">אין משימות ${admin?'במערכת':'שהוקצו לך'} כרגע</td></tr>`}
        </tbody>
      </table>
    </div>
  `;
  return html;
}

async function assignTaskEmployee(taskId, employeeId){
  try{
    await apiCall(`/tasks/${taskId}`, { method:'PATCH', body: JSON.stringify({ employee_id: employeeId ? Number(employeeId) : null }) });
    await refreshData();
    toast('העובד המקושר עודכן');
    // If the task-detail modal is open on this task, re-render it so the timer
    // button reflects the new assignee immediately instead of waiting for a reopen.
    if(document.getElementById('taskAssigneeSelect')) openTaskDetail(taskId);
    else renderAll();
  }catch(err){ toast('שגיאה: '+err.message); }
}

async function updateTaskStatus(taskId, status){
  try{
    await apiCall(`/tasks/${taskId}`, { method:'PATCH', body: JSON.stringify({ status }) });
    await refreshData();
    toast('סטטוס המשימה עודכן');
    renderAll();
  }catch(err){ toast('שגיאה: '+err.message); }
}

async function startTimerForTask(taskId){
  const myActive = state.activeTimers.filter(t=>t.freelancerId===state.currentUserId);
  const maxConcurrent = state.timerSettings.max_concurrent_timers;
  if(myActive.length>=maxConcurrent){ toast(`הגעת למגבלה של ${maxConcurrent} שעונים פתוחים במקביל`); return; }
  try{
    await apiCall('/time-entries/start', { method:'POST', body: JSON.stringify({ task_id: Number(taskId), source:'web' }) });
    closeModal();
    toast('השעון הופעל והוקשר למשימה');
    await refreshData();
    renderAll();
  }catch(err){ toast('שגיאה: '+err.message); }
}

async function saveTask(taskId){
  const description = document.getElementById('tfDesc').value.trim();
  if(!description){ toast('יש למלא תיאור למשימה'); return; }
  const freelancerField = document.getElementById('tfFreelancer');
  const body = {
    description,
    project_id: document.getElementById('tfClient').value ? Number(document.getElementById('tfClient').value) : null,
    employee_id: freelancerField ? (freelancerField.value ? Number(freelancerField.value) : null) : undefined,
    deadline: document.getElementById('tfDeadline').value || null,
    status: document.getElementById('tfStatus').value,
  };
  try{
    if(taskId) await apiCall(`/tasks/${taskId}`, { method:'PATCH', body: JSON.stringify(body) });
    else await apiCall('/tasks', { method:'POST', body: JSON.stringify(body) });
    closeModal();
    toast(taskId?'המשימה עודכנה':'המשימה נוצרה בהצלחה');
    await refreshData();
    renderAll();
  }catch(err){ toast('שגיאה: '+err.message); }
}

async function deleteTask(taskId){
  if(!confirm('למחוק את המשימה? לא ניתן לשחזר.')) return;
  try{
    await apiCall(`/tasks/${taskId}`, { method:'DELETE' });
    closeModal();
    toast('המשימה נמחקה');
    await refreshData();
    renderAll();
  }catch(err){ toast('שגיאה: '+err.message); }
}

async function createApiKeyForSettings(){
  const name = document.getElementById('newApiKeyName').value.trim();
  if(!name){ toast('צריך לתת שם למפתח'); return; }
  const scopes = [];
  if(document.getElementById('newApiKeyScopeRead').checked) scopes.push('read');
  if(document.getElementById('newApiKeyScopeWrite').checked) scopes.push('write');
  if(!scopes.length){ toast('צריך לבחור לפחות הרשאה אחת'); return; }
  try{
    const created = await apiCall('/api-keys', { method:'POST', body: JSON.stringify({ name, scopes }) });
    await refreshData();
    renderAll();
    openModal(`
      <div class="modal-head"><h3>המפתח נוצר בהצלחה</h3><button class="modal-close" onclick="closeModal()">${ICON.close}</button></div>
      <div class="modal-body">
        <div class="hint" style="margin-bottom:10px;">⚠️ זו הפעם היחידה שהמפתח הזה יוצג. תעתיקו אותו עכשיו ותשמרו אותו במקום בטוח (למשל, תדביקו אותו ישר במסך החיבור של Make) — TreeTime לא יציג אותו שוב.</div>
        <div class="field"><input type="text" id="newApiKeyValue" value="${created.api_key}" readonly onclick="this.select()"></div>
        <button class="btn btn-primary btn-block" style="margin-top:10px;" onclick="copyNewApiKey()">העתק מפתח</button>
      </div>
      <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">סגור</button></div>
    `);
  }catch(err){ toast('שגיאה: '+err.message); }
}

function copyNewApiKey(){
  const el = document.getElementById('newApiKeyValue');
  el.select();
  navigator.clipboard?.writeText(el.value).then(()=>toast('המפתח הועתק')).catch(()=>toast('לא ניתן היה להעתיק אוטומטית — יש להעתיק ידנית'));
}

async function revokeApiKeyFromSettings(id){
  if(!confirm('לבטל את המפתח? כל אינטגרציה שמשתמשת בו (למשל ב-Make) תפסיק לעבוד מיד.')) return;
  try{
    await apiCall(`/api-keys/${id}`, { method:'DELETE' });
    await refreshData();
    renderAll();
    toast('המפתח בוטל');
  }catch(err){ toast('שגיאה: '+err.message); }
}

        ${row('התראה על הודעות ותגובות חדשות בתמיכה מסופר האדמין של טריטק', 'support_reply_notify_admin', 'support_reply_notify_employee', 'support_reply_email_admin', 'support_reply_email_employee')}
      </tbody>
    </table>
    <div class="hint" style="margin-top:10px;">איפוס סיסמה, אישור חשבון, והודעות אבטחה נשלחים במייל תמיד ואינם ניתנים לכיבוי כאן.</div>
    <div style="margin-top:16px; padding-top:16px; border-top:1px solid var(--border);">
      <button class="btn btn-primary" onclick="saveNotificationSettings()">${ICON.check} שמור הרשאות התראות</button>
    </div>
  `;
}

  const body = {
    quota80_notify_admin: document.getElementById('n_quota80_notify_admin').checked,
    quota80_notify_employee: document.getElementById('n_quota80_notify_employee').checked,
    edit_request_notify_admin: document.getElementById('n_edit_request_notify_admin').checked,
    support_reply_notify_admin: document.getElementById('n_support_reply_notify_admin').checked,
    support_reply_notify_employee: document.getElementById('n_support_reply_notify_employee').checked,
    quota80_email_admin: document.getElementById('n_quota80_email_admin').checked,
    quota80_email_employee: document.getElementById('n_quota80_email_employee').checked,
    edit_request_email_admin: document.getElementById('n_edit_request_email_admin').checked,
    support_reply_email_admin: document.getElementById('n_support_reply_email_admin').checked,
    support_reply_email_employee: document.getElementById('n_support_reply_email_employee').checked,
  };
  try{
    await apiCall('/notification-settings', { method:'PATCH', body: JSON.stringify(body) });
    await refreshData();
    toast('הרשאות ההתראות נשמרו בהצלחה');
    renderAll();
  }catch(err){ toast('שגיאה: '+err.message); }
}

function toggleAutoCloseFields(){
  const enabled = document.getElementById('sAutoCloseEnabled').value === 'true';
  document.getElementById('autoCloseFieldsWrap').style.display = enabled ? 'block' : 'none';
}

function toggleAutoCloseModeFields(){
  const mode = document.getElementById('sAutoCloseMode').value;
  document.getElementById('autoCloseHoursWrap').style.display = mode==='hours' ? 'block' : 'none';
  document.getElementById('autoCloseTimeWrap').style.display = mode==='time' ? 'block' : 'none';
}

function saveSettings(){
  const autoCloseEnabled = document.getElementById('sAutoCloseEnabled').value === 'true';
  const autoCloseMode = document.getElementById('sAutoCloseMode') ? document.getElementById('sAutoCloseMode').value : state.settings.autoCloseMode;
  const autoCloseAfterHours = document.getElementById('sAutoCloseHours') ? (Number(document.getElementById('sAutoCloseHours').value)||8) : state.settings.autoCloseAfterHours;
  const autoCloseTime = document.getElementById('sAutoCloseTime') ? document.getElementById('sAutoCloseTime').value : state.settings.autoCloseTime;

  state.settings = { autoCloseEnabled, autoCloseMode, autoCloseAfterHours, autoCloseTime };
  persist();
  toast('ההגדרות נשמרו בהצלחה');
  renderAll();
}

async function saveTimerLimitSettings(){
  const max_concurrent_timers = Number(document.getElementById('sMaxConcurrentTimers').value);
  if(!max_concurrent_timers || max_concurrent_timers < 1 || max_concurrent_timers > 20){
    toast('יש להזין מספר בין 1 ל-20');
    return;
  }
  try{
    state.timerSettings = await apiCall('/timer-settings', { method:'PATCH', body: JSON.stringify({ max_concurrent_timers }) });
    toast('ההגדרה נשמרה בהצלחה');
    renderAll();
  }catch(err){ toast('שגיאה: '+err.message); }
}

/* בדיקה תקופתית: סוגרת אוטומטית שעונים פתוחים לפי ההגדרות שהוגדרו למנהל המערכת */
function checkAutoCloseTimers(){
  const s = state.settings;
  if(!s || !s.autoCloseEnabled || !state.activeTimers.length) return false;

  const now = new Date();
  const stillOpen = [];
  let changed = false;

  state.activeTimers.forEach(t=>{
    let shouldClose = false;
    if(s.autoCloseMode === 'hours'){
      if(elapsedMinutes(t) >= s.autoCloseAfterHours*60) shouldClose = true;
    }else if(s.autoCloseMode === 'time'){
      const [h,m] = (s.autoCloseTime||'23:00').split(':').map(Number);
      const cutoff = new Date(); cutoff.setHours(h,m,0,0);
      if(now >= cutoff && new Date(t.startedAt) < cutoff) shouldClose = true;
    }
    if(shouldClose){
      autoCloseTimer(t, now);
      changed = true;
    }else{
      stillOpen.push(t);
    }
  });

  if(changed){
    state.activeTimers = stillOpen;
    persist();
  }
  return changed;
}

function autoCloseTimer(t, endMoment){
  const startedDate = new Date(t.startedAt);
  const minutes = Math.max(1, Math.round((endMoment-startedDate)/60000));
  const startTime = `${String(startedDate.getHours()).padStart(2,'0')}:${String(startedDate.getMinutes()).padStart(2,'0')}`;
  const endTime = `${String(endMoment.getHours()).padStart(2,'0')}:${String(endMoment.getMinutes()).padStart(2,'0')}`;
  const f = getFreelancer(t.freelancerId);
  const rateSnapshot = parseRate(f?.hourlyRate);
  const cost = computeCost(minutes, rateSnapshot);
  const id = 'e'+genId('entry');
  state.entries.push({
    id, freelancerId:t.freelancerId, clientId:t.clientId,
    date: todayStr(), start:startTime, end:endTime, minutes,
    description:'השעון נסגר אוטומטית ע"י המערכת (נשאר פתוח) — נא לעדכן תיאור מדויק או לפתוח בקשת עריכה',
    rateSnapshot, cost, autoClosed:true
  });
  toast(`השעון של ${f?.name||'—'} נסגר אוטומטית — נשלחה הודעה למנהל המערכת ול-${f?.name||'—'} (סימולציה)`);
}

/* ---------------------------- GLOBAL FLOATING TIMER WIDGET ---------------------------- */
/* זמין בכל המערכת (חוץ מדף הגדרות, שטרם קיים) — התאמה לאוטומציה "הפעלת זמן עבודה" */
function renderGlobalTimerWidget(){
  const wrap = document.getElementById('globalTimerWidget');
  if(!wrap) return;
  const myActive = state.activeTimers.filter(t=>t.freelancerId===state.currentUserId);
  const maxConcurrent = state.timerSettings.max_concurrent_timers;
  const canStartMore = myActive.length < maxConcurrent;

  const miniCards = myActive.map(t=>{
    const c = getClient(t.clientId);
    const over = elapsedMinutes(t)>=240;
    const paused = !!t.pausedAt;
    return `<div class="mini-timer-card ${over?'overtime':''} ${paused?'paused':''}" style="cursor:pointer;" onclick="openTimerDetail('${t.id}')">
      <div class="pulse"></div>
      <div class="info">
        <div class="name">${clientDisplayName(c)}${paused?' · מוקפא':''}</div>
        <div class="clock mono" data-timer-clock="${t.id}">${elapsedClock(t)}</div>
      </div>
      ${paused
        ? `<button class="mini-stop" title="המשך שעון" onclick="event.stopPropagation(); resumeTimer('${t.id}')">${ICON.play}</button>`
        : `<button class="mini-stop" title="השהה שעון" onclick="event.stopPropagation(); pauseTimer('${t.id}')">${ICON.pause}</button>`}
      <button class="mini-stop" title="עצור שעון" onclick="event.stopPropagation(); stopTimer('${t.id}')">${ICON.stop}</button>
    </div>`;
  }).join('');

  const fabLabel = !canStartMore
    ? `הגעת למגבלה של ${maxConcurrent} דיווחים במקביל`
    : (myActive.length ? 'פתח דיווח עבודה נוסף' : 'התחל שעון עבודה');

  wrap.innerHTML = `
    ${miniCards}
    <div class="fab-wrap">
      <button class="fab-start ${canStartMore?'':'disabled'}" aria-label="${fabLabel}"
        onclick="${canStartMore?'openQuickStartTimer()':`toast('הגעת למגבלה של ${maxConcurrent} שעונים פתוחים במקביל — עצור שעון קיים כדי לפתוח חדש')`}">
        ${ICON.play}<span>${fabLabel}</span>
      </button>
    </div>
  `;
}

function openQuickStartTimer(){
  const myClients = clientsForFreelancer(state.currentUserId);
  if(!myClients.length){
    toast('אין לקוחות המקושרים אליך — פנה למנהל המערכת');
    return;
  }
  const myTasks = state.tasks.filter(t=>t.freelancerId===state.currentUserId && t.status!=='done');
  openModal(`
    <div class="modal-head"><h3>התחלת שעון עבודה</h3><button class="modal-close" onclick="closeModal()">${ICON.close}</button></div>
    <div class="modal-body">
      <div class="field">
        <label>לקוח</label>
        <select id="quickClientSelect">
          ${myClients.map(c=>`<option value="${c.id}">${clientDisplayName(c)}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>קישור למשימה (אופציונלי)</label>
        <select id="quickTaskSelect" onchange="onQuickTaskChange()">
          <option value="">ללא קישור למשימה</option>
          ${myTasks.map(t=>`<option value="${t.id}" data-client="${t.clientId||''}">${t.description.slice(0,60)}</option>`).join('')}
        </select>
        ${myTasks.length ? '<div class="hint">בחירת משימה תקשר את השעון אליה, ותקבע את הלקוח אוטומטית לפי הלקוח שמוגדר במשימה</div>' : ''}
      </div>
      <div class="hint">השעון יתחיל לרוץ מיד מרגע הלחיצה על "התחל שעון"</div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-primary" onclick="quickStartTimer()">${ICON.play} התחל שעון</button>
      <button class="btn btn-ghost" onclick="closeModal()">ביטול</button>
    </div>
  `);
}

function onQuickTaskChange(){
  const taskSel = document.getElementById('quickTaskSelect');
  const clientSel = document.getElementById('quickClientSelect');
  const opt = taskSel.options[taskSel.selectedIndex];
  const clientId = opt?.dataset.client;
  if(taskSel.value && clientId){
    clientSel.value = clientId;
    clientSel.disabled = true;
  }else{
    clientSel.disabled = false;
  }
}

async function quickStartTimer(){
  const clientId = document.getElementById('quickClientSelect').value;
  const taskId = document.getElementById('quickTaskSelect')?.value;
  const myActive = state.activeTimers.filter(t=>t.freelancerId===state.currentUserId);
  const maxConcurrent = state.timerSettings.max_concurrent_timers;
  if(myActive.length>=maxConcurrent){ toast(`הגעת למגבלה של ${maxConcurrent} שעונים פתוחים במקביל`); closeModal(); return; }
  try{
    await apiCall('/time-entries/start', { method:'POST', body: JSON.stringify({ project_id: clientId?Number(clientId):null, task_id: taskId?Number(taskId):null, source:'web' }) });
    closeModal();
    toast(taskId ? 'השעון הופעל והוקשר למשימה' : 'השעון הופעל בהצלחה');
    await refreshData();
    renderAll();
  }catch(err){ toast('שגיאה: '+err.message); }
}

/* ---------------------------- RENDER ROOT ---------------------------- */
function renderAll(){
  renderNav();
  renderRoleSwitch();
  renderUserSwitch();
  renderGlobalTimerWidget();
  renderNotifBell();
  const main = document.getElementById('main');

  // הגנה נוספת: עמודים אלו מיועדים למנהל מערכת בלבד
  if(!isAdmin() && ['clients','freelancers','settings','support'].includes(activePage)){
    activePage = 'dashboard';
  }

  if(activePage==='dashboard') main.innerHTML = isAdmin() ? renderDashboard() : renderPersonalDashboard();
  else if(activePage==='clients') main.innerHTML = renderClientsPage();
  else if(activePage==='reports') main.innerHTML = renderReportsPage();
  else if(activePage==='editRequests') main.innerHTML = renderEditRequestsPage();
  else if(activePage==='support') main.innerHTML = renderSupportPage();
  else if(activePage==='freelancers') main.innerHTML = renderFreelancersPage();
  else if(activePage==='settings') main.innerHTML = renderSettingsPage();
  else if(activePage==='guides') main.innerHTML = renderGuidesPage();
  else if(activePage==='myAccount') main.innerHTML = renderMyAccountPage();
  else if(activePage==='tasks') main.innerHTML = renderTasksPage();

  if(activePage==='dashboard' && isAdmin()){
    renderTimerLists();
    renderDashboardWidgetLists();
    wireDashboardWidgetInteractions();
  }
  if(activePage==='reports'){
    bindReportFilters();
  }
  if(activePage==='tasks'){
    bindTaskFilters();
  }
}

/* live clock tick for running timers */
setInterval(()=>{
  if(!state.activeTimers.length) return;
  document.querySelectorAll('[data-timer-clock]').forEach(el=>{
    const t = state.activeTimers.find(x=>x.id===el.dataset.timerClock);
    if(t) el.textContent = elapsedClock(t);
  });
  // refresh overtime styling / badges every minute boundary without full rerender cost
}, 1000);

/* refresh full page every 30s while on timer/dashboard to catch 4h-overtime transitions,
   and check whether any open timers need to be auto-closed per admin settings */
setInterval(()=>{
  const autoClosed = checkAutoCloseTimers();
  if(autoClosed || activePage==='dashboard') renderAll();
}, 30000);

/* ---------------------------- INIT ---------------------------- */
if(authToken) boot();

</script>
