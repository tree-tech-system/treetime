      <td style="text-align:center;"><input type="checkbox" id="n_${adminKey}" ${n[adminKey]?'checked':''}></td>
      <td style="text-align:center;">${employeeKey
        ? `<input type="checkbox" id="n_${employeeKey}" ${n[employeeKey]?'checked':''}>`
        : `<span class="cell-muted" style="font-size:12px;">לא רלוונטי — התראה זו למנהל בלבד</span>`}</td>
    </tr>
  `;
  return `
    <div class="sub" style="margin-bottom:12px;">בחר על מה לקבל התראה, ולמי</div>
    <table>
      <thead><tr><th></th><th style="text-align:center;">התראה למנהל המערכת</th><th style="text-align:center;">התראה לעובד / משתמש פרילנסר</th></tr></thead>
      <tbody>
        ${row('התראה על ניצול של 80% מהחבילה', 'quota80_notify_admin', 'quota80_notify_employee')}
        ${row('התראה על בקשה חדשה לתיקון דיווח', 'edit_request_notify_admin', null)}
        ${row('התראה על הודעות ותגובות חדשות בתמיכה מסופר האדמין של טריטק', 'support_reply_notify_admin', 'support_reply_notify_employee')}
      </tbody>
    </table>
    <div style="margin-top:16px; padding-top:16px; border-top:1px solid var(--border);">
      <button class="btn btn-primary" onclick="saveNotificationSettings()">${ICON.check} שמור הרשאות התראות</button>
    </div>
  `;
}

async function saveNotificationSettings(){
  const body = {
    quota80_notify_admin: document.getElementById('n_quota80_notify_admin').checked,
    quota80_notify_employee: document.getElementById('n_quota80_notify_employee').checked,
    edit_request_notify_admin: document.getElementById('n_edit_request_notify_admin').checked,
    support_reply_notify_admin: document.getElementById('n_support_reply_notify_admin').checked,
    support_reply_notify_employee: document.getElementById('n_support_reply_notify_employee').checked,
  };
  try{
    await apiCall('/notification-settings', { method:'PATCH', body: JSON.stringify(body) });
    await refreshData();
    toast('הרשאות ההתראות נשמרו בהצלחה');
    renderAll();
  }catch(err){ toast('שגיאה: '+err.message); }
}

function toggleAutoCloseFields(){
  const enabled = document.getElementById('sAutoCloseEnabled').value === 'true';
  document.getElementById('autoCloseFieldsWrap').style.display = enabled ? 'block' : 'none';
}

function toggleAutoCloseModeFields(){
  const mode = document.getElementById('sAutoCloseMode').value;
  document.getElementById('autoCloseHoursWrap').style.display = mode==='hours' ? 'block' : 'none';
  document.getElementById('autoCloseTimeWrap').style.display = mode==='time' ? 'block' : 'none';
}

function saveSettings(){
  const autoCloseEnabled = document.getElementById('sAutoCloseEnabled').value === 'true';
  const autoCloseMode = document.getElementById('sAutoCloseMode') ? document.getElementById('sAutoCloseMode').value : state.settings.autoCloseMode;
  const autoCloseAfterHours = document.getElementById('sAutoCloseHours') ? (Number(document.getElementById('sAutoCloseHours').value)||8) : state.settings.autoCloseAfterHours;
  const autoCloseTime = document.getElementById('sAutoCloseTime') ? document.getElementById('sAutoCloseTime').value : state.settings.autoCloseTime;

  state.settings = { autoCloseEnabled, autoCloseMode, autoCloseAfterHours, autoCloseTime };
  persist();
  toast('ההגדרות נשמרו בהצלחה');
  renderAll();
}

/* בדיקה תקופתית: סוגרת אוטומטית שעונים פתוחים לפי ההגדרות שהוגדרו למנהל המערכת */
function checkAutoCloseTimers(){
  const s = state.settings;
  if(!s || !s.autoCloseEnabled || !state.activeTimers.length) return false;

  const now = new Date();
  const stillOpen = [];
  let changed = false;

  state.activeTimers.forEach(t=>{
    let shouldClose = false;
    if(s.autoCloseMode === 'hours'){
      if(elapsedMinutes(t.startedAt) >= s.autoCloseAfterHours*60) shouldClose = true;
    }else if(s.autoCloseMode === 'time'){
      const [h,m] = (s.autoCloseTime||'23:00').split(':').map(Number);
      const cutoff = new Date(); cutoff.setHours(h,m,0,0);
      if(now >= cutoff && new Date(t.startedAt) < cutoff) shouldClose = true;
    }
    if(shouldClose){
      autoCloseTimer(t, now);
      changed = true;
    }else{
      stillOpen.push(t);
    }
  });

  if(changed){
    state.activeTimers = stillOpen;
    persist();
  }
  return changed;
}

function autoCloseTimer(t, endMoment){
  const startedDate = new Date(t.startedAt);
  const minutes = Math.max(1, Math.round((endMoment-startedDate)/60000));
  const startTime = `${String(startedDate.getHours()).padStart(2,'0')}:${String(startedDate.getMinutes()).padStart(2,'0')}`;
  const endTime = `${String(endMoment.getHours()).padStart(2,'0')}:${String(endMoment.getMinutes()).padStart(2,'0')}`;
  const f = getFreelancer(t.freelancerId);
  const rateSnapshot = parseRate(f?.hourlyRate);
  const cost = computeCost(minutes, rateSnapshot);
  const id = 'e'+genId('entry');
  state.entries.push({
    id, freelancerId:t.freelancerId, clientId:t.clientId,
    date: todayStr(), start:startTime, end:endTime, minutes,
    description:'השעון נסגר אוטומטית ע"י המערכת (נשאר פתוח) — נא לעדכן תיאור מדויק או לפתוח בקשת עריכה',
    rateSnapshot, cost, autoClosed:true
  });
  toast(`השעון של ${f?.name||'—'} נסגר אוטומטית — נשלחה הודעה למנהל המערכת ול-${f?.name||'—'} (סימולציה)`);
}

/* ---------------------------- GLOBAL FLOATING TIMER WIDGET ---------------------------- */
/* זמין בכל המערכת (חוץ מדף הגדרות, שטרם קיים) — התאמה לאוטומציה "הפעלת זמן עבודה" */
function renderGlobalTimerWidget(){
  const wrap = document.getElementById('globalTimerWidget');
  if(!wrap) return;
  const myActive = state.activeTimers.filter(t=>t.freelancerId===state.currentUserId);
  const canStartMore = myActive.length < 3;

  const miniCards = myActive.map(t=>{
    const c = getClient(t.clientId);
    const over = elapsedMinutes(t.startedAt)>=240;
    return `<div class="mini-timer-card ${over?'overtime':''}">
      <div class="pulse"></div>
      <div class="info">
        <div class="name">${clientDisplayName(c)}</div>
        <div class="clock mono" data-timer-clock="${t.id}">${elapsedClock(t.startedAt)}</div>
      </div>
      <button class="mini-stop" title="עצור שעון" onclick="stopTimer('${t.id}')">${ICON.stop}</button>
    </div>`;
  }).join('');

  const fabLabel = !canStartMore
    ? 'הגעת למגבלה של 3 דיווחים במקביל'
    : (myActive.length ? 'פתח דיווח עבודה נוסף' : 'התחל שעון עבודה');

  wrap.innerHTML = `
    ${miniCards}
    <div class="fab-wrap">
      <button class="fab-start ${canStartMore?'':'disabled'}" aria-label="${fabLabel}"
        onclick="${canStartMore?'openQuickStartTimer()':"toast('הגעת למגבלה של 3 שעונים פתוחים במקביל — עצור שעון קיים כדי לפתוח חדש')"}">
        ${ICON.play}<span>${fabLabel}</span>
      </button>
    </div>
  `;
}

function openQuickStartTimer(){
  const myClients = clientsForFreelancer(state.currentUserId);
  if(!myClients.length){
    toast('אין לקוחות המקושרים אליך — פנה למנהל המערכת');
    return;
  }
  const myTasks = state.tasks.filter(t=>t.freelancerId===state.currentUserId && t.status!=='done');
  openModal(`
    <div class="modal-head"><h3>התחלת שעון עבודה</h3><button class="modal-close" onclick="closeModal()">${ICON.close}</button></div>
    <div class="modal-body">
      <div class="field">
        <label>לקוח</label>
        <select id="quickClientSelect">
          ${myClients.map(c=>`<option value="${c.id}">${clientDisplayName(c)}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>קישור למשימה (אופציונלי)</label>
        <select id="quickTaskSelect" onchange="onQuickTaskChange()">
          <option value="">ללא קישור למשימה</option>
          ${myTasks.map(t=>`<option value="${t.id}" data-client="${t.clientId||''}">${t.description.slice(0,60)}</option>`).join('')}
        </select>
        ${myTasks.length ? '<div class="hint">בחירת משימה תקשר את השעון אליה, ותקבע את הלקוח אוטומטית לפי הלקוח שמוגדר במשימה</div>' : ''}
      </div>
      <div class="hint">השעון יתחיל לרוץ מיד מרגע הלחיצה על "התחל שעון"</div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-primary" onclick="quickStartTimer()">${ICON.play} התחל שעון</button>
      <button class="btn btn-ghost" onclick="closeModal()">ביטול</button>
    </div>
  `);
}

function onQuickTaskChange(){
  const taskSel = document.getElementById('quickTaskSelect');
  const clientSel = document.getElementById('quickClientSelect');
  const opt = taskSel.options[taskSel.selectedIndex];
  const clientId = opt?.dataset.client;
  if(taskSel.value && clientId){
    clientSel.value = clientId;
    clientSel.disabled = true;
  }else{
    clientSel.disabled = false;
  }
}

async function quickStartTimer(){
  const clientId = document.getElementById('quickClientSelect').value;
  const taskId = document.getElementById('quickTaskSelect')?.value;
  const myActive = state.activeTimers.filter(t=>t.freelancerId===state.currentUserId);
  if(myActive.length>=3){ toast('הגעת למגבלה של 3 שעונים פתוחים במקביל'); closeModal(); return; }
  try{
    await apiCall('/time-entries/start', { method:'POST', body: JSON.stringify({ project_id: clientId?Number(clientId):null, task_id: taskId?Number(taskId):null, source:'web' }) });
    closeModal();
    toast(taskId ? 'השעון הופעל והוקשר למשימה' : 'השעון הופעל בהצלחה');
    await refreshData();
    renderAll();
  }catch(err){ toast('שגיאה: '+err.message); }
}

/* ---------------------------- RENDER ROOT ---------------------------- */
function renderAll(){
  renderNav();
  renderRoleSwitch();
  renderUserSwitch();
  renderGlobalTimerWidget();
  renderNotifBell();
  const main = document.getElementById('main');

  // הגנה נוספת: עמודים אלו מיועדים למנהל מערכת בלבד
  if(!isAdmin() && ['clients','freelancers','settings','support'].includes(activePage)){
    activePage = 'dashboard';
  }

  if(activePage==='dashboard') main.innerHTML = isAdmin() ? renderDashboard() : renderPersonalDashboard();
  else if(activePage==='clients') main.innerHTML = renderClientsPage();
  else if(activePage==='reports') main.innerHTML = renderReportsPage();
  else if(activePage==='editRequests') main.innerHTML = renderEditRequestsPage();
  else if(activePage==='support') main.innerHTML = renderSupportPage();
  else if(activePage==='freelancers') main.innerHTML = renderFreelancersPage();
  else if(activePage==='settings') main.innerHTML = renderSettingsPage();
  else if(activePage==='guides') main.innerHTML = renderGuidesPage();
  else if(activePage==='myAccount') main.innerHTML = renderMyAccountPage();
  else if(activePage==='tasks') main.innerHTML = renderTasksPage();

  if(activePage==='dashboard' && isAdmin()){
    renderTimerLists();
  }
  if(activePage==='reports'){
    bindReportFilters();
  }
  if(activePage==='tasks'){
    bindTaskFilters();
  }
}

/* live clock tick for running timers */
setInterval(()=>{
  if(!state.activeTimers.length) return;
  document.querySelectorAll('[data-timer-clock]').forEach(el=>{
    const t = state.activeTimers.find(x=>x.id===el.dataset.timerClock);
    if(t) el.textContent = elapsedClock(t.startedAt);
  });
  // refresh overtime styling / badges every minute boundary without full rerender cost
}, 1000);

/* refresh full page every 30s while on timer/dashboard to catch 4h-overtime transitions,
   and check whether any open timers need to be auto-closed per admin settings */
setInterval(()=>{
  const autoClosed = checkAutoCloseTimers();
  if(autoClosed || activePage==='dashboard') renderAll();
}, 30000);

/* ---------------------------- INIT ---------------------------- */
if(authToken) boot();

</script>
